    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==============================================================================
        // ⚙️ הגדרות חיבור למסד הנתונים FIREBASE
        // הדבק כאן את הקוד שקיבלת מ-Firebase Console במידה ואתה מארח את האתר באופן עצמאי
        // ==============================================================================
        const CUSTOM_FIREBASE_CONFIG = {
            apiKey: "AIzaSyAOA9HoyXk1nZ8MPX4Ri-YYlpIQ5NYsch8",
			authDomain: "course-registration-c3f3b.firebaseapp.com",
			projectId: "course-registration-c3f3b",
			storageBucket: "course-registration-c3f3b.firebasestorage.app",
			messagingSenderId: "112925799307",
			appId: "1:112925799307:web:dd268ba023e09c1452b58e"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'course-reg-sys';
        
        // בחירת הגדרות – עדיפות להגדרות מותאמות אישית אם הוגדרו, אחרת שימוש בסביבת ההרצה
        const firebaseConfig = (CUSTOM_FIREBASE_CONFIG && Object.keys(CUSTOM_FIREBASE_CONFIG).length > 0)
            ? CUSTOM_FIREBASE_CONFIG
            : (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null);
        
        // Expose Firebase API to window so React (Babel) can access it
        window.FirebaseAPI = {
            appId,
            isConfigured: !!firebaseConfig,
            init: async () => {
                if (!firebaseConfig) {
                    console.warn("Firebase config missing. Running in demo / unconfigured mode.");
                    return null;
                }
                try {
                    const app = initializeApp(firebaseConfig);
                    const db = getFirestore(app);
                    const auth = getAuth(app);
                    window.FirebaseAPI.db = db;
                    window.FirebaseAPI.auth = auth;
                    window.FirebaseAPI.doc = doc;
                    window.FirebaseAPI.getDoc = getDoc;
                    window.FirebaseAPI.getDocs = getDocs;
                    window.FirebaseAPI.setDoc = setDoc;
                    window.FirebaseAPI.updateDoc = updateDoc;
                    window.FirebaseAPI.deleteDoc = deleteDoc;
                    window.FirebaseAPI.onSnapshot = onSnapshot;
                    window.FirebaseAPI.collection = collection;
                    
                    if (typeof __initial_auth_token !== 'undefined') {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    return auth.currentUser;
                } catch (e) {
                    console.error("Firebase init failed:", e);
                    return null;
                }
            },
            getPublicDataRef: (colName) => collection(window.FirebaseAPI.db, 'artifacts', appId, 'public', 'data', colName),
            getPublicDocRef: (colName, docId) => doc(window.FirebaseAPI.db, 'artifacts', appId, 'public', 'data', colName, String(docId))
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // פונקציית עזר להצפנת סיסמה (SHA-256) למניעת שמירת סיסמה גלויה במסד הנתונים
        const hashString = async (str) => {
            const msgUint8 = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        };
const defaultSettings = {
            schoolName: "מרכז מדע ודעת למצטיינים ומחוננים תל-חי",
            year: "תשפ\"ו",
            welcomeTitle: "טופס רישום לקורסים תוכנית המצטיינים",
            welcomeText: "תלמידות תלמידים והורים יקרים!\nמצורף טופס בחירת קורסים לשנת תשפ\"ו. אנא בחרו את הקורסים המועדפים עליכם מתוך הקורסים הבאים.\n\nשימו לב, הבחירה היא לשתי מחציות - בכל מחצית בחרו 2 קורסים - אופציה ראשונה ואופציה שנייה.\nאין אנו מבטיחים שתשובצו בקורסים שתבחרו כאופציה א - אך אנו נעשה את מירב המאמצים להתחשב בבחירתכם."
        };

        // --- Main App Component (Handles Data Sync) ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [loading, setLoading] = useState(true);
            const [configMissing, setConfigMissing] = useState(false);
            
            // Global Data States
            const [settings, setSettings] = useState(defaultSettings);
            const [grades, setGrades] = useState([]);
            const [courses, setCourses] = useState([]);
            const [students, setStudents] = useState([]);
            const [campuses, setCampuses] = useState([]);

            useEffect(() => {
                const setupFirebase = async () => {
                    if (!window.FirebaseAPI.isConfigured) {
                        setConfigMissing(true);
                        setLoading(false);
                        return;
                    }
                    const currentUser = await window.FirebaseAPI.init();
                    setUser(currentUser);
                };
                setTimeout(setupFirebase, 400); 
            }, []);

            useEffect(() => {
                if (!user || !window.FirebaseAPI.db) return;

                const db = window.FirebaseAPI;
                
                // 1. Listen to Settings
                const unsubSettings = db.onSnapshot(db.getPublicDocRef('settings', 'main'), (doc) => {
                    if (doc.exists()) setSettings(doc.data());
                    else db.setDoc(db.getPublicDocRef('settings', 'main'), defaultSettings);
                }, (err) => console.error(err));

                // 2. Listen to Grades
                const unsubGrades = db.onSnapshot(db.getPublicDataRef('grades'), (snapshot) => {
                    const g = [];
                    snapshot.forEach(doc => g.push({ id: doc.id, ...doc.data() }));
                    if(g.length === 0) {
                        const defaultGrades = [{id: "grade1", name: "כיתות ג'-ה'", campusId: "campus1"}, {id: "grade2", name: "כיתות ו'-ט'", campusId: "campus1"}];
                        defaultGrades.forEach(grade => db.setDoc(db.getPublicDocRef('grades', grade.id), { name: grade.name, campusId: grade.campusId }));
                    } else {
                        setGrades(g);
                    }
                }, (err) => console.error(err));

                // 3. Listen to Courses
                const unsubCourses = db.onSnapshot(db.getPublicDataRef('courses'), (snapshot) => {
                    const c = [];
                    snapshot.forEach(doc => c.push({ id: doc.id, ...doc.data() }));
                    setCourses(c);
                }, (err) => console.error(err));

                // 4. Listen to Students
                const unsubStudents = db.onSnapshot(db.getPublicDataRef('students'), (snapshot) => {
                    const s = [];
                    snapshot.forEach(doc => s.push({ id: doc.id, ...doc.data() }));
                    setStudents(s);
                    setLoading(false);
                }, (err) => console.error(err));

                // 5. Listen to Campuses
                const unsubCampuses = db.onSnapshot(db.getPublicDataRef('campuses'), (snapshot) => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    const legacyKatzrin = list.find(c => c.id === 'campus2' && (c.name === 'קמפוס ב׳' || c.name === 'קמפוס ב'));
                    if (legacyKatzrin) {
                        db.setDoc(db.getPublicDocRef('campuses', 'campus2'), { ...legacyKatzrin, name: 'קמפוס קצרין' }, { merge: true });
                    }
                    if (list.length === 0) {
                        db.setDoc(db.getPublicDocRef('campuses', 'campus1'), { name: 'קמפוס תל-חי', active: true, registrationOpen: true });
                        db.setDoc(db.getPublicDocRef('campuses', 'campus2'), { name: 'קמפוס קצרין', active: true, registrationOpen: true });
                    } else {
                        setCampuses(list);
                    }
                }, (err) => console.error(err));

                return () => {
                    unsubSettings(); unsubGrades(); unsubCourses(); unsubStudents(); unsubCampuses();
                };
            }, [user]);

            // Database mutation helpers
            const dbMethods = {
                saveSettings: async (newSettings) => {
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('settings', 'main'), newSettings);
                },
                addGrade: async (name, campusId) => {
                    const id = 'grade_' + Date.now();
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('grades', id), { name, campusId });
                },
                updateGrade: async (id, name, campusId) => {
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('grades', id), { name, ...(campusId ? { campusId } : {}) }, { merge: true });
                },
                deleteGrade: async (id) => {
                    await window.FirebaseAPI.deleteDoc(window.FirebaseAPI.getPublicDocRef('grades', id));
                },
                saveCourse: async (courseData) => {
                    const id = courseData.id || 'course_' + Date.now();
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('courses', id), courseData);
                },
                deleteCourse: async (id) => {
                    await window.FirebaseAPI.deleteDoc(window.FirebaseAPI.getPublicDocRef('courses', id));
                },
                saveCampus: async (campusData) => {
                    const id = campusData.id || 'campus_' + Date.now();
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('campuses', id), {
                        name: campusData.name,
                        active: campusData.active !== false,
                        registrationOpen: campusData.registrationOpen !== false
                    });
                },
                deleteCampus: async (id) => {
                    await window.FirebaseAPI.deleteDoc(window.FirebaseAPI.getPublicDocRef('campuses', id));
                },
                registerStudent: async (studentData) => {
                    const id = 'student_' + Date.now();
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('students', id), studentData);
                    
                    const primarySelections = [
                        studentData.semA_1_opt1,
                        studentData.semA_2_opt1,
                        studentData.semB_1_opt1,
                        studentData.semB_2_opt1
                    ].filter(Boolean);

                    const uniqueCourseIds = [...new Set(primarySelections)];
                    
                    await Promise.all(uniqueCourseIds.map(async (courseId) => {
                        const course = courses.find(c => c.id === courseId);
                        if(course) {
                            await window.FirebaseAPI.updateDoc(window.FirebaseAPI.getPublicDocRef('courses', courseId), {
                                registeredCount: (course.registeredCount || 0) + 1
                            });
                        }
                    }));
                },
                deleteStudent: async (student) => {
                    if (!student?.id) return;

                    const primarySelections = [
                        student.semA_1_opt1,
                        student.semA_2_opt1,
                        student.semB_1_opt1,
                        student.semB_2_opt1
                    ].filter(Boolean);
                    const uniqueCourseIds = [...new Set(primarySelections)];

                    await Promise.all(uniqueCourseIds.map(async (courseId) => {
                        const course = courses.find(c => c.id === courseId);
                        if(course) {
                            await window.FirebaseAPI.updateDoc(window.FirebaseAPI.getPublicDocRef('courses', courseId), {
                                registeredCount: Math.max(0, (course.registeredCount || 0) - 1)
                            });
                        }
                    }));

                    await window.FirebaseAPI.deleteDoc(window.FirebaseAPI.getPublicDocRef('students', student.id));
                }
            };

            if (configMissing) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4" dir="rtl">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center border border-amber-200">
                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">⚠️</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">מסד הנתונים לא מוגדר עדיין</h2>
                            <p className="text-gray-600 text-sm mb-6 leading-relaxed">
                                כדי שהמערכת תתחיל לשמור נתונים בענן, יש לפתוח פרויקט בחינם ב-<strong>Firebase Console</strong> ולהדביק את מפתח ההתחברות בתוך קוד ה-HTML במשתנה <code className="bg-gray-100 px-2 py-1 rounded text-red-600 dir-ltr inline-block">CUSTOM_FIREBASE_CONFIG</code>.
                            </p>
                            <div className="bg-gray-50 p-4 rounded-xl text-right text-xs text-gray-600 font-mono mb-6 border">
                                <div>1. היכנס ל- console.firebase.google.com</div>
                                <div>2. צור פרויקט חדש + בסיס נתונים Cloud Firestore</div>
                                <div>3. העתק את הגדרות האפליקציה (web app config)</div>
                                <div>4. הדבק אותן בתוך קובץ ה-index.html בשורה 43</div>
                            </div>
                            <p className="text-xs text-gray-500">עקוב אחר ההוראות המפורטות במופע השיחה לקבלת מדריך צעד-אחר-צעד.</p>
                        </div>
                    </div>
                );
            }

            if (loading) return <div className="min-h-screen flex items-center justify-center font-bold text-xl text-indigo-600">מתחבר למסד הנתונים...</div>;

            return (
                <div className="min-h-screen relative">
                    {isAdminMode ? (
                        <AdminApp 
                            settings={settings} grades={grades} courses={courses} students={students} campuses={campuses}
                            dbMethods={dbMethods}
                            onLogout={() => setIsAdminMode(false)}
                        />
                    ) : (
                        <StudentApp 
                            settings={settings} grades={grades} courses={courses} students={students} campuses={campuses}
                            dbMethods={dbMethods}
                            onAdminLogin={() => setIsAdminMode(true)}
                        />
                    )}
                </div>
            );
        };

        const StudentApp = ({ settings, grades, courses, students, campuses, dbMethods, onAdminLogin }) => {
            const [step, setStep] = useState(0); 
            const [maxVisitedStep, setMaxVisitedStep] = useState(0);
            const [toastMsg, setToastMsg] = useState("");
            
            const [studentDetails, setStudentDetails] = useState({
                firstName: "", lastName: "", gradeId: grades.length > 0 ? grades[0].id : "",
                email: "", emailConfirm: "", campusId: ""
            });
            const [registrationCode, setRegistrationCode] = useState("");
            const [registrationError, setRegistrationError] = useState("");
            const [draftReady, setDraftReady] = useState(false);
            const DRAFT_KEY = 'course_registration_draft_v3';

            useEffect(() => {
                try {
                    const raw = localStorage.getItem(DRAFT_KEY);
                    if (raw) {
                        const draft = JSON.parse(raw);
                        if (draft?.studentDetails) {
                            setStudentDetails(prev => ({ ...prev, ...draft.studentDetails }));
                        }
                        if (draft?.selections) setSelections(prev => ({ ...prev, ...draft.selections }));
                        if (Number.isInteger(draft?.step) && draft.step >= 0 && draft.step < 8) {
                            setStep(draft.step);
                            setMaxVisitedStep(Math.max(draft.step, Number.isInteger(draft?.maxVisitedStep) ? draft.maxVisitedStep : draft.step));
                        }
                        setToastMsg('שוחזרה ההרשמה ששמרת במכשיר זה.');
                        setTimeout(() => setToastMsg(""), 3200);
                    }
                } catch (err) {
                    console.warn('Draft restore failed', err);
                } finally {
                    setDraftReady(true);
                }
            }, []);

            useEffect(() => {
                if(grades.length > 0 && !studentDetails.gradeId) {
                    setStudentDetails(prev => ({...prev, gradeId: grades[0].id}));
                }
            }, [grades]);

            useEffect(() => {
                const openCampuses = campuses.filter(c => c.active !== false && c.registrationOpen !== false);
                if (openCampuses.length === 1 && !studentDetails.campusId) {
                    setStudentDetails(prev => ({ ...prev, campusId: openCampuses[0].id }));
                }
            }, [campuses]);

            const [selections, setSelections] = useState({
                semA_1_opt1: null, semA_1_opt2: null,
                semA_2_opt1: null, semA_2_opt2: null,
                semB_1_opt1: null, semB_1_opt2: null,
                semB_2_opt1: null, semB_2_opt2: null,
                semA_1_waitlist: null, semA_2_waitlist: null,
                semB_1_waitlist: null, semB_2_waitlist: null,
            });

            useEffect(() => {
                if (!draftReady || step >= 8) return;
                try {
                    localStorage.setItem(DRAFT_KEY, JSON.stringify({
                        step,
                        maxVisitedStep,
                        studentDetails,
                        selections,
                        savedAt: new Date().toISOString()
                    }));
                } catch (err) {
                    console.warn('Draft autosave failed', err);
                }
            }, [draftReady, step, maxVisitedStep, studentDetails, selections]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(""), 2500);
            };

            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

            const goToStep = (targetStep) => {
                if (targetStep < 0 || targetStep > 8) return;
                setStep(targetStep);
                if (targetStep < 8) setMaxVisitedStep(prev => Math.max(prev, targetStep));
                scrollToTop();
            };

            const nextStep = (customMessage) => {
                if (customMessage) showToast(customMessage);
                setStep(s => {
                    const next = s + 1;
                    if (next < 8) setMaxVisitedStep(prev => Math.max(prev, next));
                    return next;
                });
                scrollToTop();
            };

            const prevStep = () => {
                setStep(s => Math.max(0, s - 1));
                scrollToTop();
            };

            const goHome = () => {
                setStep(0);
                showToast('ההרשמה נשמרה כטיוטה במכשיר זה.');
                scrollToTop();
            };

            const changeCampus = () => {
                goToStep(1);
                showToast('בחרו את הקמפוס הרצוי. הפרטים האישיים יישמרו.');
            };

            const handleCourseSelect = (slotKey, priority, courseId, isFull = false) => {
                setSelections(prev => {
                    const newState = { ...prev };

                    if (isFull) {
                        // קורס מלא יכול להיכנס רק כאופציה שנייה וברשימת המתנה
                        if (newState[`${slotKey}_opt1`] === courseId) newState[`${slotKey}_opt1`] = null;
                        newState[`${slotKey}_opt2`] = courseId;
                        newState[`${slotKey}_waitlist`] = courseId;
                        return newState;
                    }

                    if (priority === 1 && newState[`${slotKey}_opt2`] === courseId) {
                        newState[`${slotKey}_opt2`] = null;
                        if (newState[`${slotKey}_waitlist`] === courseId) newState[`${slotKey}_waitlist`] = null;
                    }
                    if (priority === 2 && newState[`${slotKey}_opt1`] === courseId) newState[`${slotKey}_opt1`] = null;
                    newState[`${slotKey}_opt${priority}`] = courseId;
                    if (priority === 2) newState[`${slotKey}_waitlist`] = null;
                    return newState;
                });

                if (isFull) {
                    showToast('הקורס מלא. שובצת לרשימת ההמתנה כאופציה שנייה. יש לבחור כעת קורס פנוי כאופציה ראשונה.');
                }
            };

            const isValidEmail = (email) => {
                const value = String(email || '').trim();
                return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(value);
            };

            const canProceedFromDetails = Boolean(
                studentDetails.firstName.trim() &&
                studentDetails.lastName.trim() &&
                studentDetails.gradeId &&
                studentDetails.campusId &&
                isValidEmail(studentDetails.email) &&
                studentDetails.email.trim().toLowerCase() === studentDetails.emailConfirm.trim().toLowerCase()
            );
            
            const checkSlotCompletion = (slotKey) => {
                return selections[`${slotKey}_opt1`] && selections[`${slotKey}_opt2`] && 
                       selections[`${slotKey}_opt1`] !== selections[`${slotKey}_opt2`];
            };

            const normalizeValue = (value) => String(value || '').trim().toLowerCase();

            const generateRegistrationCode = () => {
                const campusPrefix = studentDetails.campusId === 'campus1'
                    ? 'TH'
                    : studentDetails.campusId === 'campus2'
                        ? 'KT'
                        : 'CP';
                const stamp = Date.now().toString(36).toUpperCase();
                const random = Math.random().toString(36).slice(2, 6).toUpperCase();
                return `${campusPrefix}-${stamp}-${random}`;
            };

            const submitRegistration = async () => {
                setRegistrationError("");

                const duplicate = students.find(s =>
                    normalizeValue(s.firstName) === normalizeValue(studentDetails.firstName) &&
                    normalizeValue(s.lastName) === normalizeValue(studentDetails.lastName) &&
                    normalizeValue(s.email) === normalizeValue(studentDetails.email) &&
                    (s.campusId || 'campus1') === studentDetails.campusId
                );

                if (duplicate) {
                    setRegistrationError(
                        `כבר קיימת הרשמה עבור ${studentDetails.firstName} ${studentDetails.lastName} בקמפוס זה עם כתובת המייל שהוזנה. אם נדרש שינוי, יש לפנות להנהלה.`
                    );
                    scrollToTop();
                    return;
                }

                const code = generateRegistrationCode();
                const { emailConfirm, ...detailsForDb } = studentDetails;
                const regData = {
                    registrationCode: code,
                    date: new Date().toLocaleDateString('he-IL') + " " + new Date().toLocaleTimeString('he-IL'),
                    ...detailsForDb,
                    ...selections
                };

                try {
                    await dbMethods.registerStudent(regData);
                    setRegistrationCode(code);
                    try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
                    nextStep("ההרשמה בוצעה ושמורה במערכת בהצלחה!");
                } catch (err) {
                    console.error(err);
                    setRegistrationError("אירעה שגיאה בשמירת ההרשמה. הנתונים נשמרו במכשיר וניתן לנסות שוב.");
                    scrollToTop();
                }
            };

            const renderStepContent = () => {
                switch(step) {
                    case 0: return <WelcomeNoticeStep settings={settings} onNext={() => nextStep()} />;
                    case 1: return <CampusSelectionStep campuses={campuses} selectedCampusId={studentDetails.campusId} onHome={goHome} onSelectCampus={(campusId) => {
                        const previousCampusId = studentDetails.campusId;
                        const campusGrades = grades.filter(g => (g.campusId || 'campus1') === campusId);
                        const campusChanged = Boolean(previousCampusId && previousCampusId !== campusId);

                        setStudentDetails(prev => ({
                            ...prev,
                            campusId,
                            gradeId: campusGrades.some(g => g.id === prev.gradeId) ? prev.gradeId : (campusGrades[0]?.id || '')
                        }));

                        if (campusChanged) {
                            setSelections({
                                semA_1_opt1: null, semA_1_opt2: null, semA_2_opt1: null, semA_2_opt2: null,
                                semB_1_opt1: null, semB_1_opt2: null, semB_2_opt1: null, semB_2_opt2: null,
                                semA_1_waitlist: null, semA_2_waitlist: null, semB_1_waitlist: null, semB_2_waitlist: null,
                            });
                            setMaxVisitedStep(2);
                            setRegistrationError('');
                            showToast('הקמפוס הוחלף בהצלחה. הפרטים האישיים נשמרו ובחירות הקורסים אופסו.');
                        } else {
                            showToast('הקמפוס נבחר. ממשיכים לפרטי התלמיד.');
                        }
                        goToStep(2);
                    }} />;
                    case 2: return <DetailsStep details={studentDetails} setDetails={setStudentDetails} grades={grades} campuses={campuses} onNext={() => nextStep()} onChangeCampus={changeCampus} canProceed={canProceedFromDetails} />;
                    case 3: return <CourseSelectionStep title="מחצית א' - שעה ראשונה" semester="א" track="שעה ראשונה" slotKey="semA_1" courses={courses} students={students} details={studentDetails} selections={selections} onSelect={handleCourseSelect} onNext={() => nextStep("עוברים לשעה השנייה.")} onPrev={prevStep} canProceed={checkSlotCompletion('semA_1')} />;
                    case 4: return <CourseSelectionStep title="מחצית א' - שעה שנייה" semester="א" track="שעה שנייה" slotKey="semA_2" courses={courses} students={students} details={studentDetails} selections={selections} onSelect={handleCourseSelect} onNext={() => nextStep("מחצית א' הושלמה!")} onPrev={prevStep} canProceed={checkSlotCompletion('semA_2')} />;
                    case 5: return <CourseSelectionStep title="מחצית ב' - שעה ראשונה" isSemB={true} semester="ב" track="שעה ראשונה" slotKey="semB_1" courses={courses} students={students} details={studentDetails} selections={selections} onSelect={handleCourseSelect} onNext={() => nextStep("עוברים לשעה השנייה.")} onPrev={prevStep} canProceed={checkSlotCompletion('semB_1')} />;
                    case 6: return <CourseSelectionStep title="מחצית ב' - שעה שנייה" isSemB={true} semester="ב" track="שעה שנייה" slotKey="semB_2" courses={courses} students={students} details={studentDetails} selections={selections} onSelect={handleCourseSelect} onNext={() => nextStep()} onPrev={prevStep} canProceed={checkSlotCompletion('semB_2')} />;
                    case 7: return <SummaryStep details={studentDetails} selections={selections} courses={courses} grades={grades} campuses={campuses} registrationError={registrationError} onPrev={prevStep} onSubmit={submitRegistration} />;
                    case 8: return <SuccessStep details={studentDetails} selections={selections} courses={courses} grades={grades} campuses={campuses} settings={settings} registrationCode={registrationCode} />;
                    default: return null;
                }
            };

            const progress = step <= 1 || step === 8 ? 0 : ((step - 1) / 6) * 100;

            return (
                <div className="pb-20">
                    <header className="bg-gradient-to-l from-indigo-950 via-indigo-900 to-violet-900 text-white p-4 shadow-xl sticky top-0 z-50 border-b border-white/10 backdrop-blur">
                        <div className="max-w-4xl mx-auto flex justify-between items-center gap-3">
                            <button onClick={goHome} className="text-xl font-bold text-right hover:text-indigo-100 transition-colors" title="חזרה לדף הבית">
                                {settings.schoolName}
                            </button>
                            <div className="flex items-center gap-2 shrink-0 flex-wrap justify-end">
                                {step > 0 && step < 8 && (
                                    <button
                                        type="button"
                                        onClick={goHome}
                                        className="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-white text-sm font-extrabold transition-colors"
                                        title="חזרה לדף הבית בלי למחוק את הטיוטה"
                                    >
                                        🏠 דף הבית
                                    </button>
                                )}
                                {step > 1 && step < 8 && (
                                    <button
                                        type="button"
                                        onClick={changeCampus}
                                        className="px-3 py-2 rounded-xl bg-amber-400/20 hover:bg-amber-400/30 border border-amber-200/30 text-amber-50 text-sm font-extrabold transition-colors"
                                        title="בחירת קמפוס אחר"
                                    >
                                        🏫 החלפת קמפוס
                                    </button>
                                )}
                                {step <= 1 && (
                                    <button onClick={onAdminLogin} className="text-indigo-200 hover:text-white text-sm flex items-center gap-1">
                                        הנהלה
                                    </button>
                                )}
                            </div>
                        </div>
                        {step > 1 && step < 8 && (
                            <div className="max-w-4xl mx-auto mt-4 space-y-2">
                                <div className="h-2 bg-indigo-800 rounded-full overflow-hidden">
                                    <div className="h-full bg-gradient-to-l from-cyan-400 via-indigo-400 to-violet-500 transition-all duration-700" style={{ width: `${progress}%` }}></div>
                                </div>
                                <div className="progress-steps">
                                    {[
                                        {label:'פרטים', min:2, max:2, target:2},
                                        {label:'מחצית א׳', min:3, max:4, target:3},
                                        {label:'מחצית ב׳', min:5, max:6, target:5},
                                        {label:'סיכום', min:7, max:7, target:7}
                                    ].map((item, idx) => {
                                        const active = step >= item.min && step <= item.max;
                                        const done = step > item.max;
                                        const accessible = item.target <= maxVisitedStep;
                                        return (
                                            <button
                                                key={item.label}
                                                type="button"
                                                disabled={!accessible}
                                                onClick={() => accessible && goToStep(item.target)}
                                                title={accessible ? `מעבר אל ${item.label}` : 'השלב עדיין לא זמין'}
                                                className={`progress-step ${active ? 'active' : done ? 'done' : ''} ${accessible ? 'cursor-pointer hover:bg-white/20' : 'cursor-not-allowed opacity-50'}`}
                                            >
                                                <span>{done ? '✓' : idx + 1}</span>
                                                <span>{item.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </header>

                    {toastMsg && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 toast-animate">
                            <div className="bg-green-600 text-white px-6 py-3 rounded-full shadow-lg font-medium">
                                {toastMsg}
                            </div>
                        </div>
                    )}

                    <main className="max-w-4xl mx-auto p-4 mt-6">
                        {renderStepContent()}
                    </main>
                </div>
            );
        };

        const WelcomeNoticeStep = ({ settings, onNext }) => (
            <div className="max-w-5xl mx-auto mt-3 md:mt-4 animate-[slideIn_0.45s_ease-out] relative">
                <div className="text-center mb-4">

                                    קראתי, המשך לבחירת קמפוס
                                    <span className="transition-transform duration-300 group-hover:-translate-x-1">←</span>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );

        const CampusSelectionStep = ({ campuses, selectedCampusId, onSelectCampus, onHome }) => {
            const activeCampuses = campuses.filter(c => c.active !== false);
            const campusDisplayName = (campus) => {
                if (campus.id === 'campus1') return 'קמפוס תל-חי';
                if (campus.id === 'campus2') return 'קמפוס קצרין';
                return campus.name;
            };

            return (
                <div className="max-w-4xl mx-auto mt-8 space-y-6 animate-[slideIn_0.45s_ease-out]">
                    <div className="flex justify-start">
                        <button
                            type="button"
                            onClick={onHome}
                            className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 font-extrabold shadow-sm"
                        >
                            🏠 חזרה לדף הבית
                        </button>
                    </div>
                    <div className="text-center">
                        <div className="inline-flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-full px-4 py-2 text-sm font-bold mb-4">
                            📍 שלב שני
                        </div>
                        <h2 className="display-hebrew text-4xl md:text-6xl text-gray-900 mb-3">בחרו את הקמפוס המתאים</h2>
                        <p className="text-gray-700 text-lg md:text-2xl leading-relaxed font-medium">לאחר הבחירה יוצגו רק השכבות והקורסים של הקמפוס שבחרתם.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {activeCampuses.map((campus, index) => {
                            const displayName = campusDisplayName(campus);
                            const isSelected = selectedCampusId === campus.id;
                            const isRegistrationOpen = campus.registrationOpen !== false;
                            const isTelHai = campus.id === 'campus1' || displayName.includes('תל-חי');
                            return (
                                <button
                                    key={campus.id}
                                    type="button"
                                    onClick={() => isRegistrationOpen && onSelectCampus(campus.id)}
                                    disabled={!isRegistrationOpen}
                                    className={`card-lift group relative overflow-hidden min-h-[230px] rounded-[2rem] border-2 p-7 text-right transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl active:scale-[0.985] ${
                                        !isRegistrationOpen
                                            ? 'border-gray-200 bg-gray-100 opacity-70 cursor-not-allowed'
                                            : isSelected
                                            ? 'border-indigo-600 bg-indigo-50 ring-4 ring-indigo-100'
                                            : isTelHai
                                                ? 'border-indigo-200 bg-gradient-to-br from-indigo-50 via-white to-indigo-100/50 hover:border-indigo-500'
                                                : 'border-emerald-200 bg-gradient-to-br from-emerald-50 via-white to-emerald-100/50 hover:border-emerald-500'
                                    }`}
                                >
                                    <div className={`absolute -left-8 -bottom-8 w-32 h-32 rounded-full blur-2xl opacity-40 ${isTelHai ? 'bg-indigo-300' : 'bg-emerald-300'}`}></div>
                                    <div className="relative flex items-start justify-between gap-4">
                                        <div>
                                            <div className="mb-3">
                                                <span className={`inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-extrabold ${
                                                    isRegistrationOpen ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600'
                                                }`}>
                                                    {isRegistrationOpen ? '● ההרשמה פתוחה' : '● ההרשמה סגורה'}
                                                </span>
                                            </div>
                                            <div className={`w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mb-5 shadow-sm ${isTelHai ? 'bg-indigo-100' : 'bg-emerald-100'}`}>
                                                {isTelHai ? '🏫' : '🌿'}
                                            </div>
                                            <div className="text-base font-extrabold text-gray-500 mb-1">הרשמה אל</div>
                                            <div className="text-4xl md:text-5xl font-extrabold tracking-tight text-gray-900">{displayName}</div>
                                            <div className="mt-2 text-sm font-semibold text-gray-500">המשך לשכבות ולקורסים של קמפוס זה</div>
                                            <div className={`mt-5 inline-flex items-center gap-2 font-extrabold ${isTelHai ? 'text-indigo-700' : 'text-emerald-700'}`}>
                                                {isRegistrationOpen ? (isSelected ? 'הקמפוס הנוכחי — לחצו להמשך' : 'בחרו קמפוס זה') : 'ההרשמה אינה זמינה כרגע'}
                                                <span className="transition-transform group-hover:-translate-x-1">←</span>
                                            </div>
                                        </div>
                                        <div className={`w-11 h-11 rounded-full border-2 flex items-center justify-center font-bold ${
                                            isSelected ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-gray-200 text-gray-400'
                                        }`}>
                                            {isSelected ? '✓' : index + 1}
                                        </div>
                                    </div>
                                </button>
                            );
                        })}
                    </div>

                    {activeCampuses.length === 0 && (
                        <div className="text-center p-6 bg-red-50 text-red-700 rounded-2xl border border-red-100">
                            אין כרגע קמפוסים פעילים להרשמה. יש לפנות להנהלה.
                        </div>
                    )}
                </div>
            );
        };

        const DetailsStep = ({ details, setDetails, grades, campuses, onNext, onChangeCampus, canProceed }) => {
            const campusGrades = grades.filter(g => (g.campusId || 'campus1') === details.campusId);
            const emailValue = String(details.email || '').trim();
            const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(emailValue);
            const showEmailError = emailValue.length > 0 && !emailValid;
            const emailConfirmValue = String(details.emailConfirm || '').trim();
            const emailsMatch = emailValid && emailConfirmValue.length > 0 &&
                emailValue.toLowerCase() === emailConfirmValue.toLowerCase();
            const showEmailConfirmError = emailConfirmValue.length > 0 && !emailsMatch;
            return (
            <div className="step-shell rounded-3xl p-6 md:p-8 animate-[slideIn_0.35s_ease-out] soft-ring">
                <h2 className="text-3xl md:text-4xl font-extrabold tracking-tight text-gray-900 mb-4 border-b pb-4">פרטים אישיים</h2>
                <div className="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-indigo-50 border border-indigo-100 rounded-2xl p-4">
                    <div>
                        <div className="text-sm font-extrabold text-indigo-500 mb-1">הקמפוס שנבחר</div>
                        <div className="text-xl md:text-2xl font-extrabold text-indigo-900">
                            {details.campusId === 'campus1' ? 'קמפוס תל-חי' : details.campusId === 'campus2' ? 'קמפוס קצרין' : (campuses.find(c => c.id === details.campusId)?.name || '')}
                        </div>
                    </div>
                    <button type="button" onClick={onChangeCampus} className="text-sm font-bold text-indigo-700 bg-white border border-indigo-200 hover:bg-indigo-100 px-4 py-2 rounded-xl">
                        שינוי קמפוס
                    </button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="field-wrap">
                        <label className="block text-base font-extrabold text-gray-800 mb-2">שם פרטי *</label>
                        <input type="text" className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500" value={details.firstName} onChange={e => setDetails({...details, firstName: e.target.value})} />
                    </div>
                    <div className="field-wrap">
                        <label className="block text-base font-extrabold text-gray-800 mb-2">שם משפחה *</label>
                        <input type="text" className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500" value={details.lastName} onChange={e => setDetails({...details, lastName: e.target.value})} />
                    </div>
                    <div className="field-wrap">
                        <label className="block text-base font-extrabold text-gray-800 mb-2">דוא"ל הורה *</label>
                        <div className="relative">
                            <input
                                type="email"
                                inputMode="email"
                                autoComplete="email"
                                className={`w-full p-3 pl-10 border rounded-xl outline-none transition-all ${
                                    !emailValue
                                        ? 'border-gray-300 focus:ring-2 focus:ring-indigo-500'
                                        : emailValid
                                            ? 'border-green-400 bg-green-50/50 focus:ring-2 focus:ring-green-400'
                                            : 'border-red-400 bg-red-50/50 focus:ring-2 focus:ring-red-400'
                                }`}
                                value={details.email}
                                onChange={e => setDetails({...details, email: e.target.value.trimStart()})}
                                onBlur={e => setDetails({...details, email: e.target.value.trim()})}
                                placeholder="example@email.com"
                                dir="ltr"
                            />
                            {emailValue && (
                                <span className={`absolute left-3 top-1/2 -translate-y-1/2 text-lg ${emailValid ? 'text-green-600' : 'text-red-500'}`}>
                                    {emailValid ? '✓' : '!'}
                                </span>
                            )}
                        </div>
                        {showEmailError ? (
                            <div className="mt-2 text-base font-extrabold text-red-600 flex items-center gap-2">
                                <span>⚠️</span>
                                יש להזין כתובת מייל תקינה, לדוגמה: parent@example.com
                            </div>
                        ) : emailValid ? (
                            <div className="mt-2 text-base font-extrabold text-green-600 flex items-center gap-2">
                                <span>✓</span>
                                כתובת המייל נראית תקינה
                            </div>
                        ) : (
                            <div className="mt-2 text-xs text-gray-400">לכתובת זו יישלח אישור ההרשמה.</div>
                        )}
                    </div>
                    <div className="field-wrap">
                        <label className="block text-base font-extrabold text-gray-800 mb-2">אימות דוא"ל הורה *</label>
                        <div className="relative">
                            <input
                                type="email"
                                inputMode="email"
                                autoComplete="email"
                                className={`w-full p-3 pl-10 border rounded-xl outline-none transition-all ${
                                    !emailConfirmValue
                                        ? 'border-gray-300 focus:ring-2 focus:ring-indigo-500'
                                        : emailsMatch
                                            ? 'border-green-400 bg-green-50/50 focus:ring-2 focus:ring-green-400'
                                            : 'border-red-400 bg-red-50/50 focus:ring-2 focus:ring-red-400'
                                }`}
                                value={details.emailConfirm || ''}
                                onChange={e => setDetails({...details, emailConfirm: e.target.value.trimStart()})}
                                onBlur={e => setDetails({...details, emailConfirm: e.target.value.trim()})}
                                placeholder="הקלידו שוב את כתובת המייל"
                                dir="ltr"
                            />
                            {emailConfirmValue && (
                                <span className={`absolute left-3 top-1/2 -translate-y-1/2 text-lg ${emailsMatch ? 'text-green-600' : 'text-red-500'}`}>
                                    {emailsMatch ? '✓' : '!'}
                                </span>
                            )}
                        </div>
                        {showEmailConfirmError ? (
                            <div className="mt-2 text-sm font-extrabold text-red-600 flex items-center gap-2">
                                <span>⚠️</span>
                                כתובות המייל אינן זהות.
                            </div>
                        ) : emailsMatch ? (
                            <div className="mt-2 text-sm font-extrabold text-green-600 flex items-center gap-2">
                                <span>✓</span>
                                כתובות המייל תואמות
                            </div>
                        ) : (
                            <div className="mt-2 text-xs text-gray-400">הקלידו שוב כדי למנוע טעות בשליחת האישור.</div>
                        )}
                    </div>
                    <div className="field-wrap">
                        <label className="block text-base font-extrabold text-gray-800 mb-2">שכבה *</label>
                        <select className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white" value={details.gradeId} onChange={e => setDetails({...details, gradeId: e.target.value})}>
                            {campusGrades.length === 0
                                ? <option value="">אין שכבות מוגדרות בקמפוס זה</option>
                                : campusGrades.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                        </select>
                    </div>
                </div>
                <div className="mt-8 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-t border-gray-100 pt-5">
                    <div className="text-sm text-gray-500">
                        {canProceed ? '✓ כל הפרטים תקינים, אפשר להמשיך.' : 'מלאו את כל השדות וודאו ששתי כתובות המייל זהות ותקינות.'}
                    </div>
                    <button onClick={onNext} disabled={!canProceed} className={`premium-btn py-3.5 px-8 rounded-xl font-extrabold text-white transition-all ${canProceed ? 'bg-gradient-to-l from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 shadow-md hover:shadow-lg' : 'bg-gray-300 cursor-not-allowed'}`}>
                        המשך לבחירת קורסים
                    </button>
                </div>
            </div>
            );
        };

        const CourseSelectionStep = ({ title, semester, track, slotKey, courses, students, details, selections, onSelect, onNext, onPrev, canProceed, isSemB = false }) => {
            const availableCourses = courses.filter(c => c.semester === semester && c.track === track && c.gradeId === details.gradeId && ((c.campusId || 'campus1') === details.campusId));
            const opt1Id = selections[`${slotKey}_opt1`];
            const opt2Id = selections[`${slotKey}_opt2`];

            return (
                <div className="space-y-6 fade-up">
                    <div className={`relative overflow-hidden p-6 rounded-3xl text-white shadow-lg ${isSemB ? 'bg-gradient-to-l from-emerald-600 to-teal-600' : 'bg-gradient-to-l from-indigo-600 to-violet-600'}`}>
                        <div className="absolute -left-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                        <div className="relative">
                            <div className="text-xs font-extrabold text-white/70 mb-1">בחירת קורסים</div>
                            <h2 className="text-2xl md:text-3xl font-extrabold mb-2">{title}</h2>
                            <p className="text-white/90 font-medium">יש לבחור עדיפות ראשונה ועדיפות שנייה. לא ניתן לבחור את אותו הקורס פעמיים.</p>
                        </div>
                    </div>

                    {availableCourses.length === 0 ? (
                        <div className="text-center py-10 bg-white rounded-xl border">אין קורסים מוגדרים לרצועה זו בשכבה שלך.</div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {availableCourses.map(course => {
                                const primaryCount = students.reduce((count, student) => {
                                    const keys = ['semA_1_opt1', 'semA_2_opt1', 'semB_1_opt1', 'semB_2_opt1'];
                                    return count + keys.filter(key => student[key] === course.id).length;
                                }, 0);
                                const isFull = primaryCount >= Number(course.capacity || 0);
                                const isOpt1 = opt1Id === course.id;
                                const isOpt2 = opt2Id === course.id;
                                
                                let cardStyle = "border-gray-200 bg-white hover:border-gray-300";
                                if (isOpt1) cardStyle = "border-indigo-500 bg-indigo-50 ring-2 ring-indigo-200 shadow-md";
                                else if (isOpt2) cardStyle = "border-amber-500 bg-amber-50 ring-2 ring-amber-200 shadow-md";
                                else if (isFull) cardStyle = "border-gray-200 bg-gray-50 opacity-75";

                                return (
                                    <div key={course.id} className={`course-card-modern border-2 rounded-3xl p-5 smooth-transition relative overflow-hidden ${cardStyle}`}>
                                        {isOpt1 && <div className="absolute top-0 right-0 bg-indigo-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">🎯 עדיפות 1</div>}
                                        {isOpt2 && <div className="absolute top-0 right-0 bg-amber-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">⭐ עדיפות 2</div>}

                                        <div className="flex justify-between items-start mb-2 mt-2">
                                            <div>
                                                <h3 className={`text-lg font-bold ${isOpt1 ? 'text-indigo-900' : isOpt2 ? 'text-amber-900' : 'text-gray-800'}`}>{course.name}</h3>
                                                {course.teacherName?.trim() && (
                                                    <div className="mt-1 text-sm font-semibold text-gray-500">
                                                        👩‍🏫 מורה: {course.teacherName}
                                                    </div>
                                                )}
                                            </div>
                                            <span className={`text-xs font-semibold px-2 py-1 rounded-full ${isFull ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                {isFull ? 'מלא · רשימת המתנה' : `פנוי (${Math.max(0, Number(course.capacity || 0) - primaryCount)})`}
                                            </span>
                                        </div>
                                        <p className="text-gray-600 text-sm mb-5 min-h-[40px]">{course.description}</p>
                                        
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => onSelect(slotKey, 1, course.id, false)}
                                                disabled={isFull}
                                                title={isFull ? 'הקורס מלא ולכן אינו זמין כאופציה ראשונה' : ''}
                                                className={`course-cta flex-1 py-2.5 px-2 rounded-xl text-sm font-bold transition-colors border ${isFull ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed' : isOpt1 ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}>
                                                {isFull ? 'אופציה 1 - לא זמין' : 'אופציה 1'}
                                            </button>
                                            <button onClick={() => onSelect(slotKey, 2, course.id, isFull)} className={`course-cta flex-1 py-2.5 px-2 rounded-xl text-sm font-bold transition-colors border ${isOpt2 ? 'bg-amber-500 text-white border-amber-500' : isFull ? 'bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}>
                                                {isFull ? 'הצטרפות לרשימת המתנה' : 'אופציה 2'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    <div className="flex justify-between mt-8 border-t pt-6 border-gray-200">
                        <button onClick={onPrev} className="px-6 py-3 text-gray-600 font-medium hover:bg-gray-100 rounded-xl">חזור</button>
                        <button onClick={onNext} disabled={!canProceed && availableCourses.length > 0} className={`px-8 py-3 rounded-xl font-bold text-white transition-all ${(canProceed || availableCourses.length===0) ? (isSemB ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-indigo-600 hover:bg-indigo-700') : 'bg-gray-300 cursor-not-allowed'}`}>המשך לשלב הבא</button>
                    </div>
                </div>
            );
        };

        const SummaryStep = ({ details, selections, courses, grades, campuses, registrationError, onPrev, onSubmit }) => {
            const getCourseName = (id) => courses.find(c => c.id === id)?.name || "-";
            const gradeName = grades.find(g => g.id === details.gradeId)?.name || "";
            const campusName = campuses?.find(c => c.id === details.campusId)?.name || "";
            
            const renderSlot = (title, slotKey) => (
                <div className="summary-slot bg-white rounded-2xl p-4 border border-gray-200 shadow-sm">
                    <h4 className="font-bold text-gray-700 mb-3 border-b pb-2">{title}</h4>
                    <div className="space-y-2">
                        <div className="flex items-center gap-2"><span className="bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded font-bold">אופציה 1</span><span className="text-gray-800 font-medium">{getCourseName(selections[`${slotKey}_opt1`])}</span></div>
                        <div className="flex items-center gap-2"><span className="bg-amber-100 text-amber-700 text-xs px-2 py-1 rounded font-bold">אופציה 2</span><span className="text-gray-800 font-medium">{getCourseName(selections[`${slotKey}_opt2`])}{selections[`${slotKey}_waitlist`] === selections[`${slotKey}_opt2`] ? ' · רשימת המתנה' : ''}</span></div>
                    </div>
                </div>
            );

            return (
                <div className="step-shell rounded-3xl p-6 md:p-8">
                    <div className="text-center mb-8">
                        <div className="w-14 h-14 bg-indigo-100 text-indigo-700 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">✓</div>
                        <h2 className="text-3xl md:text-4xl font-extrabold text-gray-900">בדיקה אחרונה לפני השליחה</h2>
                        <p className="text-gray-500 mt-2">עברו על הפרטים והבחירות. לאחר האישור ההרשמה תישמר במערכת.</p>
                    </div>
                    {registrationError && (
                        <div className="bg-red-50 text-red-800 border border-red-200 p-4 rounded-xl mb-5 font-bold">
                            ⚠️ {registrationError}
                        </div>
                    )}
                    <div className="bg-blue-50 text-blue-900 p-4 rounded-xl mb-6">
                        <h3 className="font-bold mb-1">פרטי תלמיד:</h3>
                        <p><strong>{details.firstName} {details.lastName}</strong> | קמפוס: {campusName} | שכבה: {gradeName} | דוא"ל: <span dir="ltr">{details.email}</span></p>
                        <p className="text-xs text-blue-700 mt-2">ההרשמה נשמרת אוטומטית במכשיר עד ללחיצה על אישור ושליחה סופית.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        {renderSlot("מחצית א' - שעה 1", "semA_1")}
                        {renderSlot("מחצית א' - שעה 2", "semA_2")}
                        {renderSlot("מחצית ב' - שעה 1", "semB_1")}
                        {renderSlot("מחצית ב' - שעה 2", "semB_2")}
                    </div>
                    <div className="flex justify-between border-t pt-6">
                        <button onClick={onPrev} className="px-6 py-3 text-gray-600 font-medium hover:bg-gray-100 rounded-xl">חזור</button>
                        <button onClick={onSubmit} className="premium-btn px-10 py-3.5 bg-gradient-to-l from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-extrabold rounded-xl shadow-lg hover:shadow-xl">אישור ושליחה סופית</button>
                    </div>
                </div>
            );
        };

        const SuccessStep = ({ details, selections, courses, grades, campuses, settings, registrationCode }) => {
            const receiptRef = useRef(null);
            const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
            const getCourseName = (id) => courses.find(c => c.id === id)?.name || "-";
            const gradeName = grades.find(g => g.id === details.gradeId)?.name || "-";
            const campusName = campuses?.find(c => c.id === details.campusId)?.name || "-";
            const currentYear = new Date().getFullYear();
            const registrationDate = new Date().toLocaleDateString('he-IL');

            const waitlistLabel = (slotKey, courseId) =>
                selections[`${slotKey}_waitlist`] === courseId && courseId ? ' (רשימת המתנה)' : '';

            const receiptRows = [
                ["מחצית א' - שעה ראשונה", getCourseName(selections.semA_1_opt1), getCourseName(selections.semA_1_opt2) + waitlistLabel('semA_1', selections.semA_1_opt2)],
                ["מחצית א' - שעה שנייה", getCourseName(selections.semA_2_opt1), getCourseName(selections.semA_2_opt2) + waitlistLabel('semA_2', selections.semA_2_opt2)],
                ["מחצית ב' - שעה ראשונה", getCourseName(selections.semB_1_opt1), getCourseName(selections.semB_1_opt2) + waitlistLabel('semB_1', selections.semB_1_opt2)],
                ["מחצית ב' - שעה שנייה", getCourseName(selections.semB_2_opt1), getCourseName(selections.semB_2_opt2) + waitlistLabel('semB_2', selections.semB_2_opt2)]
            ];

            const generateRegistrationPdf = async () => {
                if (!receiptRef.current || !window.html2canvas || !window.jspdf) {
                    throw new Error('PDF libraries are not available');
                }

                const receiptImages = Array.from(receiptRef.current.querySelectorAll('img'));
                await Promise.all(receiptImages.map(async (img) => {
                    try {
                        if (typeof img.decode === 'function') await img.decode();
                    } catch (_) {}
                    if (img.complete && img.naturalWidth > 0) return;
                    await new Promise(resolve => {
                        const done = () => resolve();
                        img.addEventListener('load', done, { once: true });
                        img.addEventListener('error', done, { once: true });
                        setTimeout(done, 3000);
                    });
                }));

                // Force one paint frame so embedded images (including the logo) are rendered
                // before html2canvas captures the receipt.
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

                const canvas = await window.html2canvas(receiptRef.current, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    allowTaint: false,
                    imageTimeout: 5000
                });

                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 10;
                const imgWidth = pageWidth - margin * 2;
                const imgHeight = canvas.height * imgWidth / canvas.width;

                if (imgHeight <= pageHeight - margin * 2) {
                    pdf.addImage(imgData, 'PNG', margin, margin, imgWidth, imgHeight);
                } else {
                    let heightLeft = imgHeight;
                    let position = margin;
                    pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
                    heightLeft -= (pageHeight - margin * 2);

                    while (heightLeft > 0) {
                        position = margin - (imgHeight - heightLeft);
                        pdf.addPage();
                        pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
                        heightLeft -= (pageHeight - margin * 2);
                    }
                }

                return pdf;
            };

            const downloadRegistrationPdf = async () => {
                try {
                    setIsGeneratingPdf(true);
                    const pdf = await generateRegistrationPdf();
                    const safeName = `${details.firstName}_${details.lastName}`.replace(/\s+/g, '_');
                    pdf.save(`אישור_הרשמה_${safeName}.pdf`);
                } catch (err) {
                    console.error('PDF generation failed:', err);
                    alert('אירעה שגיאה ביצירת קובץ ה-PDF. נסה שוב.');
                } finally {
                    setIsGeneratingPdf(false);
                }
            };

            const printRegistrationReceipt = () => {
                window.print();
            };

                        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-gray-700">
                            <strong>הערה:</strong> מסמך זה מהווה אישור על קליטת בחירת הקורסים במערכת. השיבוץ הסופי ייקבע בהתאם לזמינות המקומות ולשיקולי המרכז.

                        <div className="text-center text-xs text-gray-500 mt-8 pt-4 border-t">מרכז מדע ודעת למצטיינים ומחוננים תל-חי</div>
                    </div>
                </div>
            );
        };

        const AdminApp = ({ settings, grades, courses, students, campuses, dbMethods, onLogout }) => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [adminCreds, setAdminCreds] = useState(null);
            const [selectedCampus, setSelectedCampus] = useState("");

            const [loginUser, setLoginUser] = useState("");
            const [loginPass, setLoginPass] = useState("");
            const [loginError, setLoginError] = useState("");
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [rememberPassword, setRememberPassword] = useState(false);
            const ADMIN_REMEMBER_KEY = 'course_registration_admin_remember_v1';

            useEffect(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem(ADMIN_REMEMBER_KEY) || 'null');
                    if (saved?.username && saved?.password) {
                        setLoginUser(saved.username);
                        setLoginPass(saved.password);
                        setRememberPassword(true);
                    }
                } catch (err) {
                    console.warn('Admin credential restore failed', err);
                }
            }, []);
            
            const handleLogin = async () => {
                if (!loginUser || !loginPass) {
                    setLoginError("יש להזין שם משתמש וסיסמה");
                    return;
                }
                
                setIsLoggingIn(true);
                setLoginError("");
                
                try {
                    const adminRef = window.FirebaseAPI.getPublicDocRef('settings', 'admin');
                    const adminSnap = await window.FirebaseAPI.getDoc(adminRef);
                    
                    let storedUser, storedHash;
                    
                    if (!adminSnap.exists()) {
                        storedUser = "admin";
                        storedHash = await hashString("1234");
                        await window.FirebaseAPI.setDoc(adminRef, { username: storedUser, passwordHash: storedHash });
                    } else {
                        const data = adminSnap.data();
                        storedUser = data.username;
                        storedHash = data.passwordHash;
                    }
                    
                    const inputHash = await hashString(loginPass);
                    
                    if (loginUser === storedUser && inputHash === storedHash) {
                        if (rememberPassword) {
                            localStorage.setItem(ADMIN_REMEMBER_KEY, JSON.stringify({ username: loginUser, password: loginPass }));
                        } else {
                            localStorage.removeItem(ADMIN_REMEMBER_KEY);
                        }
                        setAdminCreds({ username: storedUser });
                        setIsLoggedIn(true);
                    } else {
                        setLoginError("שם משתמש או סיסמה שגויים");
                    }
                } catch (err) {
                    console.error(err);
                    setLoginError("שגיאה בהתחברות למסד הנתונים");
                } finally {
                    setIsLoggingIn(false);
                }
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
                            <h2 className="text-2xl font-bold mb-6 text-gray-800">כניסת מנהל</h2>
                            
                            {loginError && <div className="mb-4 text-red-600 bg-red-50 p-3 rounded-lg text-sm font-bold">{loginError}</div>}
                            
                            <input 
                                type="text" 
                                placeholder="שם משתמש" 
                                className="w-full p-3 mb-4 border rounded-xl text-center focus:ring-2 focus:ring-indigo-500 outline-none" 
                                dir="ltr"
                                autoComplete="username"
                                value={loginUser}
                                onChange={e => setLoginUser(e.target.value)}
                            />
                            <input 
                                type="password" 
                                placeholder="סיסמה" 
                                className="w-full p-3 mb-6 border rounded-xl text-center focus:ring-2 focus:ring-indigo-500 outline-none" 
                                dir="ltr"
                                autoComplete="current-password"
                                value={loginPass}
                                onKeyDown={e => e.key === 'Enter' && handleLogin()}
                                onChange={e => setLoginPass(e.target.value)}
                            />
                            <label className="flex items-center justify-center gap-2 mb-5 text-sm text-gray-700 cursor-pointer select-none">
                                <input
                                    type="checkbox"
                                    checked={rememberPassword}
                                    onChange={e => setRememberPassword(e.target.checked)}
                                    className="w-4 h-4 accent-indigo-600"
                                />
                                <span>זכור סיסמה במכשיר זה</span>
                            </label>
                            <button 
                                onClick={handleLogin} 
                                disabled={isLoggingIn}
                                className={`w-full text-white p-3 rounded-xl font-bold transition-all ${isLoggingIn ? 'bg-indigo-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 shadow-md hover:shadow-lg'}`}>
                                {isLoggingIn ? 'מתחבר...' : 'התחבר'}
                            </button>
                            <button onClick={onLogout} className="mt-4 text-sm text-gray-500 hover:text-gray-700">חזור לאתר</button>
                        </div>
                    </div>
                );
            }

                return (

                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-3xl w-full">

                                <div className="text-4xl mb-3">🏫</div>

                                <button onClick={() => { setSelectedCampus('all'); setActiveTab('dashboard'); }} className="p-6 rounded-2xl border-2 border-gray-200 hover:border-emerald-500 hover:bg-emerald-50 transition-all text-right">
                                    <div className="text-2xl mb-2">🌐</div>
                                    <div className="text-xl font-bold text-gray-800">כל הקמפוסים</div>
                                    <div className="text-sm text-gray-500 mt-1">תמונה כוללת ודוחות משולבים</div>
                                </button>

                        </div>
                    </div>
                );
            }

            const currentCampus = campuses.find(c => c.id === selectedCampus);
            const filteredCoursesByCampus = selectedCampus === 'all' ? courses : courses.filter(c => (c.campusId || 'campus1') === selectedCampus);
            const filteredStudentsByCampus = selectedCampus === 'all' ? students : students.filter(st => (st.campusId || 'campus1') === selectedCampus);
            const filteredGradesByCampus = selectedCampus === 'all' ? grades : grades.filter(g => (g.campusId || 'campus1') === selectedCampus);

            const tabs = [
                { id: 'dashboard', label: 'דשבורד' },
                { id: 'grades', label: 'ניהול שכבות' },
                { id: 'courses', label: 'ניהול קורסים' },
                { id: 'students', label: 'תלמידים נרשמים' },
                { id: 'waitlist', label: 'רשימת המתנה' },
                { id: 'reports', label: 'דוחות והדפסות' },
                { id: 'campuses', label: 'ניהול קמפוסים' },
                { id: 'settings', label: 'הגדרות מערכת' }

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-gray-100">
                    <div className="bg-gray-900 text-white md:w-64 flex-shrink-0 no-print">
                        <div className="p-5 border-b border-gray-800">
                            <h2 className="text-xl font-bold">פאנל ניהול</h2>
                            <div className="text-xs text-gray-400 mt-1">{selectedCampus === 'all' ? 'כל הקמפוסים' : (currentCampus?.name || 'קמפוס')}</div>

                    </div>
                    <div className="flex-1 p-4 md:p-8 overflow-y-auto">
                        {activeTab === 'dashboard' && <AdminDashboard courses={filteredCoursesByCampus} students={filteredStudentsByCampus} grades={filteredGradesByCampus} />}
                        {activeTab === 'grades' && <AdminGrades grades={filteredGradesByCampus} db={dbMethods} campusId={selectedCampus} campuses={campuses} />}
                        {activeTab === 'courses' && <AdminCourses grades={filteredGradesByCampus} courses={filteredCoursesByCampus} students={filteredStudentsByCampus} db={dbMethods} campusId={selectedCampus} campuses={campuses} />}
                        {activeTab === 'students' && <AdminStudents students={filteredStudentsByCampus} courses={filteredCoursesByCampus} grades={filteredGradesByCampus} db={dbMethods} />}
                        {activeTab === 'waitlist' && <AdminWaitlist students={filteredStudentsByCampus} courses={filteredCoursesByCampus} grades={filteredGradesByCampus} />}
                        {activeTab === 'reports' && <AdminReports students={filteredStudentsByCampus} courses={filteredCoursesByCampus} grades={filteredGradesByCampus} settings={settings} campuses={campuses} selectedCampusId={selectedCampus} />}
                        {activeTab === 'campuses' && <AdminCampuses campuses={campuses} db={dbMethods} />}

                    </div>

        };

        const AdminDashboard = ({ courses, students, grades }) => {
            const totalStudents = students.length;
            const totalCourses = courses.length;
            const totalCapacity = courses.reduce((acc, c) => acc + (parseInt(c.capacity) || 0), 0);
            
            let totalSelections = 0;
            students.forEach(s => {
                if(s.semA_1_opt1) totalSelections++;
                if(s.semA_2_opt1) totalSelections++;
                if(s.semB_1_opt1) totalSelections++;
                if(s.semB_2_opt1) totalSelections++;
            });

            const overallFillRate = totalCapacity > 0 ? Math.min(100, Math.round((totalSelections / (totalCapacity || 1)) * 100)) : 0;

            const gradeStats = grades.map(g => {
                const gradeCourses = courses.filter(c => c.gradeId === g.id);
                const gradeStudents = students.filter(s => s.gradeId === g.id);
                const capacity = gradeCourses.reduce((acc, c) => acc + (parseInt(c.capacity) || 0), 0);
                
                let selectionsCount = 0;
                gradeStudents.forEach(s => {
                    if(s.semA_1_opt1) selectionsCount++;
                    if(s.semA_2_opt1) selectionsCount++;
                    if(s.semB_1_opt1) selectionsCount++;
                    if(s.semB_2_opt1) selectionsCount++;
                });

                const fillRate = capacity > 0 ? Math.min(100, Math.round((selectionsCount / capacity) * 100)) : 0;

                return {
                    id: g.id,
                    name: g.name,
                    coursesCount: gradeCourses.length,
                    studentsCount: gradeStudents.length,
                    capacity,
                    selectionsCount,
                    fillRate
                };
            });

            const colors = ['#4F46E5', '#10B981', '#F59E0B', '#EC4899', '#8B5CF6', '#06B6D4'];
