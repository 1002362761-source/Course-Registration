<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת בחירת קורסים</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- html2canvas & jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- XLSX for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Rubik', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }
        .smooth-transition { transition: all 0.3s ease-in-out; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate { animation: slideIn 0.3s ease-out forwards; }

        /* Print Styles - hide everything except the print container */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==============================================================================
        // ⚙️ הגדרות חיבור למסד הנתונים FIREBASE
        // הדבק כאן את הקוד שקיבלת מ-Firebase Console במידה ואתה מארח את האתר באופן עצמאי
        // ==============================================================================
        const CUSTOM_FIREBASE_CONFIG = {
            apiKey: "AIzaSyAOA9HoyXk1nZ8MPX4Ri-YYlpIQ5NYsch8",
			authDomain: "course-registration-c3f3b.firebaseapp.com",
			projectId: "course-registration-c3f3b",
			storageBucket: "course-registration-c3f3b.firebasestorage.app",
			messagingSenderId: "112925799307",
			appId: "1:112925799307:web:dd268ba023e09c1452b58e"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'course-reg-sys';
        
        // בחירת הגדרות – עדיפות להגדרות מותאמות אישית אם הוגדרו, אחרת שימוש בסביבת ההרצה
        const firebaseConfig = (CUSTOM_FIREBASE_CONFIG && Object.keys(CUSTOM_FIREBASE_CONFIG).length > 0)
            ? CUSTOM_FIREBASE_CONFIG
            : (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null);
        
        // Expose Firebase API to window so React (Babel) can access it
        window.FirebaseAPI = {
            appId,
            isConfigured: !!firebaseConfig,
            init: async () => {
                if (!firebaseConfig) {
                    console.warn("Firebase config missing. Running in demo / unconfigured mode.");
                    return null;
                }
                try {
                    const app = initializeApp(firebaseConfig);
                    const db = getFirestore(app);
                    const auth = getAuth(app);
                    window.FirebaseAPI.db = db;
                    window.FirebaseAPI.auth = auth;
                    window.FirebaseAPI.doc = doc;
                    window.FirebaseAPI.getDoc = getDoc;
                    window.FirebaseAPI.getDocs = getDocs;
                    window.FirebaseAPI.setDoc = setDoc;
                    window.FirebaseAPI.updateDoc = updateDoc;
                    window.FirebaseAPI.deleteDoc = deleteDoc;
                    window.FirebaseAPI.onSnapshot = onSnapshot;
                    window.FirebaseAPI.collection = collection;
                    
                    if (typeof __initial_auth_token !== 'undefined') {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    return auth.currentUser;
                } catch (e) {
                    console.error("Firebase init failed:", e);
                    return null;
                }
            },
            getPublicDataRef: (colName) => collection(window.FirebaseAPI.db, 'artifacts', appId, 'public', 'data', colName),
            getPublicDocRef: (colName, docId) => doc(window.FirebaseAPI.db, 'artifacts', appId, 'public', 'data', colName, String(docId))
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // פונקציית עזר להצפנת סיסמה (SHA-256) למניעת שמירת סיסמה גלויה במסד הנתונים
        const hashString = async (str) => {
            const msgUint8 = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const defaultSettings = {
            schoolName: "מרכז מדע ודעת למצטיינים ומחוננים תל-חי",
            year: "תשפ\"ו",
            welcomeTitle: "טופס רישום לקורסים תוכנית המצטיינים",
            welcomeText: "תלמידות תלמידים והורים יקרים!\nמצורף טופס בחירת קורסים לשנת תשפ\"ו. אנא בחרו את הקורסים המועדפים עליכם מתוך הקורסים הבאים.\n\nשימו לב, הבחירה היא לשתי מחציות - בכל מחצית בחרו 2 קורסים - אופציה ראשונה ואופציה שנייה.\nאין אנו מבטיחים שתשובצו בקורסים שתבחרו כאופציה א - אך אנו נעשה את מירב המאמצים להתחשב בבחירתכם."
        };

        // --- Main App Component (Handles Data Sync) ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [loading, setLoading] = useState(true);
            const [configMissing, setConfigMissing] = useState(false);
            
            // Global Data States
            const [settings, setSettings] = useState(defaultSettings);
            const [grades, setGrades] = useState([]);
            const [courses, setCourses] = useState([]);
            const [students, setStudents] = useState([]);

            useEffect(() => {
                const setupFirebase = async () => {
                    if (!window.FirebaseAPI.isConfigured) {
                        setConfigMissing(true);
                        setLoading(false);
                        return;
                    }
                    const currentUser = await window.FirebaseAPI.init();
                    setUser(currentUser);
                };
                setTimeout(setupFirebase, 400); 
            }, []);

            useEffect(() => {
                if (!user || !window.FirebaseAPI.db) return;

                const db = window.FirebaseAPI;
                
                // 1. Listen to Settings
                const unsubSettings = db.onSnapshot(db.getPublicDocRef('settings', 'main'), (doc) => {
                    if (doc.exists()) setSettings(doc.data());
                    else db.setDoc(db.getPublicDocRef('settings', 'main'), defaultSettings);
                }, (err) => console.error(err));

                // 2. Listen to Grades
                const unsubGrades = db.onSnapshot(db.getPublicDataRef('grades'), (snapshot) => {
                    const g = [];
                    snapshot.forEach(doc => g.push({ id: doc.id, ...doc.data() }));
                    if(g.length === 0) {
                        const defaultGrades = [{id: "grade1", name: "כיתות ג'-ה'"}, {id: "grade2", name: "כיתות ו'-ט'"}];
                        defaultGrades.forEach(grade => db.setDoc(db.getPublicDocRef('grades', grade.id), { name: grade.name }));
                    } else {
                        setGrades(g);
                    }
                }, (err) => console.error(err));

                // 3. Listen to Courses
                const unsubCourses = db.onSnapshot(db.getPublicDataRef('courses'), (snapshot) => {
                    const c = [];
                    snapshot.forEach(doc => c.push({ id: doc.id, ...doc.data() }));
                    setCourses(c);
                }, (err) => console.error(err));

                // 4. Listen to Students
                const unsubStudents = db.onSnapshot(db.getPublicDataRef('students'), (snapshot) => {
                    const s = [];
                    snapshot.forEach(doc => s.push({ id: doc.id, ...doc.data() }));
                    setStudents(s);
                    setLoading(false);
                }, (err) => console.error(err));

                return () => {
                    unsubSettings(); unsubGrades(); unsubCourses(); unsubStudents();
                };
            }, [user]);

            // Database mutation helpers
            const dbMethods = {
                saveSettings: async (newSettings) => {
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('settings', 'main'), newSettings);
                },
                addGrade: async (name) => {
                    const id = 'grade_' + Date.now();
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('grades', id), { name });
                },
                updateGrade: async (id, name) => {
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('grades', id), { name }, { merge: true });
                },
                deleteGrade: async (id) => {
                    await window.FirebaseAPI.deleteDoc(window.FirebaseAPI.getPublicDocRef('grades', id));
                },
                saveCourse: async (courseData) => {
                    const id = courseData.id || 'course_' + Date.now();
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('courses', id), courseData);
                },
                deleteCourse: async (id) => {
                    await window.FirebaseAPI.deleteDoc(window.FirebaseAPI.getPublicDocRef('courses', id));
                },
                registerStudent: async (studentData) => {
                    const id = 'student_' + Date.now();
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('students', id), studentData);
                    
                    const allSelections = [
                        studentData.semA_1_opt1, studentData.semA_1_opt2,
                        studentData.semA_2_opt1, studentData.semA_2_opt2,
                        studentData.semB_1_opt1, studentData.semB_1_opt2,
                        studentData.semB_2_opt1, studentData.semB_2_opt2
                    ].filter(Boolean);

                    const uniqueCourseIds = [...new Set(allSelections)];
                    
                    await Promise.all(uniqueCourseIds.map(async (courseId) => {
                        const course = courses.find(c => c.id === courseId);
                        if(course) {
                            await window.FirebaseAPI.updateDoc(window.FirebaseAPI.getPublicDocRef('courses', courseId), {
                                registeredCount: (course.registeredCount || 0) + 1
                            });
                        }
                    }));
                },
                deleteStudent: async (student) => {
                    if (!student?.id) return;

                    const allSelections = [
                        student.semA_1_opt1, student.semA_1_opt2,
                        student.semA_2_opt1, student.semA_2_opt2,
                        student.semB_1_opt1, student.semB_1_opt2,
                        student.semB_2_opt1, student.semB_2_opt2
                    ].filter(Boolean);
                    const uniqueCourseIds = [...new Set(allSelections)];

                    await Promise.all(uniqueCourseIds.map(async (courseId) => {
                        const course = courses.find(c => c.id === courseId);
                        if(course) {
                            await window.FirebaseAPI.updateDoc(window.FirebaseAPI.getPublicDocRef('courses', courseId), {
                                registeredCount: Math.max(0, (course.registeredCount || 0) - 1)
                            });
                        }
                    }));

                    await window.FirebaseAPI.deleteDoc(window.FirebaseAPI.getPublicDocRef('students', student.id));
                }
            };

            if (configMissing) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4" dir="rtl">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center border border-amber-200">
                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">⚠️</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">מסד הנתונים לא מוגדר עדיין</h2>
                            <p className="text-gray-600 text-sm mb-6 leading-relaxed">
                                כדי שהמערכת תתחיל לשמור נתונים בענן, יש לפתוח פרויקט בחינם ב-<strong>Firebase Console</strong> ולהדביק את מפתח ההתחברות בתוך קוד ה-HTML במשתנה <code className="bg-gray-100 px-2 py-1 rounded text-red-600 dir-ltr inline-block">CUSTOM_FIREBASE_CONFIG</code>.
                            </p>
                            <div className="bg-gray-50 p-4 rounded-xl text-right text-xs text-gray-600 font-mono mb-6 border">
                                <div>1. היכנס ל- console.firebase.google.com</div>
                                <div>2. צור פרויקט חדש + בסיס נתונים Cloud Firestore</div>
                                <div>3. העתק את הגדרות האפליקציה (web app config)</div>
                                <div>4. הדבק אותן בתוך קובץ ה-index.html בשורה 43</div>
                            </div>
                            <p className="text-xs text-gray-500">עקוב אחר ההוראות המפורטות במופע השיחה לקבלת מדריך צעד-אחר-צעד.</p>
                        </div>
                    </div>
                );
            }

            if (loading) return <div className="min-h-screen flex items-center justify-center font-bold text-xl text-indigo-600">מתחבר למסד הנתונים...</div>;

            return (
                <div className="min-h-screen relative">
                    {isAdminMode ? (
                        <AdminApp 
                            settings={settings} grades={grades} courses={courses} students={students}
                            dbMethods={dbMethods}
                            onLogout={() => setIsAdminMode(false)}
                        />
                    ) : (
                        <StudentApp 
                            settings={settings} grades={grades} courses={courses} 
                            dbMethods={dbMethods}
                            onAdminLogin={() => setIsAdminMode(true)}
                        />
                    )}
                </div>
            );
        };

        const StudentApp = ({ settings, grades, courses, dbMethods, onAdminLogin }) => {
            const [step, setStep] = useState(0); 
            const [toastMsg, setToastMsg] = useState("");
            
            const [studentDetails, setStudentDetails] = useState({
                firstName: "", lastName: "", gradeId: grades.length > 0 ? grades[0].id : "", email: ""
            });

            useEffect(() => {
                if(grades.length > 0 && !studentDetails.gradeId) {
                    setStudentDetails(prev => ({...prev, gradeId: grades[0].id}));
                }
            }, [grades]);

            const [selections, setSelections] = useState({
                semA_1_opt1: null, semA_1_opt2: null,
                semA_2_opt1: null, semA_2_opt2: null,
                semB_1_opt1: null, semB_1_opt2: null,
                semB_2_opt1: null, semB_2_opt2: null,
            });

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(""), 2500);
            };

            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

            const nextStep = (customMessage) => {
                if (customMessage) showToast(customMessage);
                setStep(s => s + 1);
                scrollToTop();
            };

            const prevStep = () => {
                setStep(s => s - 1);
                scrollToTop();
            };

            const handleCourseSelect = (slotKey, priority, courseId) => {
                setSelections(prev => {
                    const newState = { ...prev };
                    if (priority === 1 && newState[`${slotKey}_opt2`] === courseId) newState[`${slotKey}_opt2`] = null;
                    if (priority === 2 && newState[`${slotKey}_opt1`] === courseId) newState[`${slotKey}_opt1`] = null;
                    newState[`${slotKey}_opt${priority}`] = courseId;
                    return newState;
                });
            };

            const canProceedFromDetails = studentDetails.firstName && studentDetails.lastName && studentDetails.email && studentDetails.gradeId;
            
            const checkSlotCompletion = (slotKey) => {
                return selections[`${slotKey}_opt1`] && selections[`${slotKey}_opt2`] && 
                       selections[`${slotKey}_opt1`] !== selections[`${slotKey}_opt2`];
            };

            const submitRegistration = async () => {
                const regData = {
                    date: new Date().toLocaleDateString('he-IL') + " " + new Date().toLocaleTimeString('he-IL'),
                    ...studentDetails,
                    ...selections
                };
                
                await dbMethods.registerStudent(regData);
                nextStep("ההרשמה בוצעה ושמורה במערכת בהצלחה!");
            };

            const renderStepContent = () => {
                switch(step) {
                    case 0: return <IntroStep settings={settings} onNext={() => nextStep()} onAdmin={onAdminLogin} />;
                    case 1: return <DetailsStep details={studentDetails} setDetails={setStudentDetails} grades={grades} onNext={() => nextStep()} canProceed={canProceedFromDetails} />;
                    case 2: return <CourseSelectionStep title="מחצית א' - שעה ראשונה" semester="א" track="שעה ראשונה" slotKey="semA_1" courses={courses} details={studentDetails} selections={selections} onSelect={handleCourseSelect} onNext={() => nextStep("עוברים לשעה השנייה.")} onPrev={prevStep} canProceed={checkSlotCompletion('semA_1')} />;
                    case 3: return <CourseSelectionStep title="מחצית א' - שעה שנייה" semester="א" track="שעה שנייה" slotKey="semA_2" courses={courses} details={studentDetails} selections={selections} onSelect={handleCourseSelect} onNext={() => nextStep("מחצית א' הושלמה!")} onPrev={prevStep} canProceed={checkSlotCompletion('semA_2')} />;
                    case 4: return <CourseSelectionStep title="מחצית ב' - שעה ראשונה" isSemB={true} semester="ב" track="שעה ראשונה" slotKey="semB_1" courses={courses} details={studentDetails} selections={selections} onSelect={handleCourseSelect} onNext={() => nextStep("עוברים לשעה השנייה.")} onPrev={prevStep} canProceed={checkSlotCompletion('semB_1')} />;
                    case 5: return <CourseSelectionStep title="מחצית ב' - שעה שנייה" isSemB={true} semester="ב" track="שעה שנייה" slotKey="semB_2" courses={courses} details={studentDetails} selections={selections} onSelect={handleCourseSelect} onNext={() => nextStep()} onPrev={prevStep} canProceed={checkSlotCompletion('semB_2')} />;
                    case 6: return <SummaryStep details={studentDetails} selections={selections} courses={courses} grades={grades} onPrev={prevStep} onSubmit={submitRegistration} />;
                    case 7: return <SuccessStep details={studentDetails} selections={selections} courses={courses} grades={grades} settings={settings} />;
                    default: return null;
                }
            };

            const progress = step === 0 || step === 7 ? 0 : (step / 6) * 100;

            return (
                <div className="pb-20">
                    <header className="bg-indigo-900 text-white p-4 shadow-md sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold">{settings.schoolName}</h1>
                            {step === 0 && (
                                <button onClick={onAdminLogin} className="text-indigo-200 hover:text-white text-sm flex items-center gap-1">
                                    הנהלה
                                </button>
                            )}
                        </div>
                        {step > 0 && step < 7 && (
                            <div className="max-w-4xl mx-auto mt-4 h-2 bg-indigo-800 rounded-full overflow-hidden">
                                <div className="h-full bg-blue-400 transition-all duration-500" style={{ width: `${progress}%` }}></div>
                            </div>
                        )}
                    </header>

                    {toastMsg && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 toast-animate">
                            <div className="bg-green-600 text-white px-6 py-3 rounded-full shadow-lg font-medium">
                                {toastMsg}
                            </div>
                        </div>
                    )}

                    <main className="max-w-4xl mx-auto p-4 mt-6">
                        {renderStepContent()}
                    </main>
                </div>
            );
        };

        const IntroStep = ({ settings, onNext }) => (
            <div className="glass-panel rounded-2xl p-8 text-center max-w-2xl mx-auto shadow-xl mt-10">
                <div className="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <span className="text-3xl">🎓</span>
                </div>
                <h2 className="text-3xl font-bold text-gray-800 mb-6">{settings.welcomeTitle}</h2>
                <div className="text-lg text-gray-600 mb-8 whitespace-pre-wrap leading-relaxed text-right bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                    {settings.welcomeText}
                </div>
                <button onClick={onNext} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-full shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all text-xl w-full sm:w-auto">
                    התחל הרשמה
                </button>
            </div>
        );

        const DetailsStep = ({ details, setDetails, grades, onNext, canProceed }) => (
            <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-gray-200">
                <h2 className="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">פרטים אישיים</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">שם פרטי *</label>
                        <input type="text" className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500" value={details.firstName} onChange={e => setDetails({...details, firstName: e.target.value})} />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">שם משפחה *</label>
                        <input type="text" className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500" value={details.lastName} onChange={e => setDetails({...details, lastName: e.target.value})} />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">דוא"ל הורה *</label>
                        <input type="email" className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500" value={details.email} onChange={e => setDetails({...details, email: e.target.value})} dir="ltr" />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">שכבה *</label>
                        <select className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white" value={details.gradeId} onChange={e => setDetails({...details, gradeId: e.target.value})}>
                            {grades.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                        </select>
                    </div>

        const CourseSelectionStep = ({ title, semester, track, slotKey, courses, details, selections, onSelect, onNext, onPrev, canProceed, isSemB = false }) => {
            const availableCourses = courses.filter(c => c.semester === semester && c.track === track && c.gradeId === details.gradeId);

            return (
                <div className="space-y-6 animate-[slideIn_0.3s_ease-out]">

                        <p className="text-white/80">יש לבחור עדיפות ראשונה ועדיפות שנייה. לא ניתן לבחור את אותו הקורס פעמיים.</p>
                    </div>

                    {availableCourses.length === 0 ? (

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {availableCourses.map(course => {
                                const isFull = (course.registeredCount || 0) >= course.capacity;
                                const isOpt1 = opt1Id === course.id;
                                const isOpt2 = opt2Id === course.id;
                                
                                let cardStyle = "border-gray-200 bg-white hover:border-gray-300";
                                if (isOpt1) cardStyle = "border-indigo-500 bg-indigo-50 ring-2 ring-indigo-200 shadow-md";
                                else if (isOpt2) cardStyle = "border-amber-500 bg-amber-50 ring-2 ring-amber-200 shadow-md";
                                else if (isFull) cardStyle = "border-gray-200 bg-gray-50 opacity-75";

                                return (
                                    <div key={course.id} className={`border-2 rounded-2xl p-5 smooth-transition relative overflow-hidden ${cardStyle}`}>
                                        {isOpt1 && <div className="absolute top-0 right-0 bg-indigo-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">🎯 עדיפות 1</div>}
                                        {isOpt2 && <div className="absolute top-0 right-0 bg-amber-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">⭐ עדיפות 2</div>}

                                        <div className="flex justify-between items-start mb-2 mt-2">
                                            <h3 className={`text-lg font-bold ${isOpt1 ? 'text-indigo-900' : isOpt2 ? 'text-amber-900' : 'text-gray-800'}`}>{course.name}</h3>
                                            <span className={`text-xs font-semibold px-2 py-1 rounded-full ${isFull ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                {isFull ? 'מלא' : `פנוי (${course.capacity - (course.registeredCount||0)})`}
                                            </span>
                                        </div>
                                        <p className="text-gray-600 text-sm mb-5 min-h-[40px]">{course.description}</p>
                                        
                                        <div className="flex gap-2">
                                            <button onClick={() => onSelect(slotKey, 1, course.id)} className={`flex-1 py-2 px-1 rounded-xl text-sm font-semibold transition-colors border ${isOpt1 ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}>אופציה 1</button>
                                            <button onClick={() => onSelect(slotKey, 2, course.id)} className={`flex-1 py-2 px-1 rounded-xl text-sm font-semibold transition-colors border ${isOpt2 ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}>אופציה 2</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    <div className="flex justify-between mt-8 border-t pt-6 border-gray-200">
                        <button onClick={onPrev} className="px-6 py-3 text-gray-600 font-medium hover:bg-gray-100 rounded-xl">חזור</button>
                        <button onClick={onNext} disabled={!canProceed && availableCourses.length > 0} className={`px-8 py-3 rounded-xl font-bold text-white transition-all ${(canProceed || availableCourses.length===0) ? (isSemB ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-indigo-600 hover:bg-indigo-700') : 'bg-gray-300 cursor-not-allowed'}`}>המשך לשלב הבא</button>
                    </div>
                </div>
            );
        };

        const SummaryStep = ({ details, selections, courses, grades, onPrev, onSubmit }) => {
            const getCourseName = (id) => courses.find(c => c.id === id)?.name || "-";
            const gradeName = grades.find(g => g.id === details.gradeId)?.name || "";
            
            const renderSlot = (title, slotKey) => (
                <div className="bg-gray-50 rounded-xl p-4 border border-gray-200">
                    <h4 className="font-bold text-gray-700 mb-3 border-b pb-2">{title}</h4>
                    <div className="space-y-2">
                        <div className="flex items-center gap-2"><span className="bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded font-bold">אופציה 1</span><span className="text-gray-800 font-medium">{getCourseName(selections[`${slotKey}_opt1`])}</span></div>
                        <div className="flex items-center gap-2"><span className="bg-amber-100 text-amber-700 text-xs px-2 py-1 rounded font-bold">אופציה 2</span><span className="text-gray-800 font-medium">{getCourseName(selections[`${slotKey}_opt2`])}</span></div>
                    </div>
                </div>
            );

            return (
                <div className="bg-white rounded-2xl p-6 md:p-8 shadow-lg">
                    <div className="text-center mb-8"><h2 className="text-3xl font-bold text-gray-800">סיכום הבקשה</h2></div>
                    <div className="bg-blue-50 text-blue-900 p-4 rounded-xl mb-6">
                        <h3 className="font-bold mb-1">פרטי תלמיד:</h3>
                        <p>{details.firstName} {details.lastName} | שכבה: {gradeName} | דוא"ל: {details.email}</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        {renderSlot("מחצית א' - שעה 1", "semA_1")}
                        {renderSlot("מחצית א' - שעה 2", "semA_2")}
                        {renderSlot("מחצית ב' - שעה 1", "semB_1")}
                        {renderSlot("מחצית ב' - שעה 2", "semB_2")}
                    </div>
                    <div className="flex justify-between border-t pt-6">
                        <button onClick={onPrev} className="px-6 py-3 text-gray-600 font-medium hover:bg-gray-100 rounded-xl">חזור</button>

                    </div>
                </div>
            );
        };

        const SuccessStep = ({ details, selections, courses, grades, settings }) => {
            const receiptRef = useRef(null);
            const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
            const getCourseName = (id) => courses.find(c => c.id === id)?.name || "-";
            const gradeName = grades.find(g => g.id === details.gradeId)?.name || "-";
            const currentYear = new Date().getFullYear();
            const registrationDate = new Date().toLocaleDateString('he-IL');

            const receiptRows = [
                ["מחצית א' - שעה ראשונה", getCourseName(selections.semA_1_opt1), getCourseName(selections.semA_1_opt2)],
                ["מחצית א' - שעה שנייה", getCourseName(selections.semA_2_opt1), getCourseName(selections.semA_2_opt2)],
                ["מחצית ב' - שעה ראשונה", getCourseName(selections.semB_1_opt1), getCourseName(selections.semB_1_opt2)],
                ["מחצית ב' - שעה שנייה", getCourseName(selections.semB_2_opt1), getCourseName(selections.semB_2_opt2)]
            ];

            const downloadRegistrationPdf = async () => {
                if (!receiptRef.current || !window.html2canvas || !window.jspdf) return;
                try {
                    setIsGeneratingPdf(true);
                    const canvas = await window.html2canvas(receiptRef.current, {
                        scale: 2,
                        backgroundColor: '#ffffff',
                        useCORS: true
                    });
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    const margin = 10;
                    const imgWidth = pageWidth - margin * 2;
                    const imgHeight = canvas.height * imgWidth / canvas.width;

                    if (imgHeight <= pageHeight - margin * 2) {
                        pdf.addImage(imgData, 'PNG', margin, margin, imgWidth, imgHeight);
                    } else {
                        let heightLeft = imgHeight;
                        let position = margin;
                        pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
                        heightLeft -= (pageHeight - margin * 2);
                        while (heightLeft > 0) {
                            position = margin - (imgHeight - heightLeft);
                            pdf.addPage();
                            pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
                            heightLeft -= (pageHeight - margin * 2);
                        }
                    }

                    const safeName = `${details.firstName}_${details.lastName}`.replace(/\s+/g, '_');
                    pdf.save(`אישור_הרשמה_${safeName}.pdf`);
                } catch (err) {
                    console.error('PDF generation failed:', err);
                    alert('אירעה שגיאה ביצירת קובץ ה-PDF. נסה שוב.');
                } finally {
                    setIsGeneratingPdf(false);
                }
            };

            const sendParentEmail = () => {
                const subject = `אישור הרשמה לקורסים - ${details.firstName} ${details.lastName}`;
                const choices = receiptRows.map(row => `${row[0]}: אופציה 1 - ${row[1]} | אופציה 2 - ${row[2]}`).join('\n');
                const body = `${settings.schoolName}\nשנת לימודים: ${settings.year} | ${currentYear}\n\nשלום,\nמצורף סיכום בחירת הקורסים של ${details.firstName} ${details.lastName}, שכבה ${gradeName}.\n\n${choices}\n\nתאריך הרשמה: ${registrationDate}\n\nבברכה,\n${settings.schoolName}`;
                window.location.href = `mailto:${encodeURIComponent(details.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            };

            return (
                <div className="space-y-6">
                    <div className="text-center py-10 bg-white rounded-2xl shadow-lg p-8">
                        <div className="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6"><span className="text-4xl">✓</span></div>
                        <h2 className="text-3xl font-bold text-gray-800 mb-3">ההרשמה נשמרה בהצלחה!</h2>
                        <p className="text-gray-600 mb-7 text-lg">ניתן כעת להוריד אישור PDF מסודר או לשלוח העתק של פרטי ההרשמה למייל ההורה: <strong dir="ltr">{details.email}</strong></p>

                        <div className="flex flex-col sm:flex-row justify-center gap-3 mb-5">
                            <button onClick={downloadRegistrationPdf} disabled={isGeneratingPdf} className={`font-bold py-3 px-6 rounded-xl text-white shadow-md transition-all ${isGeneratingPdf ? 'bg-emerald-400 cursor-wait' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                                {isGeneratingPdf ? 'מכין PDF...' : '📄 הורדת אישור הרשמה PDF'}
                            </button>
                            <button onClick={sendParentEmail} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-md">✉️ שליחת העתק למייל ההורה</button>
                        </div>
                        <p className="text-xs text-gray-500 mb-6">כפתור המייל פותח את תוכנת הדואר במכשיר עם כתובת ההורה וסיכום ההרשמה מוכנים לשליחה.</p>
                        <button onClick={() => window.location.reload()} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl">חזרה למסך הראשי</button>
                    </div>

                    <div ref={receiptRef} dir="rtl" className="bg-white p-8 md:p-10 border border-gray-200 rounded-2xl text-right max-w-4xl mx-auto" style={{ fontFamily: 'Rubik, Arial, sans-serif' }}>
                        <div className="text-center border-b-2 border-indigo-700 pb-5 mb-6">
                            <h1 className="text-3xl font-bold text-indigo-900 mb-2">מרכז מדע ודעת למצטיינים ומחוננים תל-חי</h1>
                            <h2 className="text-xl font-bold text-gray-800">אישור הרשמה ובחירת קורסים</h2>
                            <p className="text-gray-600 mt-2">שנת הלימודים: <strong>{settings.year}</strong> | שנה: <strong>{currentYear}</strong></p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 bg-gray-50 border rounded-xl p-5 mb-6">
                            <p><strong>שם התלמיד/ה:</strong> {details.firstName} {details.lastName}</p>
                            <p><strong>שכבה:</strong> {gradeName}</p>
                            <p><strong>דוא"ל הורה:</strong> <span dir="ltr">{details.email}</span></p>
                            <p><strong>תאריך הרשמה:</strong> {registrationDate}</p>
                        </div>

                        <table className="w-full border-collapse mb-6 text-sm md:text-base">
                            <thead>
                                <tr className="bg-indigo-50 text-indigo-900">
                                    <th className="border p-3">מחצית / שעה</th>
                                    <th className="border p-3">אופציה ראשונה</th>
                                    <th className="border p-3">אופציה שנייה</th>
                                </tr>
                            </thead>
                            <tbody>
                                {receiptRows.map((row, idx) => (
                                    <tr key={idx}>
                                        <td className="border p-3 font-bold">{row[0]}</td>
                                        <td className="border p-3">{row[1]}</td>
                                        <td className="border p-3">{row[2]}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>

                        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-gray-700">
                            <strong>הערה:</strong> מסמך זה מהווה אישור על קליטת בחירת הקורסים במערכת. השיבוץ הסופי ייקבע בהתאם לזמינות המקומות ולשיקולי המרכז.
                        </div>
                        <div className="text-center text-xs text-gray-500 mt-8 pt-4 border-t">מרכז מדע ודעת למצטיינים ומחוננים תל-חי</div>
                    </div>
                </div>
            );
        };

        const AdminApp = ({ settings, grades, courses, students, dbMethods, onLogout }) => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [adminCreds, setAdminCreds] = useState(null);

            const [loginUser, setLoginUser] = useState("");
            const [loginPass, setLoginPass] = useState("");
            const [loginError, setLoginError] = useState("");
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            
            const handleLogin = async () => {
                if (!loginUser || !loginPass) {
                    setLoginError("יש להזין שם משתמש וסיסמה");
                    return;
                }
                
                setIsLoggingIn(true);
                setLoginError("");
                
                try {
                    const adminRef = window.FirebaseAPI.getPublicDocRef('settings', 'admin');
                    const adminSnap = await window.FirebaseAPI.getDoc(adminRef);
                    
                    let storedUser, storedHash;
                    
                    if (!adminSnap.exists()) {
                        storedUser = "admin";
                        storedHash = await hashString("1234");
                        await window.FirebaseAPI.setDoc(adminRef, { username: storedUser, passwordHash: storedHash });
                    } else {
                        const data = adminSnap.data();
                        storedUser = data.username;
                        storedHash = data.passwordHash;
                    }
                    
                    const inputHash = await hashString(loginPass);
                    
                    if (loginUser === storedUser && inputHash === storedHash) {
                        setAdminCreds({ username: storedUser });
                        setIsLoggedIn(true);
                    } else {
                        setLoginError("שם משתמש או סיסמה שגויים");
                    }
                } catch (err) {
                    console.error(err);
                    setLoginError("שגיאה בהתחברות למסד הנתונים");
                } finally {
                    setIsLoggingIn(false);
                }
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
                            <h2 className="text-2xl font-bold mb-6 text-gray-800">כניסת מנהל</h2>
                            
                            {loginError && <div className="mb-4 text-red-600 bg-red-50 p-3 rounded-lg text-sm font-bold">{loginError}</div>}
                            
                            <input 
                                type="text" 
                                placeholder="שם משתמש" 
                                className="w-full p-3 mb-4 border rounded-xl text-center focus:ring-2 focus:ring-indigo-500 outline-none" 
                                dir="ltr"
                                value={loginUser}
                                onChange={e => setLoginUser(e.target.value)}
                            />
                            <input 
                                type="password" 
                                placeholder="סיסמה" 
                                className="w-full p-3 mb-6 border rounded-xl text-center focus:ring-2 focus:ring-indigo-500 outline-none" 
                                dir="ltr"
                                value={loginPass}
                                onKeyDown={e => e.key === 'Enter' && handleLogin()}
                                onChange={e => setLoginPass(e.target.value)}
                            />
                            <button 
                                onClick={handleLogin} 
                                disabled={isLoggingIn}
                                className={`w-full text-white p-3 rounded-xl font-bold transition-all ${isLoggingIn ? 'bg-indigo-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 shadow-md hover:shadow-lg'}`}>
                                {isLoggingIn ? 'מתחבר...' : 'התחבר'}
                            </button>
                            <button onClick={onLogout} className="mt-4 text-sm text-gray-500 hover:text-gray-700">חזור לאתר</button>
                        </div>
                    </div>
                );
            }

            const tabs = [
                { id: 'dashboard', label: 'דשבורד' },
                { id: 'grades', label: 'ניהול שכבות' },
                { id: 'courses', label: 'ניהול קורסים' },
                { id: 'students', label: 'תלמידים נרשמים' },
                { id: 'reports', label: 'דוחות והדפסות' },
                { id: 'settings', label: 'הגדרות מערכת' }
            ];

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-gray-100">
                    <div className="bg-gray-900 text-white md:w-64 flex-shrink-0 no-print">
                        <div className="p-5 border-b border-gray-800"><h2 className="text-xl font-bold">פאנל ניהול</h2></div>
                        <nav className="flex md:flex-col overflow-x-auto p-2 gap-2">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`whitespace-nowrap px-4 py-3 rounded-xl text-right transition-colors ${activeTab === t.id ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'}`}>
                                    {t.label}
                                </button>
                            ))}
                            <button onClick={onLogout} className="px-4 py-3 rounded-xl text-right text-red-400 hover:bg-gray-800 mt-auto">התנתק</button>
                        </nav>
                    </div>
                    <div className="flex-1 p-4 md:p-8 overflow-y-auto">
                        {activeTab === 'dashboard' && <AdminDashboard courses={courses} students={students} grades={grades} />}
                        {activeTab === 'grades' && <AdminGrades grades={grades} db={dbMethods} />}
                        {activeTab === 'courses' && <AdminCourses grades={grades} courses={courses} db={dbMethods} />}
                        {activeTab === 'students' && <AdminStudents students={students} courses={courses} grades={grades} db={dbMethods} />}
                        {activeTab === 'reports' && <AdminReports students={students} courses={courses} grades={grades} settings={settings} />}
                        {activeTab === 'settings' && <AdminSettings settings={settings} db={dbMethods} adminCreds={adminCreds} />}
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ courses, students, grades }) => {
            const totalStudents = students.length;
            const totalCourses = courses.length;
            const totalCapacity = courses.reduce((acc, c) => acc + (parseInt(c.capacity) || 0), 0);
            
            let totalSelections = 0;
            students.forEach(s => {
                if(s.semA_1_opt1) totalSelections++;
                if(s.semA_2_opt1) totalSelections++;
                if(s.semB_1_opt1) totalSelections++;
                if(s.semB_2_opt1) totalSelections++;
            });

            const overallFillRate = totalCapacity > 0 ? Math.min(100, Math.round((totalSelections / (totalCapacity || 1)) * 100)) : 0;

            const gradeStats = grades.map(g => {
                const gradeCourses = courses.filter(c => c.gradeId === g.id);
                const gradeStudents = students.filter(s => s.gradeId === g.id);
                const capacity = gradeCourses.reduce((acc, c) => acc + (parseInt(c.capacity) || 0), 0);
                
                let selectionsCount = 0;
                gradeStudents.forEach(s => {
                    if(s.semA_1_opt1) selectionsCount++;
                    if(s.semA_2_opt1) selectionsCount++;
                    if(s.semB_1_opt1) selectionsCount++;
                    if(s.semB_2_opt1) selectionsCount++;
                });

                const fillRate = capacity > 0 ? Math.min(100, Math.round((selectionsCount / capacity) * 100)) : 0;

                return {
                    id: g.id,
                    name: g.name,
                    coursesCount: gradeCourses.length,
                    studentsCount: gradeStudents.length,
                    capacity,
                    selectionsCount,
                    fillRate
                };
            });

            const colors = ['#4F46E5', '#10B981', '#F59E0B', '#EC4899', '#8B5CF6', '#06B6D4'];

            let cumulativePercent = 0;
            const donutSlices = gradeStats.map((g, idx) => {
                const percent = totalStudents > 0 ? (g.studentsCount / totalStudents) * 100 : 0;
                const strokeDasharray = `${percent} ${100 - percent}`;
                const strokeDashoffset = 100 - cumulativePercent + 25;
                cumulativePercent += percent;
                return {
                    ...g,
                    percent: Math.round(percent),
                    color: colors[idx % colors.length],
                    strokeDasharray,
                    strokeDashoffset
                };
            });

            const fullCourses = courses.filter(c => (c.registeredCount || 0) >= c.capacity);
            const highDemandCourses = [...courses]
                .sort((a, b) => ((b.registeredCount || 0) / b.capacity) - ((a.registeredCount || 0) / a.capacity))
                .slice(0, 4);

            return (
                <div className="space-y-8 animate-[slideIn_0.3s_ease-out]">
                    <div className="flex justify-between items-center border-b pb-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">דאשבורד ותמונת מצב כללית</h2>
                            <p className="text-sm text-gray-500">נתונים בזמן אמת על תפוסת הקורסים והרשמות התלמידים</p>
