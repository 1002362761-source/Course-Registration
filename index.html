            let cumulativePercent = 0;
            const donutSlices = gradeStats.map((g, idx) => {
                const percent = totalStudents > 0 ? (g.studentsCount / totalStudents) * 100 : 0;
                const strokeDasharray = `${percent} ${100 - percent}`;
                const strokeDashoffset = 100 - cumulativePercent + 25;
                cumulativePercent += percent;
                return {
                    ...g,
                    percent: Math.round(percent),
                    color: colors[idx % colors.length],
                    strokeDasharray,
                    strokeDashoffset
                };
            });

            const fullCourses = courses.filter(c => (c.registeredCount || 0) >= c.capacity);
            const highDemandCourses = [...courses]
                .sort((a, b) => ((b.registeredCount || 0) / b.capacity) - ((a.registeredCount || 0) / a.capacity))
                .slice(0, 4);

            return (
                <div className="space-y-8 animate-[slideIn_0.3s_ease-out]">
                    <div className="flex justify-between items-center border-b pb-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">דאשבורד ותמונת מצב כללית</h2>
                            <p className="text-sm text-gray-500">נתונים בזמן אמת על תפוסת הקורסים והרשמות התלמידים</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        <div className="bg-white/95 p-6 rounded-2xl shadow-md border border-gray-100 flex items-center justify-between card-lift">
                            <div>
                                <p className="text-gray-500 text-xs font-semibold uppercase">סה"כ נרשמים</p>
                                <p className="text-3xl font-extrabold text-indigo-600 mt-1">{totalStudents}</p>
                                <p className="text-xs text-gray-400 mt-1">תלמידים שהשלימו הרשמה</p>
                            </div>
                            <div className="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 text-2xl">👥</div>
                        </div>

                        <div className="bg-white/95 p-6 rounded-2xl shadow-md border border-gray-100 flex items-center justify-between card-lift">
                            <div>
                                <p className="text-gray-500 text-xs font-semibold uppercase">קורסים פעילים</p>
                                <p className="text-3xl font-extrabold text-emerald-600 mt-1">{totalCourses}</p>
                                <p className="text-xs text-gray-400 mt-1">בכלל השכבות והמחציות</p>
                            </div>
                            <div className="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 text-2xl">📚</div>
                        </div>

                        <div className="bg-white/95 p-6 rounded-2xl shadow-md border border-gray-100 flex items-center justify-between card-lift">
                            <div>
                                <p className="text-gray-500 text-xs font-semibold uppercase">קיבולת מקומות כוללת</p>
                                <p className="text-3xl font-extrabold text-amber-600 mt-1">{totalCapacity}</p>
                                <p className="text-xs text-gray-400 mt-1">מושבים זמינים במערכת</p>
                            </div>
                            <div className="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center text-amber-600 text-2xl">🪑</div>
                        </div>

                        <div className="bg-white/95 p-6 rounded-2xl shadow-md border border-gray-100 flex items-center justify-between card-lift">
                            <div>
                                <p className="text-gray-500 text-xs font-semibold uppercase">אחוז תפוסה כללי</p>
                                <p className="text-3xl font-extrabold text-purple-600 mt-1">{overallFillRate}%</p>
                                <p className="text-xs text-gray-400 mt-1">מתוך כלל המקומות</p>
                            </div>
                            <div className="w-12 h-12 bg-purple-50 rounded-2xl flex items-center justify-center text-purple-600 text-2xl">📊</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                            <h3 className="font-bold text-gray-800 text-lg mb-4 flex items-center gap-2">
                                <span>⭕</span> התפלגות הנרשמים לפי שכבות
                            </h3>
                            {totalStudents === 0 ? (
                                <div className="text-center py-12 text-gray-400">אין עדיין נרשמים להצגת תרשים</div>
                            ) : (
                                <div className="flex flex-col sm:flex-row items-center justify-around gap-6 py-4">
                                    <div className="relative w-48 h-48">
                                        <svg viewBox="0 0 42 42" className="w-full h-full rounded-full transform -rotate-90">
                                            <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#E5E7EB" strokeWidth="5"></circle>
                                            {donutSlices.map((slice, i) => (
                                                <circle
                                                    key={i}
                                                    cx="21"
                                                    cy="21"
                                                    r="15.91549430918954"
                                                    fill="transparent"
                                                    stroke={slice.color}
                                                    strokeWidth="5"
                                                    strokeDasharray={slice.strokeDasharray}
                                                    strokeDashoffset={slice.strokeDashoffset}
                                                    className="transition-all duration-500 hover:opacity-80 cursor-pointer"
                                                ></circle>
                                            ))}
                                        </svg>
                                        <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
                                            <span className="text-2xl font-bold text-gray-800">{totalStudents}</span>
                                            <span className="text-xs text-gray-500">נרשמים</span>
                                        </div>
                                    </div>

                                    <div className="space-y-3 w-full sm:w-auto">
                                        {donutSlices.map((slice, i) => (
                                            <div key={i} className="flex items-center justify-between sm:justify-start gap-3">
                                                <div className="flex items-center gap-2">
                                                    <span className="w-3.5 h-3.5 rounded-full inline-block" style={{ backgroundColor: slice.color }}></span>
                                                    <span className="text-sm font-medium text-gray-700">{slice.name}</span>
                                                </div>
                                                <span className="text-sm font-bold text-gray-900">{slice.studentsCount} ({slice.percent}%)</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                            <h3 className="font-bold text-gray-800 text-lg mb-4 flex items-center gap-2">
                                <span>📈</span> כמות קורסים ואחוז תפוסה לפי שכבה
                            </h3>
                            {gradeStats.length === 0 ? (
                                <div className="text-center py-12 text-gray-400">אין שכבות להצגה</div>
                            ) : (
                                <div className="space-y-5 my-auto">
                                    {gradeStats.map((g, i) => (
                                        <div key={g.id} className="space-y-1">
                                            <div className="flex justify-between text-sm font-medium">
                                                <span className="text-gray-800">{g.name} ({g.coursesCount} קורסים)</span>
                                                <span className="text-indigo-600 font-bold">{g.fillRate}% תפוסה</span>
                                            </div>
                                            <div className="w-full bg-gray-100 h-4 rounded-full overflow-hidden flex">
                                                <div
                                                    className="h-full bg-gradient-to-r from-indigo-500 to-indigo-600 rounded-full transition-all duration-700"
                                                    style={{ width: `${g.fillRate}%` }}
                                                ></div>
                                            </div>
                                            <div className="flex justify-between text-xs text-gray-400">
                                                <span>{g.studentsCount} תלמידים נרשמו</span>
                                                <span>קיבולת: {g.capacity} מקומות</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden card-lift">
                        <div className="p-5 border-b bg-gray-50 flex justify-between items-center">
                            <h3 className="font-bold text-gray-800 text-lg">פירוט תפוסה ומדדים לפי שכבות לימוד</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right border-collapse">
                                <thead>
                                    <tr className="bg-gray-100/70 text-gray-600 text-xs uppercase">
                                        <th className="p-4">שם השכבה</th>
                                        <th className="p-4 text-center">כמות קורסים</th>
                                        <th className="p-4 text-center">מספר תלמידים</th>
                                        <th className="p-4 text-center">קיבולת מקומות</th>
                                        <th className="p-4 text-center">אחוז ניצולת תפוסה</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {gradeStats.map(g => (
                                        <tr key={g.id} className="hover:bg-gray-50">
                                            <td className="p-4 font-bold text-gray-800">{g.name}</td>
                                            <td className="p-4 text-center text-gray-600">{g.coursesCount}</td>
                                            <td className="p-4 text-center text-indigo-600 font-semibold">{g.studentsCount}</td>
                                            <td className="p-4 text-center text-gray-600">{g.capacity}</td>
                                            <td className="p-4">
                                                <div className="flex items-center gap-3 max-w-xs mx-auto">
                                                    <div className="flex-1 bg-gray-200 h-2.5 rounded-full overflow-hidden">
                                                        <div 
                                                            className={`h-full rounded-full ${g.fillRate > 85 ? 'bg-red-500' : g.fillRate > 50 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                                                            style={{ width: `${g.fillRate}%` }}
                                                        ></div>
                                                    </div>
                                                    <span className="text-xs font-bold w-10 text-left">{g.fillRate}%</span>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <span>🔥</span> הקורסים המבוקשים ביותר
                            </h3>
                            <div className="space-y-3">
                                {highDemandCourses.length === 0 ? (
                                    <p className="text-gray-400 text-sm">טרם נוצרו קורסים במערכת</p>
                                ) : (
                                    highDemandCourses.map(c => {
                                        const reg = c.registeredCount || 0;
                                        const percent = c.capacity > 0 ? Math.round((reg / c.capacity) * 100) : 0;
                                        return (
                                            <div key={c.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl">
                                                <div>
                                                    <p className="font-bold text-gray-800 text-sm">{c.name}</p>
                                                    <p className="text-xs text-gray-500">מחצית {c.semester} • {c.track}</p>
                                                </div>
                                                <div className="text-left">
                                                    <span className="text-xs font-bold text-indigo-600 px-2.5 py-1 bg-indigo-50 rounded-lg">
                                                        {reg} / {c.capacity} ({percent}%)
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <span>⚠️</span> קורסים בתפוסה מלאה / כמעט מלאה
                            </h3>
                            <div className="space-y-3">
                                {fullCourses.length === 0 ? (
                                    <p className="text-gray-500 text-sm bg-green-50 p-4 rounded-xl border border-green-100 text-green-700">
                                        ✓ אין קורסים שהגיעו לקיבולת מלאה כרגע.
                                    </p>
                                ) : (
                                    fullCourses.map(c => (
                                        <div key={c.id} className="flex justify-between items-center p-3 bg-red-50 rounded-xl border border-red-100">
                                            <div>
                                                <p className="font-bold text-red-900 text-sm">{c.name}</p>
                                                <p className="text-xs text-red-600">מחצית {c.semester} • {c.track}</p>
                                            </div>
                                            <span className="text-xs font-bold bg-red-600 text-white px-3 py-1 rounded-full">
                                                מלא ({c.registeredCount}/{c.capacity})
                                            </span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminGrades = ({ grades, db, campusId, campuses }) => {
            const [newGradeName, setNewGradeName] = useState("");
            const [editingGradeId, setEditingGradeId] = useState(null);
            const [editingGradeName, setEditingGradeName] = useState("");
            const [deletingId, setDeletingId] = useState(null);

            const currentCampus = campuses.find(c => c.id === campusId);
            const canEdit = campusId && campusId !== 'all';

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!canEdit || !newGradeName.trim()) return;
                await db.addGrade(newGradeName.trim(), campusId);
                setNewGradeName("");
            };

            const handleSaveEdit = async (id) => {
                if (!editingGradeName.trim()) return;
                await db.updateGrade(id, editingGradeName.trim(), campusId === 'all' ? null : campusId);
                setEditingGradeId(null);
                setEditingGradeName("");
            };

            const handleDelete = async (id) => {
                await db.deleteGrade(id);
                setDeletingId(null);
            };

            return (
                <div className="space-y-6 animate-[slideIn_0.3s_ease-out] max-w-4xl">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">ניהול שכבות לימוד</h2>
                        <p className="text-sm text-gray-500">
                            {campusId === 'all'
                                ? 'תצוגה כוללת בלבד. כדי להוסיף שכבה יש לבחור קמפוס מסוים.'
                                : `השכבות במסך זה שייכות רק ל${currentCampus?.name || 'קמפוס שנבחר'}.`}
                        </p>
                    </div>

                    {canEdit ? (
                        <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl">
                            <div className="font-bold text-indigo-900">📍 {currentCampus?.name || 'קמפוס'}</div>
                            <div className="text-sm text-indigo-700 mt-1">כל שכבה שתתווסף כאן תהיה זמינה רק בקמפוס זה.</div>
                        </div>
                    ) : (
                        <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl text-amber-900">
                            כדי להוסיף, לערוך או למחוק שכבות בצורה בטוחה, לחץ על „החלף קמפוס” ובחר קמפוס מסוים.
                        </div>
                    )}

                    {canEdit && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-gray-800 mb-4">הוספת שכבה חדשה ל{currentCampus?.name}</h3>
                            <form onSubmit={handleAdd} className="flex flex-col sm:flex-row gap-3">
                                <input
                                    type="text"
                                    placeholder="שם השכבה (למשל: כיתות ג'-ה')"
                                    className="flex-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                                    value={newGradeName}
                                    onChange={e => setNewGradeName(e.target.value)}
                                />
                                <button type="submit" className="bg-gradient-to-l from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-md">
                                    הוסף שכבה
                                </button>
                            </form>
                        </div>
                    )}

                    <div className="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden card-lift">
                        <div className="p-4 border-b bg-gray-50 font-bold text-gray-700">
                            {campusId === 'all' ? 'כל השכבות מכל הקמפוסים' : `שכבות ${currentCampus?.name || ''}`}
                        </div>
                        <div className="divide-y">
                            {grades.length === 0 ? (
                                <div className="p-8 text-center text-gray-400">אין שכבות מוגדרות בקמפוס זה.</div>
                            ) : (
                                grades.map(g => {
                                    const gradeCampus = campuses.find(c => c.id === (g.campusId || 'campus1'));
                                    return (
                                    <div key={g.id} className="p-4 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 hover:bg-gray-50">
                                        <div>
                                            {editingGradeId === g.id ? (
                                                <div className="flex-1 flex gap-2">
                                                    <input
                                                        type="text"
                                                        className="p-2 border rounded-xl flex-1 outline-none focus:ring-2 focus:ring-indigo-500"
                                                        value={editingGradeName}
                                                        onChange={e => setEditingGradeName(e.target.value)}
                                                    />
                                                    <button onClick={() => handleSaveEdit(g.id)} className="bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold">שמור</button>
                                                    <button onClick={() => setEditingGradeId(null)} className="bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm">ביטול</button>
                                                </div>
                                            ) : (
                                                <>
                                                    <span className="font-bold text-gray-800 text-lg">{g.name}</span>
                                                    {campusId === 'all' && <div className="text-xs text-gray-500 mt-1">{gradeCampus?.name || 'קמפוס תל-חי'}</div>}
                                                </>
                                            )}
                                        </div>

                                        {canEdit && (
                                            deletingId === g.id ? (
                                                <div className="flex items-center gap-2 bg-red-50 p-2 rounded-xl border border-red-200">
                                                    <span className="text-xs text-red-700 font-bold">למחוק שכבה זו?</span>
                                                    <button onClick={() => handleDelete(g.id)} className="bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">אישור</button>
                                                    <button onClick={() => setDeletingId(null)} className="bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded-lg">ביטול</button>
                                                </div>
                                            ) : editingGradeId !== g.id && (
                                                <div className="flex gap-2">
                                                    <button onClick={() => { setEditingGradeId(g.id); setEditingGradeName(g.name); }} className="px-3 py-1.5 text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg">
                                                        ערוך
                                                    </button>
                                                    <button onClick={() => setDeletingId(g.id)} className="px-3 py-1.5 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg">
                                                        מחק
                                                    </button>
                                                </div>
                                            )
                                        )}
                                    </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminCourses = ({ grades, courses, students, db, campusId, campuses }) => {
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [editingCourseId, setEditingCourseId] = useState(null);
            const [filterGrade, setFilterGrade] = useState("all");
            const [deletingId, setDeletingId] = useState(null);

            const initialFormState = {
                name: "",
                description: "",
                teacherName: "",
                gradeId: grades[0]?.id || "",
                semester: "א",
                track: "שעה ראשונה",
                capacity: 20,
                registeredCount: 0,
                campusId: campusId === 'all' ? (campuses.find(c => c.active !== false)?.id || 'campus1') : campusId
            };

            const [formData, setFormData] = useState(initialFormState);

            const handleOpenAdd = () => {
                setEditingCourseId(null);
                setFormData({
                    ...initialFormState,
                    gradeId: grades[0]?.id || ""
                });
                setIsFormOpen(true);
            };

            const handleOpenEdit = (course) => {
                setEditingCourseId(course.id);
                setFormData({
                    name: course.name || "",
                    description: course.description || "",
                    teacherName: course.teacherName || "",
                    gradeId: course.gradeId || grades[0]?.id || "",
                    semester: course.semester || "א",
                    track: course.track || "שעה ראשונה",
                    capacity: course.capacity || 20,
                    registeredCount: course.registeredCount || 0,
                    campusId: course.campusId || 'campus1'
                });
                setIsFormOpen(true);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.name.trim()) return;

                const coursePayload = {
                    ...formData,
                    capacity: Number(formData.capacity) || 0
                };

                if (editingCourseId) {
                    coursePayload.id = editingCourseId;
                }

                await db.saveCourse(coursePayload);
                setIsFormOpen(false);
            };

            const handleDelete = async (id) => {
                await db.deleteCourse(id);
                setDeletingId(null);
            };

            const exportAllCoursesWorkbook = () => {
                if (typeof XLSX === 'undefined') {
                    alert('ספריית Excel טרם נטענה');
                    return;
                }

                if (!courses.length) {
                    alert('אין קורסים לייצוא בקמפוס שנבחר.');
                    return;
                }

                const wb = XLSX.utils.book_new();
                const usedSheetNames = new Set();

                const safeSheetName = (name) => {
                    let base = String(name || 'קורס')
                        .replace(/[\\\/\?\*\[\]\:]/g, ' ')
                        .replace(/\s+/g, ' ')
                        .trim()
                        .slice(0, 31) || 'קורס';

                    let candidate = base;
                    let counter = 2;
                    while (usedSheetNames.has(candidate)) {
                        const suffix = ` ${counter}`;
                        candidate = (base.slice(0, 31 - suffix.length) + suffix).trim();
                        counter++;
                    }
                    usedSheetNames.add(candidate);
                    return candidate;
                };

                const primaryKeys = [
                    'semA_1_opt1',
                    'semA_2_opt1',
                    'semB_1_opt1',
                    'semB_2_opt1'
                ];

                const waitKeys = [
                    'semA_1_waitlist',
                    'semA_2_waitlist',
                    'semB_1_waitlist',
                    'semB_2_waitlist'
                ];

                const getRegisteredForCourse = (courseId) => {
                    return students
                        .filter(student => primaryKeys.some(key => student[key] === courseId))
                        .sort((a, b) => {
                            const last = String(a.lastName || '').localeCompare(String(b.lastName || ''), 'he', { sensitivity: 'base' });
                            if (last !== 0) return last;
                            return String(a.firstName || '').localeCompare(String(b.firstName || ''), 'he', { sensitivity: 'base' });
                        });
                };

                const getWaitCount = (courseId) =>
                    students.filter(student => waitKeys.some(key => student[key] === courseId)).length;

                const summaryData = courses.map((course, index) => {
                    const registered = getRegisteredForCourse(course.id);
                    const capacity = Number(course.capacity || 0);
                    return {
                        '#': index + 1,
                        'שם הקורס': course.name || '',
                        'מורה': course.teacherName || '',
                        'שכבה': getGradeName(course.gradeId),
                        'מחצית': `מחצית ${course.semester || ''}`,
                        'שעה / רצועה': course.track || '',
                        'רשומים': registered.length,
                        'קיבולת': capacity,
                        'מקומות פנויים': Math.max(0, capacity - registered.length),
                        'רשימת המתנה': getWaitCount(course.id)
                    };
                });

                const summaryWs = XLSX.utils.json_to_sheet(summaryData);
                summaryWs['!cols'] = [
                    { wch: 6 }, { wch: 32 }, { wch: 22 }, { wch: 18 }, { wch: 14 },
                    { wch: 18 }, { wch: 10 }, { wch: 10 }, { wch: 14 }, { wch: 14 }
                ];
                XLSX.utils.book_append_sheet(wb, summaryWs, 'סיכום');

                courses.forEach(course => {
                    const registered = getRegisteredForCourse(course.id);
                    const capacity = Number(course.capacity || 0);

                    const rows = [
                        ['שם הקורס', course.name || ''],
                        ['שם המורה', course.teacherName || ''],
                        ['שכבה', getGradeName(course.gradeId)],
                        ['מחצית', `מחצית ${course.semester || ''}`],
                        ['שעה / רצועה', course.track || ''],
                        ['מספר רשומים', registered.length],
                        ['קיבולת', capacity],
                        ['מקומות פנויים', Math.max(0, capacity - registered.length)],
                        [],
                        ['#', 'שם פרטי', 'שם משפחה', 'שכבה', 'דוא״ל הורה', 'תאריך הרשמה', 'קוד הרשמה']
                    ];

                    registered.forEach((student, index) => {
                        rows.push([
                            index + 1,
                            student.firstName || '',
                            student.lastName || '',
                            getGradeName(student.gradeId),
                            student.email || '',
                            student.date || '',
                            student.registrationCode || ''
                        ]);
                    });

                    if (registered.length === 0) {
                        rows.push(['', 'אין תלמידים רשומים לקורס זה']);
                    }

                    const ws = XLSX.utils.aoa_to_sheet(rows);
                    ws['!cols'] = [
                        { wch: 7 },
                        { wch: 18 },
                        { wch: 20 },
                        { wch: 18 },
                        { wch: 30 },
                        { wch: 22 },
                        { wch: 24 }
                    ];

                    const sheetName = safeSheetName(course.name);
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                });

                const currentCampus = campuses.find(c => c.id === campusId);
                const campusName = campusId === 'all' ? 'כל_הקמפוסים' : (currentCampus?.name || 'קמפוס');
                const safeCampus = campusName.replace(/[\\\/:*?"<>|]/g, '_').replace(/\s+/g, '_');
                const date = new Date().toLocaleDateString('he-IL').replaceAll('/', '-');

                XLSX.writeFile(wb, `קורסים_ונרשמים_${safeCampus}_${date}.xlsx`);
            };

            const filteredCourses = courses.filter(c => filterGrade === "all" || c.gradeId === filterGrade);
            const getGradeName = (id) => grades.find(g => g.id === id)?.name || "ללא שכבה";
            const availableFormGrades = grades.filter(g => campusId !== 'all' || (g.campusId || 'campus1') === formData.campusId);

            return (
                <div className="space-y-6 fade-up">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">ניהול קורסים</h2>
                            <p className="text-sm text-gray-500">הוספה, עריכה וניהול קיבולת קורסים במערכת</p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button
                                onClick={exportAllCoursesWorkbook}
                                className="bg-gradient-to-l from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold px-5 py-2.5 rounded-xl transition-all shadow-md flex items-center gap-2"
                                title="מפיק קובץ Excel עם גיליון נפרד לכל קורס ורשימת הנרשמים אליו"
                            >
                                📚 Excel – כל הקורסים
                            </button>
                            <button
                                onClick={handleOpenAdd}
                                className="bg-gradient-to-l from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold px-5 py-2.5 rounded-xl transition-all shadow-md flex items-center gap-2"
                            >
                                ➕ הוסף קורס חדש
                            </button>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                        <label className="text-sm font-bold text-gray-700 whitespace-nowrap">סינון לפי שכבה:</label>
                        <select
                            className="p-2 border rounded-xl bg-white text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                            value={filterGrade}
                            onChange={e => setFilterGrade(e.target.value)}
                        >
                            <option value="all">כל השכבות ({courses.length})</option>
                            {availableFormGrades.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                        </select>
                    </div>

                    {isFormOpen && (
                        <div className="bg-white p-6 rounded-2xl shadow-lg border border-indigo-100 space-y-4">
                            <h3 className="text-xl font-bold text-gray-800 border-b pb-3">
                                {editingCourseId ? 'עריכת קורס' : 'הוספת קורס חדש'}
                            </h3>
                            <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium mb-1">שם הקורס *</label>
                                    <input
                                        type="text"
                                        required
                                        className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                                        value={formData.name}
                                        onChange={e => setFormData({ ...formData, name: e.target.value })}
                                    />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium mb-1">תיאור הקורס</label>
                                    <textarea
                                        rows="3"
                                        className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                                        value={formData.description}
                                        onChange={e => setFormData({ ...formData, description: e.target.value })}
                                    ></textarea>
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium mb-1">שם המורה</label>
                                    <input
                                        type="text"
                                        className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                                        value={formData.teacherName || ""}
                                        onChange={e => setFormData({ ...formData, teacherName: e.target.value })}
                                        placeholder="למשל: ד״ר ישראל ישראלי"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">קמפוס *</label>
                                    <select className="w-full p-2.5 border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none" value={formData.campusId || ''} onChange={e => {
                                            const nextCampusId = e.target.value;
                                            const nextGrades = grades.filter(g => (g.campusId || 'campus1') === nextCampusId);
                                            setFormData({ ...formData, campusId: nextCampusId, gradeId: nextGrades[0]?.id || '' });
                                        }}>
                                        {campuses.filter(c => c.active !== false).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">שכבת יעד *</label>
                                    <select
                                        className="w-full p-2.5 border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                        value={formData.gradeId}
                                        onChange={e => setFormData({ ...formData, gradeId: e.target.value })}
                                    >
                                        {grades.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">מחצית *</label>
                                    <select
                                        className="w-full p-2.5 border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                        value={formData.semester}
                                        onChange={e => setFormData({ ...formData, semester: e.target.value })}
                                    >
                                        <option value="א">מחצית א'</option>
                                        <option value="ב">מחצית ב'</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">שעה / רצועה *</label>
                                    <select
                                        className="w-full p-2.5 border rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                        value={formData.track}
                                        onChange={e => setFormData({ ...formData, track: e.target.value })}
                                    >
                                        <option value="שעה ראשונה">שעה ראשונה</option>
                                        <option value="שעה שנייה">שעה שנייה</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">קיבולת מקסימלית (תלמידים)</label>
                                    <input
                                        type="number"
                                        min="1"
                                        className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                                        value={formData.capacity}
                                        onChange={e => setFormData({ ...formData, capacity: e.target.value })}
                                    />
                                </div>
                                <div className="md:col-span-2 flex justify-end gap-3 pt-3 border-t">
                                    <button
                                        type="button"
                                        onClick={() => setIsFormOpen(false)}
                                        className="px-5 py-2.5 rounded-xl border text-gray-600 hover:bg-gray-50"
                                    >
                                        ביטול
                                    </button>
                                    <button
                                        type="submit"
                                        className="px-6 py-2.5 rounded-xl bg-gradient-to-l from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold"
                                    >
                                        שמור קורס
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden card-lift">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm border-collapse">
                                <thead>
                                    <tr className="bg-gray-100 text-gray-700 font-bold border-b">
                                        <th className="p-3">שם הקורס</th>
                                        <th className="p-3">שכבה</th>
                                        <th className="p-3">מורה</th>
                                        <th className="p-3">מחצית</th>
                                        <th className="p-3">שעה / רצועה</th>
                                        <th className="p-3 text-center">רשומים / קיבולת</th>
                                        <th className="p-3 text-center">פעולות</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredCourses.length === 0 ? (
                                        <tr>
                                            <td colSpan="7" className="p-8 text-center text-gray-400">
                                                לא נמצאו קורסים מתאימים.
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredCourses.map(c => {
                                            const registered = Number(c.registeredCount || 0);
                                            const capacity = Number(c.capacity || 0);
                                            const isFull = capacity > 0 && registered >= capacity;

                                            return (
                                                <tr key={c.id} className="border-b last:border-b-0 hover:bg-gray-50">
                                                    <td className="p-3 align-top">
                                                        <div className="font-bold text-gray-900">{c.name}</div>
                                                        {c.description && (
                                                            <div className="text-xs text-gray-500 mt-1 max-w-xs">
                                                                {c.description}
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="p-3 align-top">{getGradeName(c.gradeId)}</td>
                                                    <td className="p-3 align-top">
                                                        {c.teacherName?.trim() ? c.teacherName : <span className="text-gray-300">—</span>}
                                                    </td>
                                                    <td className="p-3 align-top">מחצית {c.semester}</td>
                                                    <td className="p-3 align-top">{c.track}</td>
                                                    <td className="p-3 text-center align-top">
                                                        <span className={`inline-flex min-w-[64px] justify-center px-3 py-1 rounded-full text-xs font-bold ${
                                                            isFull
                                                                ? 'bg-red-100 text-red-700'
                                                                : 'bg-green-100 text-green-700'
                                                        }`}>
                                                            {registered} / {capacity}
                                                        </span>
                                                    </td>
                                                    <td className="p-3 text-center align-top">
                                                        <div className="flex justify-center gap-2">
                                                            <button
                                                                onClick={() => handleOpenEdit(c)}
                                                                className="px-3 py-1.5 text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg"
                                                            >
                                                                ערוך
                                                            </button>
                                                            <button
                                                                onClick={() => setDeletingId(c.id)}
                                                                className="px-3 py-1.5 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg"
                                                            >
                                                                מחק
                                                            </button>
                                                        </div>

                                                        {deletingId === c.id && (
                                                            <div className="mt-2 bg-red-50 border border-red-200 rounded-xl p-2">
                                                                <div className="text-xs font-bold text-red-700 mb-2">למחוק קורס זה?</div>
                                                                <div className="flex justify-center gap-2">
                                                                    <button
                                                                        onClick={() => handleDelete(c.id)}
                                                                        className="bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg"
                                                                    >
                                                                        אישור
                                                                    </button>
                                                                    <button
                                                                        onClick={() => setDeletingId(null)}
                                                                        className="bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded-lg"
                                                                    >
                                                                        ביטול
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminStudents = ({ students, courses, grades, db }) => {
            const [gradeFilter, setGradeFilter] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [sortBy, setSortBy] = useState('lastName');
            const [sortDir, setSortDir] = useState('asc');
            const [deletingId, setDeletingId] = useState(null);
            const [expandedId, setExpandedId] = useState(null);
            const [isDeleting, setIsDeleting] = useState(false);
            const [statusMessage, setStatusMessage] = useState('');

            const getGradeName = (id) => grades.find(g => g.id === id)?.name || '-';
            const getCourseName = (id) => courses.find(c => c.id === id)?.name || '-';

            const filteredStudents = useMemo(() => {
                const term = searchTerm.trim().toLowerCase();
                const searchableCourseIds = ['semA_1_opt1','semA_1_opt2','semA_2_opt1','semA_2_opt2','semB_1_opt1','semB_1_opt2','semB_2_opt1','semB_2_opt2'];

                const getSortValue = (student) => {
                    switch (sortBy) {
                        case 'firstName': return student.firstName || '';
                        case 'grade': return getGradeName(student.gradeId);
                        case 'email': return student.email || '';
                        case 'date': return student.date || '';
                        case 'lastName':
                        default: return `${student.lastName || ''} ${student.firstName || ''}`;
                    }
                };

                return [...students]
                    .filter(s => gradeFilter === 'all' || s.gradeId === gradeFilter)
                    .filter(s => {
                        if (!term) return true;
                        const courseNames = searchableCourseIds.map(key => getCourseName(s[key])).join(' ');
                        const haystack = [
                            s.firstName || '', s.lastName || '', s.email || '', s.date || '',
                            getGradeName(s.gradeId), courseNames
                        ].join(' ').toLowerCase();
                        return haystack.includes(term);
                    })
                    .sort((a, b) => {
                        const comparison = String(getSortValue(a)).localeCompare(String(getSortValue(b)), 'he', { numeric: true, sensitivity: 'base' });
                        return sortDir === 'asc' ? comparison : -comparison;
                    });
            }, [students, gradeFilter, searchTerm, sortBy, sortDir, courses, grades]);

            const exportStudentsExcel = () => {
                if (typeof XLSX === 'undefined') return alert('ספריית Excel טרם נטענה');
                if (filteredStudents.length === 0) return alert('אין תלמידים לייצוא לפי הסינון הנוכחי');

                const data = filteredStudents.map((student, index) => ({
                    'מספר': index + 1,
                    'שם פרטי': student.firstName || '',
                    'שם משפחה': student.lastName || '',
                    'שכבה': getGradeName(student.gradeId),
                    'דוא״ל הורה': student.email || '',
                    'תאריך הרשמה': student.date || '',
                    "מחצית א׳ שעה 1 - אופציה 1": getCourseName(student.semA_1_opt1),
                    "מחצית א׳ שעה 1 - אופציה 2": getCourseName(student.semA_1_opt2),
                    "מחצית א׳ שעה 2 - אופציה 1": getCourseName(student.semA_2_opt1),
                    "מחצית א׳ שעה 2 - אופציה 2": getCourseName(student.semA_2_opt2),
                    "מחצית ב׳ שעה 1 - אופציה 1": getCourseName(student.semB_1_opt1),
                    "מחצית ב׳ שעה 1 - אופציה 2": getCourseName(student.semB_1_opt2),
                    "מחצית ב׳ שעה 2 - אופציה 1": getCourseName(student.semB_2_opt1),
                    "מחצית ב׳ שעה 2 - אופציה 2": getCourseName(student.semB_2_opt2)
                }));

                const ws = XLSX.utils.json_to_sheet(data);
                ws['!cols'] = [
                    { wch: 8 }, { wch: 16 }, { wch: 18 }, { wch: 18 }, { wch: 28 }, { wch: 20 },
                    { wch: 28 }, { wch: 28 }, { wch: 28 }, { wch: 28 },
                    { wch: 28 }, { wch: 28 }, { wch: 28 }, { wch: 28 }
                ];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'תלמידים נרשמים');
                XLSX.writeFile(wb, `תלמידים_נרשמים_${new Date().toLocaleDateString('he-IL').replaceAll('/', '-')}.xlsx`);
            };

            const printStudents = () => {
                if (filteredStudents.length === 0) return alert('אין תלמידים להדפסה לפי הסינון הנוכחי');
                window.print();
            };

            const handleDelete = async (student) => {
                try {
                    setIsDeleting(true);
                    setStatusMessage('');
                    await db.deleteStudent(student);
                    setDeletingId(null);
                    setExpandedId(null);
                    setStatusMessage(`הרישום של ${student.firstName} ${student.lastName} נמחק בהצלחה.`);
                    setTimeout(() => setStatusMessage(''), 3000);
                } catch (err) {
                    console.error(err);
                    setStatusMessage('אירעה שגיאה במחיקת הרישום. נסה שוב.');
                } finally {
                    setIsDeleting(false);
                }
            };

            const renderSelections = (s) => {
                const slots = [
                    ['מחצית א׳ · שעה 1', 'semA_1'],
                    ['מחצית א׳ · שעה 2', 'semA_2'],
                    ['מחצית ב׳ · שעה 1', 'semB_1'],
                    ['מחצית ב׳ · שעה 2', 'semB_2']
                ];
                return (
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3 mt-4">
                        {slots.map(([title, key]) => (
                            <div key={key} className="bg-gray-50 border border-gray-200 rounded-xl p-3">
                                <div className="font-bold text-gray-700 text-sm mb-2">{title}</div>
                                <div className="text-xs text-gray-600 space-y-1">
                                    <div><span className="font-bold text-indigo-600">עדיפות 1:</span> {getCourseName(s[`${key}_opt1`])}</div>
                                    <div><span className="font-bold text-amber-600">עדיפות 2:</span> {getCourseName(s[`${key}_opt2`])}{s[`${key}_waitlist`] === s[`${key}_opt2`] ? ' · רשימת המתנה' : ''}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                );
            };

            return (
                <div className="space-y-6 fade-up">
                    <div className="flex flex-col xl:flex-row justify-between xl:items-end gap-4 no-print">
                        <div>
                            <h2 className="text-3xl font-extrabold tracking-tight text-gray-900">תלמידים נרשמים</h2>
                            <p className="text-sm text-gray-500 mt-1">חיפוש חופשי בזמן אמת, סינון, מיון, הדפסה וייצוא של תלמידים רשומים</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            <div className="bg-indigo-50 border border-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold text-sm">
                                {filteredStudents.length} תלמידים מוצגים מתוך {students.length}
                            </div>
                            <button
                                type="button"
                                onClick={printStudents}
                                className="px-4 py-2 rounded-xl bg-gray-800 text-white font-bold text-sm hover:bg-gray-900"
                            >
                                🖨️ הדפסת הרשימה
                            </button>
                            <button
                                type="button"
                                onClick={exportStudentsExcel}
                                className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700"
                            >
                                📊 ייצוא ל-Excel
                            </button>
                        </div>
                    </div>

                    {statusMessage && (
                        <div className={`p-3 rounded-xl text-sm font-bold border ${statusMessage.includes('שגיאה') ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`}>
                            {statusMessage}
                        </div>
                    )}

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 no-print">
                        <div className="md:col-span-2 xl:col-span-1">
                            <label className="block text-xs font-bold text-gray-500 mb-1">חיפוש חופשי בזמן אמת</label>
                            <input
                                type="text"
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                placeholder="שם, משפחה, מייל, שכבה, תאריך או קורס..."
                                className="w-full p-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                            <div className="text-[11px] text-gray-400 mt-1">התוצאות מתעדכנות מיד בזמן ההקלדה.</div>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">סינון לפי שכבה</label>
                            <select
                                value={gradeFilter}
                                onChange={e => setGradeFilter(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-xl bg-white outline-none focus:ring-2 focus:ring-indigo-500"
                            >
                                <option value="all">כל השכבות ({students.length})</option>
                                {grades.map(g => {
                                    const count = students.filter(s => s.gradeId === g.id).length;
                                    return <option key={g.id} value={g.id}>{g.name} ({count})</option>;
                                })}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">מיון לפי</label>
                            <select
                                value={sortBy}
                                onChange={e => setSortBy(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-xl bg-white outline-none focus:ring-2 focus:ring-indigo-500"
                            >
                                <option value="lastName">שם משפחה</option>
                                <option value="firstName">שם פרטי</option>
                                <option value="grade">שכבה</option>
                                <option value="date">תאריך הרשמה</option>
                                <option value="email">דוא״ל הורה</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">סדר מיון</label>
                            <select
                                value={sortDir}
                                onChange={e => setSortDir(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-xl bg-white outline-none focus:ring-2 focus:ring-indigo-500"
                            >
                                <option value="asc">עולה א׳ → ת׳</option>
                                <option value="desc">יורד ת׳ → א׳</option>
                            </select>
                        </div>
                    </div>

                    <div id="print-area" className="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden card-lift">
                        <div className="hidden print:block p-5 border-b text-center">
                            <h2 className="text-2xl font-bold">מרכז מדע ודעת למצטיינים ומחוננים</h2>
                            <div className="text-lg font-bold mt-1">רשימת תלמידים נרשמים</div>
                            <div className="text-sm text-gray-500 mt-1">סה״כ: {filteredStudents.length} תלמידים · תאריך הפקה: {new Date().toLocaleDateString('he-IL')}</div>
                        </div>

                        <div className="hidden print:block">
                            <table className="w-full text-right border-collapse text-sm">
                                <thead>
                                    <tr className="bg-gray-100">
                                        <th className="p-2 border">#</th>
                                        <th className="p-2 border">שם התלמיד/ה</th>
                                        <th className="p-2 border">שכבה</th>
                                        <th className="p-2 border">דוא״ל הורה</th>
                                        <th className="p-2 border">תאריך הרשמה</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredStudents.map((student, index) => (
                                        <tr key={`print_${student.id}`}>
                                            <td className="p-2 border">{index + 1}</td>
                                            <td className="p-2 border font-bold">{student.firstName} {student.lastName}</td>
                                            <td className="p-2 border">{getGradeName(student.gradeId)}</td>
                                            <td className="p-2 border" dir="ltr">{student.email || '-'}</td>
                                            <td className="p-2 border">{student.date || '-'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        <div className="print:hidden">
                        {filteredStudents.length === 0 ? (
                            <div className="p-12 text-center text-gray-400">לא נמצאו תלמידים התואמים לסינון.</div>
                        ) : (
                            <div className="divide-y divide-gray-100">
                                {filteredStudents.map(student => (
                                    <div key={student.id} className="p-4 md:p-5 hover:bg-gray-50/70 transition-colors">
                                        <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                                            <div className="flex-1 min-w-0">
                                                <div className="flex flex-wrap items-center gap-2 mb-1">
                                                    <h3 className="font-bold text-gray-900 text-lg">{student.firstName} {student.lastName}</h3>
                                                    <span className="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full text-xs font-bold">{getGradeName(student.gradeId)}</span>
                                                </div>
                                                <div className="flex flex-wrap gap-x-5 gap-y-1 text-sm text-gray-500">
                                                    <span>✉️ {student.email || '-'}</span>
                                                    <span>🕒 {student.date || '-'}</span>
                                                </div>
                                            </div>

                                            <div className="flex flex-wrap gap-2">
                                                <button
                                                    onClick={() => setExpandedId(expandedId === student.id ? null : student.id)}
                                                    className="px-4 py-2 rounded-xl text-sm font-bold bg-gray-100 text-gray-700 hover:bg-gray-200"
                                                >
                                                    {expandedId === student.id ? 'הסתר בחירות' : 'הצג בחירות'}
                                                </button>
                                                <button
                                                    onClick={() => setDeletingId(student.id)}
                                                    className="px-4 py-2 rounded-xl text-sm font-bold bg-red-50 text-red-700 hover:bg-red-100 border border-red-100"
                                                >
                                                    מחיקת רישום
                                                </button>
                                            </div>
                                        </div>

                                        {expandedId === student.id && renderSelections(student)}

                                        {deletingId === student.id && (
                                            <div className="mt-4 bg-red-50 border border-red-200 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                                <div>
                                                    <div className="font-bold text-red-800">למחוק את הרישום של {student.firstName} {student.lastName}?</div>
                                                    <div className="text-xs text-red-600 mt-1">הפעולה תמחק את התלמיד ממסד הנתונים ותעדכן גם את מוני התפוסה של הקורסים שבחר.</div>
                                                </div>
                                                <div className="flex gap-2 shrink-0">
                                                    <button onClick={() => setDeletingId(null)} disabled={isDeleting} className="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-bold text-gray-600">ביטול</button>
                                                    <button onClick={() => handleDelete(student)} disabled={isDeleting} className={`px-4 py-2 rounded-lg text-sm font-bold text-white ${isDeleting ? 'bg-red-300 cursor-wait' : 'bg-red-600 hover:bg-red-700'}`}>
                                                        {isDeleting ? 'מוחק...' : 'כן, מחק'}
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminWaitlist = ({ students, courses, grades }) => {
            const [gradeFilter, setGradeFilter] = useState('all');
            const [courseFilter, setCourseFilter] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');

            const getGradeName = (id) => grades.find(g => g.id === id)?.name || '-';
            const getCourseName = (id) => courses.find(c => c.id === id)?.name || '-';

            const slotLabels = {
                semA_1: "מחצית א' · שעה 1",
                semA_2: "מחצית א' · שעה 2",
                semB_1: "מחצית ב' · שעה 1",
                semB_2: "מחצית ב' · שעה 2"
            };

            const waitlistEntries = useMemo(() => {
                const rows = [];
                students.forEach(student => {
                    Object.keys(slotLabels).forEach(slotKey => {
                        const courseId = student[`${slotKey}_waitlist`];
                        if (!courseId) return;
                        rows.push({
                            id: `${student.id}_${slotKey}`,
                            studentId: student.id,
                            firstName: student.firstName,
                            lastName: student.lastName,
                            email: student.email,
                            gradeId: student.gradeId,
                            date: student.date,
                            slotKey,
                            slotLabel: slotLabels[slotKey],
                            courseId,
                            courseName: getCourseName(courseId)
                        });
                    });
                });
                return rows;
            }, [students, courses]);

            const filteredEntries = useMemo(() => {
                const term = searchTerm.trim().toLowerCase();
                return waitlistEntries.filter(entry => {
                    const matchesGrade = gradeFilter === 'all' || entry.gradeId === gradeFilter;
                    const matchesCourse = courseFilter === 'all' || entry.courseId === courseFilter;
                    const haystack = `${entry.firstName || ''} ${entry.lastName || ''} ${entry.email || ''} ${entry.courseName || ''}`.toLowerCase();
                    const matchesSearch = !term || haystack.includes(term);
                    return matchesGrade && matchesCourse && matchesSearch;
                });
            }, [waitlistEntries, gradeFilter, courseFilter, searchTerm]);

            const waitlistCourses = useMemo(() => {
                const ids = [...new Set(waitlistEntries.map(e => e.courseId))];
                return ids.map(id => ({ id, name: getCourseName(id) })).sort((a,b) => a.name.localeCompare(b.name, 'he'));
            }, [waitlistEntries, courses]);

            const exportExcel = () => {
                if (typeof XLSX === 'undefined') return alert('ספריית Excel טרם נטענה');
                const data = filteredEntries.map((entry, index) => ({
                    'מספר': index + 1,
                    'שם פרטי': entry.firstName || '',
                    'שם משפחה': entry.lastName || '',
                    'שכבה': getGradeName(entry.gradeId),
                    'קורס ברשימת המתנה': entry.courseName,
                    'מחצית / שעה': entry.slotLabel,
                    'דוא״ל הורה': entry.email || '',
                    'תאריך הרשמה': entry.date || ''
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'רשימת המתנה');
                XLSX.writeFile(wb, `רשימת_המתנה_${new Date().toLocaleDateString('he-IL').replaceAll('/', '-')}.xlsx`);
            };

            const printWaitlist = () => window.print();

            return (
                <div className="space-y-6 fade-up">
                    <div className="flex flex-col lg:flex-row justify-between lg:items-end gap-4 no-print">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">רשימת המתנה</h2>
                            <p className="text-sm text-gray-500 mt-1">תלמידים שבחרו קורס מלא ונכנסו אוטומטית לרשימת ההמתנה</p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={printWaitlist} className="px-4 py-2 rounded-xl bg-gray-800 text-white font-bold text-sm hover:bg-gray-900">🖨️ הדפסה</button>
                            <button onClick={exportExcel} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700">📊 הפקת XLS</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 no-print">
                        <div className="bg-white border rounded-2xl p-4">
                            <div className="text-xs text-gray-500 font-bold">סה״כ ברשימת המתנה</div>
                            <div className="text-3xl font-extrabold text-amber-600 mt-1">{waitlistEntries.length}</div>
                        </div>
                        <div className="bg-white border rounded-2xl p-4">
                            <div className="text-xs text-gray-500 font-bold">מוצגים לאחר סינון</div>
                            <div className="text-3xl font-extrabold text-indigo-600 mt-1">{filteredEntries.length}</div>
                        </div>
                        <div className="bg-white border rounded-2xl p-4">
                            <div className="text-xs text-gray-500 font-bold">קורסים עם ממתינים</div>
                            <div className="text-3xl font-extrabold text-purple-600 mt-1">{waitlistCourses.length}</div>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl border grid grid-cols-1 md:grid-cols-3 gap-4 no-print">
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">חיפוש</label>
                            <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="שם תלמיד, מייל או קורס..." className="w-full p-3 border rounded-xl" />
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">סינון לפי שכבה</label>
                            <select value={gradeFilter} onChange={e => setGradeFilter(e.target.value)} className="w-full p-3 border rounded-xl bg-white">
                                <option value="all">כל השכבות</option>
                                {grades.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">סינון לפי קורס</label>
                            <select value={courseFilter} onChange={e => setCourseFilter(e.target.value)} className="w-full p-3 border rounded-xl bg-white">
                                <option value="all">כל הקורסים</option>
                                {waitlistCourses.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                        </div>
                    </div>

                    <div id="print-area" className="bg-white rounded-2xl border overflow-hidden">
                        <div className="p-5 border-b text-center hidden print:block">
                            <h2 className="text-2xl font-bold">מרכז מדע ודעת למצטיינים ומחוננים תל-חי</h2>
                            <div className="text-lg font-bold mt-1">רשימת המתנה לקורסים</div>
                            <div className="text-sm text-gray-500">תאריך הפקה: {new Date().toLocaleDateString('he-IL')}</div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right border-collapse">
                                <thead>
                                    <tr className="bg-gray-100 text-gray-700 text-sm">
                                        <th className="p-3 border-b">#</th>
                                        <th className="p-3 border-b">תלמיד/ה</th>
                                        <th className="p-3 border-b">שכבה</th>
                                        <th className="p-3 border-b">קורס</th>
