                                    <tr className="bg-gray-100 text-gray-700 font-bold border-b">
                                        <th className="p-3">שם הקורס</th>
                                        <th className="p-3">שכבה</th>
                                        <th className="p-3">מחצית</th>
                                        <th className="p-3">שעה</th>
                                        <th className="p-3 text-center">רשומים / קיבולת</th>
                                        <th className="p-3 text-center">פעולות</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredCourses.length === 0 ? (
                                        <tr><td colSpan="6" className="p-8 text-center text-gray-400">לא נמצאו קורסים מתאימים.</td></tr>
                                    ) : (
                                        filteredCourses.map(c => (
                                            <tr key={c.id} className="hover:bg-gray-50 border-b">
                                                <td className="p-3">
                                                    <p className="font-bold text-gray-800">{c.name}</p>
                                                    <p className="text-xs text-gray-500 truncate max-w-xs">{c.description}</p>
                                                </td>
                                                <td className="p-3 text-gray-600">{getGradeName(c.gradeId)}</td>
                                                <td className="p-3 text-gray-600">מחצית {c.semester}</td>
                                                <td className="p-3 text-gray-600">{c.track}</td>
                                                <td className="p-3 text-center">
                                                    <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${(c.registeredCount || 0) >= c.capacity ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                        {c.registeredCount || 0} / {c.capacity}
                                                    </span>
                                                </td>
                                                <td className="p-3 text-center">
                                                    {deletingId === c.id ? (
                                                        <div className="flex items-center justify-center gap-2">
                                                            <span className="text-xs text-red-700 font-bold">למחוק?</span>
                                                            <button onClick={() => handleDelete(c.id)} className="bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded">אישור</button>
                                                            <button onClick={() => setDeletingId(null)} className="bg-gray-200 text-gray-700 text-xs px-2.5 py-1 rounded">ביטול</button>
                                                        </div>
                                                    ) : (
                                                        <div className="flex justify-center gap-2">
                                                            <button
                                                                onClick={() => handleOpenEdit(c)}
                                                                className="px-3 py-1 text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg"
                                                            >
                                                                ערוך
                                                            </button>
                                                            <button
                                                                onClick={() => setDeletingId(c.id)}
                                                                className="px-3 py-1 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg"
                                                            >
                                                                מחק
                                                            </button>
                                                        </div>
                                                    )}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminStudents = ({ students, courses, grades, db }) => {
            const [gradeFilter, setGradeFilter] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [deletingId, setDeletingId] = useState(null);
            const [expandedId, setExpandedId] = useState(null);
            const [isDeleting, setIsDeleting] = useState(false);
            const [statusMessage, setStatusMessage] = useState('');

            const getGradeName = (id) => grades.find(g => g.id === id)?.name || '-';
            const getCourseName = (id) => courses.find(c => c.id === id)?.name || '-';

            const filteredStudents = useMemo(() => {
                const term = searchTerm.trim().toLowerCase();
                return [...students]
                    .filter(s => gradeFilter === 'all' || s.gradeId === gradeFilter)
                    .filter(s => {
                        if (!term) return true;
                        return `${s.firstName || ''} ${s.lastName || ''} ${s.email || ''}`.toLowerCase().includes(term);
                    })
                    .sort((a, b) => `${a.lastName || ''} ${a.firstName || ''}`.localeCompare(`${b.lastName || ''} ${b.firstName || ''}`, 'he'));
            }, [students, gradeFilter, searchTerm]);

            const handleDelete = async (student) => {
                try {
                    setIsDeleting(true);
                    setStatusMessage('');
                    await db.deleteStudent(student);
                    setDeletingId(null);
                    setExpandedId(null);
                    setStatusMessage(`הרישום של ${student.firstName} ${student.lastName} נמחק בהצלחה.`);
                    setTimeout(() => setStatusMessage(''), 3000);
                } catch (err) {
                    console.error(err);
                    setStatusMessage('אירעה שגיאה במחיקת הרישום. נסה שוב.');
                } finally {
                    setIsDeleting(false);
                }
            };

            const renderSelections = (s) => {
                const slots = [
                    ['מחצית א׳ · שעה 1', 'semA_1'],
                    ['מחצית א׳ · שעה 2', 'semA_2'],
                    ['מחצית ב׳ · שעה 1', 'semB_1'],
                    ['מחצית ב׳ · שעה 2', 'semB_2']
                ];
                return (
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3 mt-4">
                        {slots.map(([title, key]) => (
                            <div key={key} className="bg-gray-50 border border-gray-200 rounded-xl p-3">
                                <div className="font-bold text-gray-700 text-sm mb-2">{title}</div>
                                <div className="text-xs text-gray-600 space-y-1">
                                    <div><span className="font-bold text-indigo-600">עדיפות 1:</span> {getCourseName(s[`${key}_opt1`])}</div>
                                    <div><span className="font-bold text-amber-600">עדיפות 2:</span> {getCourseName(s[`${key}_opt2`])}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                );
            };

            return (
                <div className="space-y-6 animate-[slideIn_0.3s_ease-out]">
                    <div className="flex flex-col lg:flex-row justify-between lg:items-end gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">תלמידים נרשמים</h2>
                            <p className="text-sm text-gray-500 mt-1">צפייה, חיפוש, מיון לפי שכבה ומחיקת רישומים קיימים</p>
                        </div>
                        <div className="bg-indigo-50 border border-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold text-sm">
                            {filteredStudents.length} תלמידים מוצגים מתוך {students.length}
                        </div>
                    </div>

                    {statusMessage && (
                        <div className={`p-3 rounded-xl text-sm font-bold border ${statusMessage.includes('שגיאה') ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`}>
                            {statusMessage}
                        </div>
                    )}

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">חיפוש תלמיד</label>
                            <input
                                type="text"
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                placeholder="שם פרטי, שם משפחה או דוא״ל..."
                                className="w-full p-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-500 mb-1">סינון לפי שכבה</label>
                            <select
                                value={gradeFilter}
                                onChange={e => setGradeFilter(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-xl bg-white outline-none focus:ring-2 focus:ring-indigo-500"
                            >
                                <option value="all">כל השכבות ({students.length})</option>
                                {grades.map(g => {
                                    const count = students.filter(s => s.gradeId === g.id).length;
                                    return <option key={g.id} value={g.id}>{g.name} ({count})</option>;
                                })}
                            </select>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        {filteredStudents.length === 0 ? (
                            <div className="p-12 text-center text-gray-400">לא נמצאו תלמידים התואמים לסינון.</div>
                        ) : (
                            <div className="divide-y divide-gray-100">
                                {filteredStudents.map(student => (
                                    <div key={student.id} className="p-4 md:p-5 hover:bg-gray-50/70 transition-colors">
                                        <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                                            <div className="flex-1 min-w-0">
                                                <div className="flex flex-wrap items-center gap-2 mb-1">
                                                    <h3 className="font-bold text-gray-900 text-lg">{student.firstName} {student.lastName}</h3>
                                                    <span className="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full text-xs font-bold">{getGradeName(student.gradeId)}</span>
                                                </div>
                                                <div className="flex flex-wrap gap-x-5 gap-y-1 text-sm text-gray-500">
                                                    <span>✉️ {student.email || '-'}</span>
                                                    <span>🕒 {student.date || '-'}</span>
                                                </div>
                                            </div>

                                            <div className="flex flex-wrap gap-2">
                                                <button
                                                    onClick={() => setExpandedId(expandedId === student.id ? null : student.id)}
                                                    className="px-4 py-2 rounded-xl text-sm font-bold bg-gray-100 text-gray-700 hover:bg-gray-200"
                                                >
                                                    {expandedId === student.id ? 'הסתר בחירות' : 'הצג בחירות'}
                                                </button>
                                                <button
                                                    onClick={() => setDeletingId(student.id)}
                                                    className="px-4 py-2 rounded-xl text-sm font-bold bg-red-50 text-red-700 hover:bg-red-100 border border-red-100"
                                                >
                                                    מחיקת רישום
                                                </button>
                                            </div>
                                        </div>

                                        {expandedId === student.id && renderSelections(student)}

                                        {deletingId === student.id && (
                                            <div className="mt-4 bg-red-50 border border-red-200 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                                <div>
                                                    <div className="font-bold text-red-800">למחוק את הרישום של {student.firstName} {student.lastName}?</div>
                                                    <div className="text-xs text-red-600 mt-1">הפעולה תמחק את התלמיד ממסד הנתונים ותעדכן גם את מוני התפוסה של הקורסים שבחר.</div>
                                                </div>
                                                <div className="flex gap-2 shrink-0">
                                                    <button onClick={() => setDeletingId(null)} disabled={isDeleting} className="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-bold text-gray-600">ביטול</button>
                                                    <button onClick={() => handleDelete(student)} disabled={isDeleting} className={`px-4 py-2 rounded-lg text-sm font-bold text-white ${isDeleting ? 'bg-red-300 cursor-wait' : 'bg-red-600 hover:bg-red-700'}`}>
                                                        {isDeleting ? 'מוחק...' : 'כן, מחק'}
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AdminReports = ({ students, courses, grades, settings }) => {
            const [reportType, setReportType] = useState("all");
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedGradeFilter, setSelectedGradeFilter] = useState("all");
            const [selectedCourseId, setSelectedCourseId] = useState(courses[0]?.id || "");
            const [showOpt2, setShowOpt2] = useState(true);

            const filteredStudents = useMemo(() => {
                return students.filter(s => {
                    const matchesGrade = selectedGradeFilter === "all" || s.gradeId === selectedGradeFilter;
                    const matchesSearch = !searchTerm || 
                        `${s.firstName} ${s.lastName}`.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (s.email && s.email.toLowerCase().includes(searchTerm.toLowerCase()));
                    return matchesGrade && matchesSearch;
                });
            }, [students, selectedGradeFilter, searchTerm]);

            const getCourseName = (id) => courses.find(c => c.id === id)?.name || "-";
            const getGradeName = (id) => grades.find(g => g.id === id)?.name || "-";

            const selectedCourse = courses.find(c => c.id === selectedCourseId);
            const courseRoster = useMemo(() => {
                if (!selectedCourseId) return [];
                const result = [];
                students.forEach(s => {
                    const isOpt1 = [s.semA_1_opt1, s.semA_2_opt1, s.semB_1_opt1, s.semB_2_opt1].includes(selectedCourseId);
                    const isOpt2 = [s.semA_1_opt2, s.semA_2_opt2, s.semB_1_opt2, s.semB_2_opt2].includes(selectedCourseId);
                    if (isOpt1 || isOpt2) {
                        result.push({
                            student: s,
                            priority: isOpt1 ? 1 : 2
                        });
                    }
                });
                return result;
            }, [selectedCourseId, students]);

            const exportToExcel = () => {
                if (typeof XLSX === 'undefined') return alert("ספריית Excel טרם נטענה");
                let exportData = [];
                let fileName = "דוח_מערכת";

                if (reportType === "all") {
                    fileName = "דוח_נרשמים_כולל";
                    exportData = filteredStudents.map(s => ({
                        "תאריך הרשמה": s.date || "",
                        "שם פרטי": s.firstName,
                        "שם משפחה": s.lastName,
                        "דוא\"ל הורה": s.email,
                        "שכבה": getGradeName(s.gradeId),
                        "מחצית א - שעה 1 (עדיפות 1)": getCourseName(s.semA_1_opt1),
                        "מחצית א - שעה 1 (עדיפות 2)": getCourseName(s.semA_1_opt2),
                        "מחצית א - שעה 2 (עדיפות 1)": getCourseName(s.semA_2_opt1),
                        "מחצית א - שעה 2 (עדיפות 2)": getCourseName(s.semA_2_opt2),
                        "מחצית ב - שעה 1 (עדיפות 1)": getCourseName(s.semB_1_opt1),
                        "מחצית ב - שעה 1 (עדיפות 2)": getCourseName(s.semB_1_opt2),
                        "מחצית ב - שעה 2 (עדיפות 1)": getCourseName(s.semB_2_opt1),
                        "מחצית ב - שעה 2 (עדיפות 2)": getCourseName(s.semB_2_opt2),
                    }));
                } else if (reportType === "course_roster" && selectedCourse) {
                    fileName = `דף_נוכחות_${selectedCourse.name.replace(/\s+/g, '_')}`;
                    exportData = courseRoster.map(item => ({
                        "שם תלמיד": `${item.student.firstName} ${item.student.lastName}`,
                        "שכבה": getGradeName(item.student.gradeId),
                        "מייל הורה": item.student.email,
                        "עדיפות בחירה": item.priority === 1 ? "עדיפות ראשונה" : "עדיפות שנייה",
                        "תאריך הרשמה": item.student.date || ""
                    }));
                } else if (reportType === "occupancy") {
                    fileName = "דוח_תפוסת_קורסים";
                    exportData = courses.map(c => ({
                        "שם הקורס": c.name,
                        "שכבה": getGradeName(c.gradeId),
                        "מחצית": c.semester,
                        "שעה": c.track,
                        "רשומים": c.registeredCount || 0,
                        "קיבולת": c.capacity,
                        "מקומות פנויים": Math.max(0, c.capacity - (c.registeredCount || 0)),
                        "סטטוס": (c.registeredCount || 0) >= c.capacity ? "מלא" : "פתוח"
                    }));
                }

                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "דוח");
                XLSX.writeFile(wb, `${fileName}_${new Date().toLocaleDateString('he-IL')}.xlsx`);
            };

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="space-y-6 animate-[slideIn_0.3s_ease-out]">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 no-print">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">מרכז דוחות והדפסות</h2>
                            <p className="text-sm text-gray-500">הפקת דוחות מפורטים, רשימות שמות לקורסים וייצוא נתונים</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={exportToExcel} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl transition-all shadow-sm flex items-center gap-2">
                                📊 ייצוא ל-Excel
                            </button>
                            <button onClick={handlePrint} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl transition-all shadow-sm flex items-center gap-2">
                                🖨️ הדפסה
                            </button>
                        </div>
                    </div>

                    <div className="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap gap-2 no-print">
                        <button 
                            onClick={() => setReportType("all")} 
                            className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${reportType === "all" ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                        >
                            📋 דוח נרשמים כולל
                        </button>
                        <button 
                            onClick={() => setReportType("course_roster")} 
                            className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${reportType === "course_roster" ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                        >
                            👨‍🎓 רשימת שמות לפי קורס
                        </button>
                        <button 
                            onClick={() => setReportType("occupancy")} 
                            className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${reportType === "occupancy" ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                        >
                            📊 דוח תפוסת קורסים
                        </button>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 no-print items-center justify-between">
                        {reportType === "all" && (
                            <>
                                <input 
                                    type="text" 
                                    placeholder="חיפוש לפי שם תלמיד או מייל..." 
                                    className="flex-1 p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 w-full"
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                />
                                <select 
                                    className="p-2.5 border rounded-xl bg-white text-sm outline-none focus:ring-2 focus:ring-indigo-500 w-full md:w-64"
                                    value={selectedGradeFilter}
                                    onChange={e => setSelectedGradeFilter(e.target.value)}
                                >
                                    <option value="all">כל השכבות ({students.length})</option>
                                    {grades.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                </select>
                                <label className="flex items-center gap-2 text-sm font-medium text-gray-700 cursor-pointer whitespace-nowrap">
                                    <input 
                                        type="checkbox" 
                                        checked={showOpt2} 
                                        onChange={e => setShowOpt2(e.target.checked)} 
                                        className="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4"
                                    />
                                    הצג עדיפות שנייה
                                </label>
                            </>
                        )}

                        {reportType === "course_roster" && (
                            <div className="flex flex-col sm:flex-row gap-4 w-full">
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">בחר קורס להנפקת רשימת תלמידים:</label>
                                    <select 
                                        className="w-full p-2.5 border rounded-xl bg-white text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none"
                                        value={selectedCourseId}
                                        onChange={e => setSelectedCourseId(e.target.value)}
                                    >
                                        {courses.map(c => (
                                            <option key={c.id} value={c.id}>
                                                {c.name} ({getGradeName(c.gradeId)} • מחצית {c.semester} • {c.track})
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        )}

                        {reportType === "occupancy" && (
                            <div className="flex items-center justify-between w-full">
                                <p className="text-sm font-medium text-gray-600">סיכום תפוסה וקיבולת לכל הקורסים הפעילים במערכת</p>
                                <select 
                                    className="p-2 border rounded-xl bg-white text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                    value={selectedGradeFilter}
                                    onChange={e => setSelectedGradeFilter(e.target.value)}
                                >
                                    <option value="all">כל השכבות</option>
                                    {grades.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                </select>
                            </div>
                        )}
                    </div>

                    <div id="print-area" className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                        <div className="mb-6 border-b pb-4 text-center">
                            <h1 className="text-2xl font-bold text-gray-900">{settings.schoolName || "מרכז מצוינות"}</h1>
                            <p className="text-sm text-gray-600 font-medium">
                                {reportType === "all" && "דוח נרשמים כולל"}
                                {reportType === "course_roster" && selectedCourse && `רשימת תלמידים - קורס: ${selectedCourse.name}`}
                                {reportType === "occupancy" && "דוח סטטוס תפוסת קורסים"}
                            </p>
                            <p className="text-xs text-gray-400 mt-1">תאריך הפקה: {new Date().toLocaleDateString('he-IL')} בשעה {new Date().toLocaleTimeString('he-IL')}</p>
                        </div>

                        {reportType === "all" && (
                            <div className="overflow-x-auto">
                                <table className="w-full text-right text-xs md:text-sm border-collapse">
                                    <thead>
                                        <tr className="bg-gray-100 text-gray-700 font-bold border-b">
                                            <th className="p-2.5 border-b">תלמיד/ה</th>
                                            <th className="p-2.5 border-b">שכבה</th>
                                            <th className="p-2.5 border-b">מייל הורה</th>
                                            <th className="p-2.5 border-b">מחצית א (שעה 1)</th>
                                            <th className="p-2.5 border-b">מחצית א (שעה 2)</th>
                                            <th className="p-2.5 border-b">מחצית ב (שעה 1)</th>
                                            <th className="p-2.5 border-b">מחצית ב (שעה 2)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredStudents.length === 0 ? (
                                            <tr><td colSpan="7" className="p-8 text-center text-gray-500">לא נמצאו נרשמים תואמים.</td></tr>
                                        ) : (
                                            filteredStudents.map(s => (
                                                <tr key={s.id} className="hover:bg-gray-50 border-b">
                                                    <td className="p-2.5 font-bold text-gray-800">{s.firstName} {s.lastName}</td>
                                                    <td className="p-2.5">{getGradeName(s.gradeId)}</td>
                                                    <td className="p-2.5 text-gray-600" dir="ltr">{s.email}</td>
                                                    <td className="p-2.5">
                                                        <div className="text-indigo-700 font-semibold">{getCourseName(s.semA_1_opt1)}</div>
                                                        {showOpt2 && <div className="text-amber-700 text-xs">2: {getCourseName(s.semA_1_opt2)}</div>}
                                                    </td>
                                                    <td className="p-2.5">
                                                        <div className="text-indigo-700 font-semibold">{getCourseName(s.semA_2_opt1)}</div>
                                                        {showOpt2 && <div className="text-amber-700 text-xs">2: {getCourseName(s.semA_2_opt2)}</div>}
                                                    </td>
                                                    <td className="p-2.5">
                                                        <div className="text-emerald-700 font-semibold">{getCourseName(s.semB_1_opt1)}</div>
                                                        {showOpt2 && <div className="text-amber-700 text-xs">2: {getCourseName(s.semB_1_opt2)}</div>}
                                                    </td>
                                                    <td className="p-2.5">
                                                        <div className="text-emerald-700 font-semibold">{getCourseName(s.semB_2_opt1)}</div>
                                                        {showOpt2 && <div className="text-amber-700 text-xs">2: {getCourseName(s.semB_2_opt2)}</div>}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {reportType === "course_roster" && selectedCourse && (
                            <div>
                                <div className="bg-gray-50 p-4 rounded-xl border mb-6 flex flex-wrap justify-between items-center text-sm">
                                    <div>
                                        <p className="font-bold text-gray-800 text-base">{selectedCourse.name}</p>
                                        <p className="text-gray-600">שכבה: {getGradeName(selectedCourse.gradeId)} | מחצית {selectedCourse.semester} | {selectedCourse.track}</p>
                                    </div>
                                    <div className="text-left">
                                        <p className="font-bold text-indigo-600">סה"כ רשומים: {courseRoster.length} תלמידים</p>
                                        <p className="text-xs text-gray-500">קיבולת מקסימלית: {selectedCourse.capacity}</p>
                                    </div>
                                </div>

                                <table className="w-full text-right text-sm border-collapse">
                                    <thead>
                                        <tr className="bg-gray-100 text-gray-700 font-bold border-b">
                                            <th className="p-3 border-b text-center w-12">#</th>
                                            <th className="p-3 border-b">שם התלמיד/ה</th>
                                            <th className="p-3 border-b">שכבה</th>
                                            <th className="p-3 border-b">דוא"ל הורה</th>
                                            <th className="p-3 border-b text-center">עדיפות בחירה</th>
                                            <th className="p-3 border-b text-center no-print">חתימת נוכחות</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {courseRoster.length === 0 ? (
                                            <tr><td colSpan="6" className="p-8 text-center text-gray-500">אף תלמיד לא בחר בקורס זה עדיין.</td></tr>
                                        ) : (
                                            courseRoster.map((item, idx) => (
                                                <tr key={idx} className="hover:bg-gray-50 border-b">
                                                    <td className="p-3 text-center text-gray-400 font-medium">{idx + 1}</td>
                                                    <td className="p-3 font-bold text-gray-800">{item.student.firstName} {item.student.lastName}</td>
                                                    <td className="p-3 text-gray-600">{getGradeName(item.student.gradeId)}</td>
                                                    <td className="p-3 text-gray-600" dir="ltr">{item.student.email}</td>
                                                    <td className="p-3 text-center">
                                                        <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${item.priority === 1 ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-700'}`}>
                                                            {item.priority === 1 ? 'עדיפות 1' : 'עדיפות 2'}
                                                        </span>
                                                    </td>
                                                    <td className="p-3 border-b text-center border-l border-r w-32 no-print"></td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {reportType === "occupancy" && (
                            <div className="overflow-x-auto">
                                <table className="w-full text-right text-sm border-collapse">
                                    <thead>
                                        <tr className="bg-gray-100 text-gray-700 font-bold border-b">
                                            <th className="p-3 border-b">שם הקורס</th>
                                            <th className="p-3 border-b">שכבת יעד</th>
                                            <th className="p-3 border-b">מחצית / שעה</th>
                                            <th className="p-3 border-b text-center">נרשמו</th>
                                            <th className="p-3 border-b text-center">קיבולת</th>
                                            <th className="p-3 border-b text-center">פנוי</th>
                                            <th className="p-3 border-b text-center">סטטוס</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {courses
                                            .filter(c => selectedGradeFilter === "all" || c.gradeId === selectedGradeFilter)
                                            .map(c => {
                                                const reg = c.registeredCount || 0;
                                                const isFull = reg >= c.capacity;
                                                const remaining = Math.max(0, c.capacity - reg);

                                                return (
                                                    <tr key={c.id} className="hover:bg-gray-50 border-b">
                                                        <td className="p-3 font-bold text-gray-800">{c.name}</td>
                                                        <td className="p-3 text-gray-600">{getGradeName(c.gradeId)}</td>
                                                        <td className="p-3 text-gray-600">מחצית {c.semester} - {c.track}</td>
                                                        <td className="p-3 text-center font-bold text-indigo-600">{reg}</td>
                                                        <td className="p-3 text-center text-gray-600">{c.capacity}</td>
                                                        <td className="p-3 text-center font-bold text-emerald-600">{remaining}</td>
                                                        <td className="p-3 text-center">
                                                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${isFull ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                                {isFull ? 'מלא' : 'פתוח'}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AdminSettings = ({ settings, db, adminCreds }) => {
            const [newUsername, setNewUsername] = useState(adminCreds?.username || "admin");
            const [newPassword, setNewPassword] = useState("");
            const [updateMsg, setUpdateMsg] = useState("");

            const handleUpdateCreds = async (e) => {
                e.preventDefault();
                if(!newUsername) return alert("שם משתמש לא יכול להיות ריק");
                if(!newPassword) return alert("יש להזין סיסמה חדשה");
                
                try {
                    const hash = await hashString(newPassword);
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('settings', 'admin'), {
                        username: newUsername,
                        passwordHash: hash
                    });
                    setUpdateMsg("פרטי ההתחברות עודכנו בהצלחה!");
                    setNewPassword("");
                    setTimeout(() => setUpdateMsg(""), 3000);
                } catch(err) {
                    alert("שגיאה בעדכון הפרטים");
                    console.error(err);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm max-w-2xl animate-[slideIn_0.3s_ease-out]">
                        <h2 className="text-xl font-bold text-gray-800 mb-6">הגדרות פתיח וכללי (נשמר במסד נתונים)</h2>
                        <div className="space-y-4">
                            <div><label className="block text-sm font-medium mb-1">שם המוסד</label><input type="text" className="w-full p-3 border rounded-xl" value={settings.schoolName} onChange={e => db.saveSettings({...settings, schoolName: e.target.value})} /></div>
                            <div><label className="block text-sm font-medium mb-1">כותרת פתיחה</label><input type="text" className="w-full p-3 border rounded-xl" value={settings.welcomeTitle} onChange={e => db.saveSettings({...settings, welcomeTitle: e.target.value})} /></div>
                            <div><label className="block text-sm font-medium mb-1">טקסט הודעת פתיחה</label><textarea className="w-full p-3 border rounded-xl h-48" value={settings.welcomeText} onChange={e => db.saveSettings({...settings, welcomeText: e.target.value})}></textarea></div>
                            <div className="pt-4 text-sm text-green-600 font-bold">* ההגדרות נשמרות אוטומטית בענן בעת הקלדה.</div>
                        </div>
                    </div>

                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm max-w-2xl animate-[slideIn_0.3s_ease-out]">
                        <h2 className="text-xl font-bold text-gray-800 mb-6">שינוי פרטי התחברות לניהול</h2>
                        <form onSubmit={handleUpdateCreds} className="space-y-4">
                            {updateMsg && <div className="bg-green-100 text-green-800 p-3 rounded-xl text-sm font-bold">{updateMsg}</div>}
                            <div>
                                <label className="block text-sm font-medium mb-1">שם משתמש לניהול</label>
                                <input type="text" dir="ltr" className="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" value={newUsername} onChange={e => setNewUsername(e.target.value)} required />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">סיסמה חדשה</label>
                                <input type="password" dir="ltr" className="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="הזן סיסמה חדשה" required />
                            </div>
                            <button type="submit" className="bg-gray-900 hover:bg-black text-white px-6 py-3 rounded-xl font-bold shadow-md transition-all">
                                עדכן פרטי התחברות
                            </button>
                            <p className="text-xs text-gray-500">* הסיסמה נשמרת במסד הנתונים באופן מוצפן (SHA-256 Hash) לבטיחות מירבית.</p>
                        </form>
                    </div>
                </div>
            );
        };

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
