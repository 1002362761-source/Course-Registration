                                        <th className="p-3 border-b">מחצית / שעה</th>
                                        <th className="p-3 border-b">דוא״ל הורה</th>
                                        <th className="p-3 border-b">תאריך</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y">
                                    {filteredEntries.length === 0 ? (
                                        <tr><td colSpan="7" className="p-10 text-center text-gray-400">אין תלמידים ברשימת ההמתנה לפי הסינון שנבחר.</td></tr>
                                    ) : filteredEntries.map((entry, index) => (
                                        <tr key={entry.id} className="hover:bg-gray-50">
                                            <td className="p-3 text-gray-500">{index + 1}</td>
                                            <td className="p-3 font-bold text-gray-800">{entry.firstName} {entry.lastName}</td>
                                            <td className="p-3">{getGradeName(entry.gradeId)}</td>
                                            <td className="p-3 font-semibold text-amber-700">{entry.courseName}</td>
                                            <td className="p-3">{entry.slotLabel}</td>
                                            <td className="p-3" dir="ltr">{entry.email || '-'}</td>
                                            <td className="p-3">{entry.date || '-'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };


        const AdminCampuses = ({ campuses, db }) => {
            const [name, setName] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [editingName, setEditingName] = useState('');
            const addCampus = async () => {
                if (!name.trim()) return;
                await db.saveCampus({ name: name.trim(), active: true, registrationOpen: true });
                setName('');
            };
            const saveEdit = async (c) => {
                if (!editingName.trim()) return;
                await db.saveCampus({ id: c.id, name: editingName.trim(), active: c.active !== false, registrationOpen: c.registrationOpen !== false });
                setEditingId(null);
            };
            return (
                <div className="space-y-6 animate-[slideIn_0.3s_ease-out] max-w-4xl">
                    <div><h2 className="text-2xl font-bold text-gray-800">ניהול קמפוסים</h2><p className="text-sm text-gray-500">הוספה ועריכה של הקמפוסים במערכת.</p></div>
                    <div className="bg-white p-5 rounded-2xl border flex flex-col sm:flex-row gap-3">
                        <input value={name} onChange={e => setName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCampus()} placeholder="שם קמפוס חדש" className="flex-1 p-3 border rounded-xl" />
                        <button onClick={addCampus} className="bg-indigo-600 text-white font-bold px-5 py-3 rounded-xl">הוסף קמפוס</button>
                    </div>
                    <div className="bg-white rounded-2xl border divide-y">
                        {campuses.map(c => (
                            <div key={c.id} className="p-4 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                                {editingId === c.id ? <input className="p-2 border rounded-xl flex-1" value={editingName} onChange={e => setEditingName(e.target.value)} /> : <div>
                                    <div className="font-bold text-gray-800">{c.name}</div>
                                    <div className="text-xs text-gray-400">מזהה: {c.id}</div>
                                    <div className={`text-xs font-bold mt-1 ${c.registrationOpen === false ? 'text-red-600' : 'text-green-600'}`}>
                                        {c.registrationOpen === false ? '● ההרשמה סגורה' : '● ההרשמה פתוחה'}
                                    </div>
                                </div>}
                                <div className="flex gap-2">
                                    {editingId === c.id ? <>
                                        <button onClick={() => saveEdit(c)} className="px-3 py-2 bg-green-600 text-white rounded-lg text-sm">שמור</button>
                                        <button onClick={() => setEditingId(null)} className="px-3 py-2 bg-gray-100 rounded-lg text-sm">ביטול</button>
                                    </> : <>
                                        <button onClick={() => { setEditingId(c.id); setEditingName(c.name); }} className="px-3 py-2 bg-indigo-50 text-indigo-700 rounded-lg text-sm">ערוך</button>
                                        <button onClick={() => db.saveCampus({ id: c.id, name: c.name, active: c.active === false, registrationOpen: c.registrationOpen !== false })} className={`px-3 py-2 rounded-lg text-sm ${c.active === false ? 'bg-green-50 text-green-700' : 'bg-amber-50 text-amber-700'}`}>{c.active === false ? 'הפעל' : 'השבת'}</button>
                                        <button
                                            onClick={() => db.saveCampus({ id: c.id, name: c.name, active: c.active !== false, registrationOpen: c.registrationOpen === false })}
                                            className={`px-3 py-2 rounded-lg text-sm font-bold ${c.registrationOpen === false ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}
                                        >
                                            {c.registrationOpen === false ? 'פתח הרשמה' : 'סגור הרשמה'}
                                        </button>
                                    </>}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AdminReports = ({ students, courses, grades, settings, campuses, selectedCampusId }) => {
            const [reportType, setReportType] = useState("summary");
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedGradeFilter, setSelectedGradeFilter] = useState("all");
            const [selectedCourseId, setSelectedCourseId] = useState(courses[0]?.id || "");
            const [selectedStudentId, setSelectedStudentId] = useState(students[0]?.id || "");
            const [showOpt2, setShowOpt2] = useState(true);

            useEffect(() => {
                if (courses.length && !courses.some(c => c.id === selectedCourseId)) setSelectedCourseId(courses[0].id);
                if (!courses.length) setSelectedCourseId("");
            }, [courses]);

            useEffect(() => {
                if (students.length && !students.some(s => s.id === selectedStudentId)) setSelectedStudentId(students[0].id);
                if (!students.length) setSelectedStudentId("");
            }, [students]);

            const getCourseName = (id) => courses.find(c => c.id === id)?.name || "-";
            const getGradeName = (id) => grades.find(g => g.id === id)?.name || "-";
            const currentCampus = campuses?.find(c => c.id === selectedCampusId);
            const campusTitle = selectedCampusId === 'all' ? 'כל הקמפוסים' : (currentCampus?.name || 'קמפוס');

            const primaryKeys = ['semA_1_opt1','semA_2_opt1','semB_1_opt1','semB_2_opt1'];
            const secondaryKeys = ['semA_1_opt2','semA_2_opt2','semB_1_opt2','semB_2_opt2'];
            const waitKeys = ['semA_1_waitlist','semA_2_waitlist','semB_1_waitlist','semB_2_waitlist'];

            const filteredStudents = useMemo(() => students.filter(s => {
                const matchesGrade = selectedGradeFilter === "all" || s.gradeId === selectedGradeFilter;
                const term = searchTerm.trim().toLowerCase();
                const matchesSearch = !term || `${s.firstName || ''} ${s.lastName || ''} ${s.email || ''} ${getGradeName(s.gradeId)}`.toLowerCase().includes(term);
                return matchesGrade && matchesSearch;
            }), [students, selectedGradeFilter, searchTerm, grades]);

            const waitlistEntries = useMemo(() => {
                const labels = {
                    semA_1: "מחצית א׳ · שעה 1", semA_2: "מחצית א׳ · שעה 2",
                    semB_1: "מחצית ב׳ · שעה 1", semB_2: "מחצית ב׳ · שעה 2"
                };
                const rows = [];
                students.forEach(s => Object.keys(labels).forEach(slot => {
                    const courseId = s[`${slot}_waitlist`];
                    if (courseId) rows.push({
                        student: s, courseId, courseName: getCourseName(courseId), slotLabel: labels[slot]
                    });
                }));
                return rows;
            }, [students, courses]);

            const courseStats = useMemo(() => courses.map(c => {
                const primaryCount = students.filter(s => primaryKeys.some(k => s[k] === c.id)).length;
                const waitCount = students.filter(s => waitKeys.some(k => s[k] === c.id)).length;
                const capacity = Number(c.capacity) || 0;
                const free = Math.max(0, capacity - primaryCount);
                const percent = capacity ? Math.round((primaryCount / capacity) * 100) : 0;
                return {...c, primaryCount, waitCount, free, percent, status: capacity && primaryCount >= capacity ? 'מלא' : capacity && percent >= 80 ? 'כמעט מלא' : 'פתוח'};
            }), [courses, students]);

            const selectedCourse = courses.find(c => c.id === selectedCourseId);
            const selectedStudent = students.find(s => s.id === selectedStudentId);

            const courseRoster = useMemo(() => {
                if (!selectedCourseId) return [];
                return students.map(s => {
                    const isPrimary = primaryKeys.some(k => s[k] === selectedCourseId);
                    const isSecondary = secondaryKeys.some(k => s[k] === selectedCourseId);
                    const isWait = waitKeys.some(k => s[k] === selectedCourseId);
                    if (!isPrimary && !isSecondary && !isWait) return null;
                    return {student:s, priority:isPrimary ? 1 : 2, waitlist:isWait};
                }).filter(Boolean);
            }, [selectedCourseId, students]);

            const exceptions = useMemo(() => {
                const rows = [];
                students.forEach(s => {
                    const missing = primaryKeys.filter(k => !s[k]).length;
                    const waits = waitKeys.filter(k => !!s[k]).length;
                    if (missing) rows.push({type:'בחירה חסרה', student:s, detail:`חסרות ${missing} בחירות בעדיפות ראשונה`});
                    if (!s.email) rows.push({type:'מייל חסר', student:s, detail:'לא הוזן דוא״ל הורה'});
                    if (waits > 1) rows.push({type:'מספר רשימות המתנה', student:s, detail:`התלמיד/ה נמצא/ת ב-${waits} רשימות המתנה`});
                });
                courses.filter(c => !students.some(s => primaryKeys.some(k => s[k] === c.id))).forEach(c => rows.push({type:'קורס ללא נרשמים', course:c, detail:c.name}));
                return rows;
            }, [students, courses]);

            const summary = useMemo(() => ({
                students: students.length,
                grades: grades.length,
                courses: courses.length,
                full: courseStats.filter(c => c.status === 'מלא').length,
                waitStudents: new Set(waitlistEntries.map(e => e.student.id)).size,
                waitEntries: waitlistEntries.length,
                freeSeats: courseStats.reduce((sum,c) => sum + c.free, 0),
                avgOccupancy: courseStats.length ? Math.round(courseStats.reduce((sum,c) => sum + Math.min(c.percent,100),0) / courseStats.length) : 0
            }), [students, grades, courses, courseStats, waitlistEntries]);

            const safeFile = (s) => String(s || '').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_');

            const exportWorkbook = () => {
                if (typeof XLSX === 'undefined') return alert("ספריית Excel טרם נטענה");
                const wb = XLSX.utils.book_new();
                const addSheet = (name, data) => {
                    const ws = XLSX.utils.json_to_sheet(data);
                    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
                };

                addSheet('סיכום', [
                    {'מדד':'קמפוס','ערך':campusTitle},
                    {'מדד':'תלמידים נרשמים','ערך':summary.students},
                    {'מדד':'שכבות','ערך':summary.grades},
                    {'מדד':'קורסים','ערך':summary.courses},
                    {'מדד':'קורסים מלאים','ערך':summary.full},
                    {'מדד':'תלמידים ברשימת המתנה','ערך':summary.waitStudents},
                    {'מדד':'מקומות פנויים','ערך':summary.freeSeats},
                    {'מדד':'תפוסה ממוצעת','ערך':`${summary.avgOccupancy}%`}
                ]);
                addSheet('תלמידים', filteredStudents.map((s,i)=>({
                    '#':i+1,'שם פרטי':s.firstName||'','שם משפחה':s.lastName||'','שכבה':getGradeName(s.gradeId),
                    'דוא״ל הורה':s.email||'','תאריך':s.date||'',
                    'א-1 עדיפות 1':getCourseName(s.semA_1_opt1),'א-1 עדיפות 2':getCourseName(s.semA_1_opt2),
                    'א-2 עדיפות 1':getCourseName(s.semA_2_opt1),'א-2 עדיפות 2':getCourseName(s.semA_2_opt2),
                    'ב-1 עדיפות 1':getCourseName(s.semB_1_opt1),'ב-1 עדיפות 2':getCourseName(s.semB_1_opt2),
                    'ב-2 עדיפות 1':getCourseName(s.semB_2_opt1),'ב-2 עדיפות 2':getCourseName(s.semB_2_opt2)
                })));
                addSheet('תפוסת קורסים', courseStats.map(c=>({
                    'קורס':c.name,'שכבה':getGradeName(c.gradeId),'מחצית':c.semester,'שעה':c.track,
                    'רשומים':c.primaryCount,'קיבולת':c.capacity,'פנויים':c.free,'המתנה':c.waitCount,'תפוסה':`${c.percent}%`,'סטטוס':c.status
                })));
                addSheet('רשימת המתנה', waitlistEntries.map((e,i)=>({
                    '#':i+1,'תלמיד/ה':`${e.student.firstName} ${e.student.lastName}`,'שכבה':getGradeName(e.student.gradeId),
                    'קורס':e.courseName,'מחצית / שעה':e.slotLabel,'דוא״ל הורה':e.student.email||'','תאריך':e.student.date||''
                })));
                addSheet('חריגים', exceptions.map((e,i)=>({
                    '#':i+1,'סוג':e.type,'תלמיד/קורס':e.student ? `${e.student.firstName} ${e.student.lastName}` : e.course?.name || '',
                    'שכבה':e.student ? getGradeName(e.student.gradeId) : e.course ? getGradeName(e.course.gradeId) : '','פירוט':e.detail
                })));
                XLSX.writeFile(wb, `מרכז_דוחות_${safeFile(campusTitle)}_${new Date().toLocaleDateString('he-IL').replaceAll('/','-')}.xlsx`);
            };

            const exportCurrentExcel = () => {
                if (typeof XLSX === 'undefined') return alert("ספריית Excel טרם נטענה");
                let data=[], name='דוח';
                if (reportType==='all') { name='נרשמים'; data=filteredStudents.map((s,i)=>({'#':i+1,'שם':`${s.firstName} ${s.lastName}`,'שכבה':getGradeName(s.gradeId),'דוא״ל':s.email||'','תאריך':s.date||''})); }
                if (reportType==='course_roster') { name='רשימת_קורס'; data=courseRoster.map((x,i)=>({'#':i+1,'שם':`${x.student.firstName} ${x.student.lastName}`,'שכבה':getGradeName(x.student.gradeId),'סטטוס':x.waitlist?'רשימת המתנה':x.priority===1?'עדיפות ראשונה':'עדיפות שנייה','דוא״ל':x.student.email||''})); }
                if (reportType==='occupancy') { name='תפוסה'; data=courseStats.filter(c=>selectedGradeFilter==='all'||c.gradeId===selectedGradeFilter).map(c=>({'קורס':c.name,'שכבה':getGradeName(c.gradeId),'רשומים':c.primaryCount,'קיבולת':c.capacity,'פנויים':c.free,'המתנה':c.waitCount,'תפוסה':`${c.percent}%`,'סטטוס':c.status})); }
                if (reportType==='waitlist') { name='רשימת_המתנה'; data=waitlistEntries.map((e,i)=>({'#':i+1,'שם':`${e.student.firstName} ${e.student.lastName}`,'שכבה':getGradeName(e.student.gradeId),'קורס':e.courseName,'מחצית/שעה':e.slotLabel,'דוא״ל':e.student.email||''})); }
                if (reportType==='exceptions') { name='חריגים'; data=exceptions.map((e,i)=>({'#':i+1,'סוג':e.type,'שם':e.student?`${e.student.firstName} ${e.student.lastName}`:e.course?.name||'','פירוט':e.detail})); }
                if (reportType==='summary') { name='סיכום_קמפוס'; data=[{'מדד':'תלמידים','ערך':summary.students},{'מדד':'שכבות','ערך':summary.grades},{'מדד':'קורסים','ערך':summary.courses},{'מדד':'קורסים מלאים','ערך':summary.full},{'מדד':'תלמידים בהמתנה','ערך':summary.waitStudents},{'מדד':'מקומות פנויים','ערך':summary.freeSeats},{'מדד':'תפוסה ממוצעת','ערך':`${summary.avgOccupancy}%`}]; }
                if (reportType==='student' && selectedStudent) { name=`שיבוץ_${selectedStudent.firstName}_${selectedStudent.lastName}`; data=[
                    {'מחצית / שעה':'מחצית א׳ · שעה 1','עדיפות 1':getCourseName(selectedStudent.semA_1_opt1),'עדיפות 2':getCourseName(selectedStudent.semA_1_opt2)},
                    {'מחצית / שעה':'מחצית א׳ · שעה 2','עדיפות 1':getCourseName(selectedStudent.semA_2_opt1),'עדיפות 2':getCourseName(selectedStudent.semA_2_opt2)},
                    {'מחצית / שעה':'מחצית ב׳ · שעה 1','עדיפות 1':getCourseName(selectedStudent.semB_1_opt1),'עדיפות 2':getCourseName(selectedStudent.semB_1_opt2)},
                    {'מחצית / שעה':'מחצית ב׳ · שעה 2','עדיפות 1':getCourseName(selectedStudent.semB_2_opt1),'עדיפות 2':getCourseName(selectedStudent.semB_2_opt2)}
                ]; }
                const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'דוח');
                XLSX.writeFile(wb,`${safeFile(name)}_${new Date().toLocaleDateString('he-IL').replaceAll('/','-')}.xlsx`);
            };

            const reportLabel = {
                summary:'סיכום קמפוס', all:'דוח נרשמים לפי שכבה', course_roster:'נרשמים לפי קורס',
                occupancy:'תפוסת קורסים', waitlist:'רשימת המתנה', student:'דוח שיבוץ תלמיד', exceptions:'דוח חריגים'
            }[reportType];

            const reportButtons = [
                ['summary','📈','סיכום קמפוס'],['all','👥','נרשמים / שכבה'],['course_roster','🎓','לפי קורס'],
                ['occupancy','📊','תפוסת קורסים'],['waitlist','⏳','רשימת המתנה'],['student','📄','שיבוץ תלמיד'],['exceptions','⚠️','חריגים']
            ];

            return (
                <div className="space-y-6 fade-up">
                    <div className="flex flex-col xl:flex-row justify-between xl:items-end gap-4 no-print">
                        <div>
                            <h2 className="text-4xl md:text-5xl font-extrabold tracking-tight text-gray-900">מרכז דוחות והדפסות</h2>
                            <p className="text-sm text-gray-500 mt-1">{campusTitle} · דוחות ניהוליים, שיבוצים, תפוסה ורשימות המתנה</p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={exportWorkbook} className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2.5 rounded-xl">📚 Excel מלא</button>
                            <button onClick={exportCurrentExcel} className="bg-gradient-to-l from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold px-4 py-2.5 rounded-xl">📊 Excel הדוח</button>
                            <button onClick={()=>window.print()} className="bg-gradient-to-l from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold px-4 py-2.5 rounded-xl">🖨️ הדפסה / PDF</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3 no-print">
                        {reportButtons.map(([id,icon,label])=>(
                            <button key={id} onClick={()=>setReportType(id)} className={`p-4 rounded-2xl border text-center transition-all ${reportType===id?'bg-indigo-600 border-indigo-600 text-white shadow-lg':'bg-white border-gray-200 text-gray-700 hover:border-indigo-300'}`}>
                                <div className="text-2xl mb-1">{icon}</div><div className="text-xs font-bold">{label}</div>
                            </button>
                        ))}
                    </div>

                    {(reportType==='all' || reportType==='occupancy') && (
                        <div className="bg-white p-4 rounded-2xl border flex flex-col md:flex-row gap-3 no-print">
                            {reportType==='all' && <input value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="חיפוש תלמיד..." className="flex-1 p-3 border rounded-xl" />}
                            <select value={selectedGradeFilter} onChange={e=>setSelectedGradeFilter(e.target.value)} className="p-3 border rounded-xl bg-white min-w-52">
                                <option value="all">כל השכבות</option>{grades.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
                            </select>
                            {reportType==='all' && <label className="flex items-center gap-2 px-3"><input type="checkbox" checked={showOpt2} onChange={e=>setShowOpt2(e.target.checked)}/> הצג עדיפות שנייה</label>}
                        </div>
                    )}
                    {reportType==='course_roster' && <div className="bg-white p-4 rounded-2xl border no-print"><select value={selectedCourseId} onChange={e=>setSelectedCourseId(e.target.value)} className="w-full p-3 border rounded-xl bg-white">{courses.map(c=><option key={c.id} value={c.id}>{c.name} · {getGradeName(c.gradeId)} · מחצית {c.semester} · {c.track}</option>)}</select></div>}
                    {reportType==='student' && <div className="bg-white p-4 rounded-2xl border no-print"><select value={selectedStudentId} onChange={e=>setSelectedStudentId(e.target.value)} className="w-full p-3 border rounded-xl bg-white"><option value="">בחר תלמיד/ה...</option>{[...students].sort((a,b)=>(a.lastName||'').localeCompare(b.lastName||'','he')).map(s=><option key={s.id} value={s.id}>{s.firstName} {s.lastName} · {getGradeName(s.gradeId)}</option>)}</select></div>}

                    <div id="print-area" className="bg-white rounded-2xl border shadow-sm p-5 md:p-7">
                        <div className="text-center border-b pb-4 mb-5">
                            <h1 className="text-2xl font-extrabold text-gray-900">{settings.schoolName || 'מרכז מדע ודעת למצטיינים ומחוננים'}</h1>
                            <div className="font-bold text-indigo-700 mt-1">{campusTitle}</div>
                            <div className="text-lg font-bold mt-2">{reportLabel}</div>
                            <div className="text-xs text-gray-400 mt-1">תאריך הפקה: {new Date().toLocaleDateString('he-IL')} · {new Date().toLocaleTimeString('he-IL')}</div>
                        </div>

                        {reportType==='summary' && <div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-7">
                                {[['תלמידים',summary.students],['שכבות',summary.grades],['קורסים',summary.courses],['קורסים מלאים',summary.full],['תלמידים בהמתנה',summary.waitStudents],['רשומות המתנה',summary.waitEntries],['מקומות פנויים',summary.freeSeats],['תפוסה ממוצעת',`${summary.avgOccupancy}%`]].map(([l,v])=><div key={l} className="border rounded-2xl p-4 text-center"><div className="text-xs text-gray-500 font-bold">{l}</div><div className="text-3xl font-extrabold text-gray-900 mt-1">{v}</div></div>)}
                            </div>
                            <h3 className="font-bold text-lg mb-3">מצב הקורסים</h3>
                            <table className="w-full text-right text-sm border-collapse"><thead><tr className="bg-gray-100"><th className="p-2 border">קורס</th><th className="p-2 border">שכבה</th><th className="p-2 border">רשומים</th><th className="p-2 border">המתנה</th><th className="p-2 border">תפוסה</th><th className="p-2 border">סטטוס</th></tr></thead><tbody>{courseStats.map(c=><tr key={c.id}><td className="p-2 border font-bold">{c.name}</td><td className="p-2 border">{getGradeName(c.gradeId)}</td><td className="p-2 border">{c.primaryCount}/{c.capacity}</td><td className="p-2 border">{c.waitCount}</td><td className="p-2 border">{c.percent}%</td><td className="p-2 border font-bold">{c.status}</td></tr>)}</tbody></table>
                        </div>}

                        {reportType==='all' && <div className="overflow-x-auto"><table className="w-full text-right text-xs border-collapse"><thead><tr className="bg-gray-100"><th className="p-2 border">תלמיד/ה</th><th className="p-2 border">שכבה</th><th className="p-2 border">מייל</th><th className="p-2 border">א׳ שעה 1</th><th className="p-2 border">א׳ שעה 2</th><th className="p-2 border">ב׳ שעה 1</th><th className="p-2 border">ב׳ שעה 2</th></tr></thead><tbody>{filteredStudents.map(s=><tr key={s.id}><td className="p-2 border font-bold">{s.firstName} {s.lastName}</td><td className="p-2 border">{getGradeName(s.gradeId)}</td><td className="p-2 border">{s.email||'-'}</td>{['semA_1','semA_2','semB_1','semB_2'].map(k=><td key={k} className="p-2 border"><b>{getCourseName(s[`${k}_opt1`])}</b>{showOpt2&&<div className="text-gray-500">2: {getCourseName(s[`${k}_opt2`])}</div>}</td>)}</tr>)}</tbody></table>{!filteredStudents.length&&<div className="p-8 text-center text-gray-400">אין תלמידים להצגה.</div>}</div>}

                        {reportType==='course_roster' && <div>{selectedCourse?<><div className="bg-gray-50 border rounded-xl p-4 mb-4"><b>{selectedCourse.name}</b> · {getGradeName(selectedCourse.gradeId)} · מחצית {selectedCourse.semester} · {selectedCourse.track}</div><table className="w-full text-right text-sm border-collapse"><thead><tr className="bg-gray-100"><th className="p-2 border">#</th><th className="p-2 border">תלמיד/ה</th><th className="p-2 border">שכבה</th><th className="p-2 border">מייל</th><th className="p-2 border">סטטוס</th></tr></thead><tbody>{courseRoster.map((x,i)=><tr key={x.student.id}><td className="p-2 border">{i+1}</td><td className="p-2 border font-bold">{x.student.firstName} {x.student.lastName}</td><td className="p-2 border">{getGradeName(x.student.gradeId)}</td><td className="p-2 border">{x.student.email||'-'}</td><td className="p-2 border">{x.waitlist?'רשימת המתנה':x.priority===1?'עדיפות ראשונה':'עדיפות שנייה'}</td></tr>)}</tbody></table></>:<div className="text-center text-gray-400">אין קורסים.</div>}</div>}

                        {reportType==='occupancy' && <div className="overflow-x-auto"><table className="w-full text-right text-sm border-collapse"><thead><tr className="bg-gray-100"><th className="p-2 border">קורס</th><th className="p-2 border">שכבה</th><th className="p-2 border">מחצית/שעה</th><th className="p-2 border">רשומים</th><th className="p-2 border">קיבולת</th><th className="p-2 border">פנויים</th><th className="p-2 border">המתנה</th><th className="p-2 border">סטטוס</th></tr></thead><tbody>{courseStats.filter(c=>selectedGradeFilter==='all'||c.gradeId===selectedGradeFilter).map(c=><tr key={c.id}><td className="p-2 border font-bold">{c.name}</td><td className="p-2 border">{getGradeName(c.gradeId)}</td><td className="p-2 border">מחצית {c.semester} · {c.track}</td><td className="p-2 border">{c.primaryCount}</td><td className="p-2 border">{c.capacity}</td><td className="p-2 border">{c.free}</td><td className="p-2 border">{c.waitCount}</td><td className="p-2 border font-bold">{c.status}</td></tr>)}</tbody></table></div>}

                        {reportType==='waitlist' && <div className="overflow-x-auto"><table className="w-full text-right text-sm border-collapse"><thead><tr className="bg-gray-100"><th className="p-2 border">#</th><th className="p-2 border">תלמיד/ה</th><th className="p-2 border">שכבה</th><th className="p-2 border">קורס</th><th className="p-2 border">מחצית/שעה</th><th className="p-2 border">מייל הורה</th></tr></thead><tbody>{waitlistEntries.map((e,i)=><tr key={`${e.student.id}_${e.courseId}_${i}`}><td className="p-2 border">{i+1}</td><td className="p-2 border font-bold">{e.student.firstName} {e.student.lastName}</td><td className="p-2 border">{getGradeName(e.student.gradeId)}</td><td className="p-2 border">{e.courseName}</td><td className="p-2 border">{e.slotLabel}</td><td className="p-2 border">{e.student.email||'-'}</td></tr>)}</tbody></table>{!waitlistEntries.length&&<div className="p-8 text-center text-gray-400">אין תלמידים ברשימת המתנה.</div>}</div>}

                        {reportType==='student' && <div>{selectedStudent?<><div className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-gray-50 border rounded-xl p-4 mb-5"><div><span className="text-xs text-gray-500">תלמיד/ה</span><div className="font-bold">{selectedStudent.firstName} {selectedStudent.lastName}</div></div><div><span className="text-xs text-gray-500">שכבה</span><div className="font-bold">{getGradeName(selectedStudent.gradeId)}</div></div><div><span className="text-xs text-gray-500">דוא״ל הורה</span><div className="font-bold">{selectedStudent.email||'-'}</div></div></div><table className="w-full text-right border-collapse"><thead><tr className="bg-gray-100"><th className="p-3 border">מחצית / שעה</th><th className="p-3 border">עדיפות ראשונה</th><th className="p-3 border">עדיפות שנייה</th><th className="p-3 border">המתנה</th></tr></thead><tbody>{[['מחצית א׳ · שעה 1','semA_1'],['מחצית א׳ · שעה 2','semA_2'],['מחצית ב׳ · שעה 1','semB_1'],['מחצית ב׳ · שעה 2','semB_2']].map(([l,k])=><tr key={k}><td className="p-3 border font-bold">{l}</td><td className="p-3 border">{getCourseName(selectedStudent[`${k}_opt1`])}</td><td className="p-3 border">{getCourseName(selectedStudent[`${k}_opt2`])}</td><td className="p-3 border">{selectedStudent[`${k}_waitlist`]?getCourseName(selectedStudent[`${k}_waitlist`]):'-'}</td></tr>)}</tbody></table></>:<div className="p-8 text-center text-gray-400">בחר תלמיד/ה.</div>}</div>}

                        {reportType==='exceptions' && <div className="overflow-x-auto"><table className="w-full text-right text-sm border-collapse"><thead><tr className="bg-gray-100"><th className="p-2 border">#</th><th className="p-2 border">סוג חריגה</th><th className="p-2 border">תלמיד / קורס</th><th className="p-2 border">שכבה</th><th className="p-2 border">פירוט</th></tr></thead><tbody>{exceptions.map((e,i)=><tr key={i}><td className="p-2 border">{i+1}</td><td className="p-2 border font-bold">{e.type}</td><td className="p-2 border">{e.student?`${e.student.firstName} ${e.student.lastName}`:e.course?.name||'-'}</td><td className="p-2 border">{e.student?getGradeName(e.student.gradeId):e.course?getGradeName(e.course.gradeId):'-'}</td><td className="p-2 border">{e.detail}</td></tr>)}</tbody></table>{!exceptions.length&&<div className="p-8 text-center text-green-700 font-bold">לא נמצאו חריגים.</div>}</div>}
                    </div>
                </div>
            );
        };

        const AdminSettings = ({ settings, db, adminCreds }) => {
            const [newUsername, setNewUsername] = useState(adminCreds?.username || "admin");
            const [newPassword, setNewPassword] = useState("");
            const [updateMsg, setUpdateMsg] = useState("");

            const handleUpdateCreds = async (e) => {
                e.preventDefault();
                if(!newUsername) return alert("שם משתמש לא יכול להיות ריק");
                if(!newPassword) return alert("יש להזין סיסמה חדשה");
                
                try {
                    const hash = await hashString(newPassword);
                    await window.FirebaseAPI.setDoc(window.FirebaseAPI.getPublicDocRef('settings', 'admin'), {
                        username: newUsername,
                        passwordHash: hash
                    });
                    setUpdateMsg("פרטי ההתחברות עודכנו בהצלחה!");
                    setNewPassword("");
                    setTimeout(() => setUpdateMsg(""), 3000);
                } catch(err) {
                    alert("שגיאה בעדכון הפרטים");
                    console.error(err);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm max-w-2xl animate-[slideIn_0.3s_ease-out]">
                        <h2 className="text-xl font-bold text-gray-800 mb-6">הגדרות פתיח וכללי (נשמר במסד נתונים)</h2>
                        <div className="space-y-4">
                            <div><label className="block text-sm font-medium mb-1">שם המוסד</label><input type="text" className="w-full p-3 border rounded-xl" value={settings.schoolName} onChange={e => db.saveSettings({...settings, schoolName: e.target.value})} /></div>
                            <div><label className="block text-sm font-medium mb-1">כותרת פתיחה</label><input type="text" className="w-full p-3 border rounded-xl" value={settings.welcomeTitle} onChange={e => db.saveSettings({...settings, welcomeTitle: e.target.value})} /></div>
                            <div>
                                <label className="block text-sm font-medium mb-1">שנת לימודים</label>
                                <input
                                    type="text"
                                    className="w-full p-3 border rounded-xl"
                                    value={settings.year || ''}
                                    onChange={e => db.saveSettings({...settings, year: e.target.value})}
                                    placeholder='למשל: תשפ"ו'
                                />
                                <div className="text-xs text-gray-400 mt-1">השנה תופיע במסך הפתיחה, באישורים ובדוחות.</div>
                            </div>
                            <div><label className="block text-sm font-medium mb-1">טקסט הודעת פתיחה</label><textarea className="w-full p-3 border rounded-xl h-48" value={settings.welcomeText} onChange={e => db.saveSettings({...settings, welcomeText: e.target.value})}></textarea></div>
                            <div className="pt-4 text-sm text-green-600 font-bold">* ההגדרות נשמרות אוטומטית בענן בעת הקלדה.</div>
                        </div>
                    </div>

                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm max-w-2xl animate-[slideIn_0.3s_ease-out]">
                        <h2 className="text-xl font-bold text-gray-800 mb-6">שינוי פרטי התחברות לניהול</h2>
                        <form onSubmit={handleUpdateCreds} className="space-y-4">
                            {updateMsg && <div className="bg-green-100 text-green-800 p-3 rounded-xl text-sm font-bold">{updateMsg}</div>}
                            <div>
                                <label className="block text-sm font-medium mb-1">שם משתמש לניהול</label>
                                <input type="text" dir="ltr" className="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" value={newUsername} onChange={e => setNewUsername(e.target.value)} required />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">סיסמה חדשה</label>
                                <input type="password" dir="ltr" className="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="הזן סיסמה חדשה" required />
                            </div>
                            <button type="submit" className="bg-gray-900 hover:bg-black text-white px-6 py-3 rounded-xl font-bold shadow-md transition-all">
                                עדכן פרטי התחברות
                            </button>
                            <p className="text-xs text-gray-500">* הסיסמה נשמרת במסד הנתונים באופן מוצפן (SHA-256 Hash) לבטיחות מירבית.</p>
                        </form>
                    </div>
                </div>
            );
        };

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
